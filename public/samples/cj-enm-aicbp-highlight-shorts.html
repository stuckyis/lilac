  /** 선택 장면 구간(tempStart~tempEnd) 안에서만 재생되도록 제어 (useSceneBoundaryControl) */
  const useSceneBoundaryControl = videoRef => {
    useEffect(() => {
      const video = videoRef.current
      if (!video) return
      let isBoundarySeek = false
      let pending = null // 장면 선택으로 시간 이동 중 선택 해제 방지용
      const unsub = subscribeEdit((state, prev) => {
        const req = state.seekRequest
        if (req && req !== prev.seekRequest && req.skipBoundaryCheck) pending = { targetTime: req.time, sceneId: state.selectedScene?.sceneId ?? '' }
      })
      const activeOf = list => list.filter(s => s.order !== -1).sort((a, b) => a.order - b.order)
      const onSeeked = () => {
        if (isBoundarySeek) { isBoundarySeek = false; return }
        const { selectedScene, selectedSceneList, setSelectedScene, setIsEditing } = useEditStore.getState()
        const ct = video.currentTime
        if (pending && selectedScene?.sceneId === pending.sceneId) {
          const { tempStart, tempEnd } = selectedScene
          if (pending.targetTime >= tempStart && pending.targetTime <= tempEnd) {
            if (ct < tempStart || ct > tempEnd) return
            pending = null
            return
          }
        }
        pending = null
        if (!selectedScene || !activeOf(selectedSceneList).some(s => s.sceneId === selectedScene.sceneId)) return
        // 사용자가 구간 밖으로 재생 위치를 옮기면 선택 해제
        if (ct < selectedScene.tempStart || ct > selectedScene.tempEnd) { setSelectedScene(null); setIsEditing(false) }
      }
      const onTimeUpdate = () => {
        if (video.paused) return
        const { selectedScene, selectedSceneList, setSelectedScene, setPlayerState } = useEditStore.getState()
        if (!selectedScene) return
        const active = activeOf(selectedSceneList)
        const idx = active.findIndex(s => s.sceneId === selectedScene.sceneId)
        if (idx === -1 || video.currentTime < selectedScene.tempEnd) return
        const next = active[idx + 1]
        if (next) {
          setSelectedScene(next) // 장면 끝 → 다음 장면, 원본이 이어진 분할 장면이면 seek 없이 계속
          if (video.currentTime < next.tempStart) { isBoundarySeek = true; video.currentTime = next.tempStart }
        } else {
          isBoundarySeek = true
          video.currentTime = selectedScene.tempStart // 마지막 장면 종료 → 일시정지 + 장면 시작으로 되감기
          setPlayerState({ isPlaying: false })
        }
      }
      video.addEventListener('seeked', onSeeked)
      video.addEventListener('timeupdate', onTimeUpdate)
      return () => { unsub(); video.removeEventListener('seeked', onSeeked); video.removeEventListener('timeupdate', onTimeUpdate) }
    }, [])
  }

  function PlayerSection({ vodId }) {
    const videoRef = useRef(null)
    const containerRef = useRef(null)
    const [isReasonOpen, setIsReasonOpen] = useState(false)
    const playInfo = useEditStore(s => s.player)
    const isPlaying = playInfo.isPlaying
    const seekRequest = useEditStore(s => s.seekRequest)
    const selectedScene = useEditStore(s => s.selectedScene)
    const isCaptionPreviewOn = useEditStore(s => s.isCaptionPreviewOn)
    const isBannerPreviewOn = useEditStore(s => s.isBannerPreviewOn)
    const captionYn = useEditStore(s => s.captionYn)
    const { vmOrgUrl } = useEditStore(s => s.detailInfo)
    const fixedList = useEditStore(s => s.fixedList)
    const analsList = useEditStore(s => s.analsList)
    const categoryList = useEditStore(s => s.categoryList)
    const { setPlayerState } = useEditStore.getState()
    const sceneSubtitles = useMemo(() => selectedScene?.subtitleData ?? [], [selectedScene])

    useEffect(() => { if (vodId) useEditStore.getState().fetchEditDetail(vodId) }, [vodId])
    useEffect(() => {
      const v = videoRef.current
      if (!v) return
      if (isPlaying) v.play().catch(() => setPlayerState({ isPlaying: false }))
      else v.pause()
    }, [isPlaying])
    useEffect(() => { if (seekRequest && videoRef.current) videoRef.current.currentTime = seekRequest.time }, [seekRequest])
    // useVideoStateSync — 영상 이벤트 → 스토어
    useEffect(() => {
      const v = videoRef.current
      if (!v) return
      const syncTime = () => setPlayerState({ currentTime: v.currentTime })
      const syncMeta = () => setPlayerState({ duration: Number.isFinite(v.duration) ? v.duration : 0, videoNaturalSize: { width: v.videoWidth, height: v.videoHeight } })
      const syncPlay = () => setPlayerState({ isPlaying: !v.paused && !v.ended })
      const list = [['timeupdate', syncTime], ['seeked', syncTime], ['loadedmetadata', syncMeta], ['durationchange', syncMeta], ['play', syncPlay], ['pause', syncPlay], ['ended', syncPlay]]
      list.forEach(([ev, fn]) => v.addEventListener(ev, fn))
      return () => list.forEach(([ev, fn]) => v.removeEventListener(ev, fn))
    }, [])
    useSceneBoundaryControl(videoRef)
    // 스페이스바로 재생/일시정지 토글 (텍스트 입력 제외)
    useEffect(() => {
      const onKey = e => {
        if (e.code !== 'Space' || useEditStore.getState().isHeaderModalOpen) return
        const tag = e.target.tagName.toLowerCase()
        if (tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return
        if (tag === 'input' && !['checkbox', 'radio', 'button', 'submit', 'reset'].includes(e.target.type.toLowerCase())) return
        e.preventDefault()
        setPlayerState({ isPlaying: !useEditStore.getState().player.isPlaying })
      }
      addEventListener('keydown', onKey)
      return () => removeEventListener('keydown', onKey)
    }, [])

    /** 선택한 시나리오 명 노출 */
    const scenarioName = (() => {
      if (!selectedScene || selectedScene.scenarioTpVal === 'EXPLOR' || selectedScene.scenarioTpVal === '') return ''
      const info = [...fixedList, ...analsList].find(i => i.scenarioId === selectedScene.scenarioId)
      if (!info) return ''
      const ctg = categoryList.find(i => i.stdioCtgCd === info.stdioCtgCd)?.stdioCtgNm || ''
      return selectedScene.scenarioTpVal === 'FIXED' ? `[${ctg}] ${info.scenarioNm}` : info.scenarioNm
    })()
    const showCaption = isCaptionPreviewOn && captionYn === 'Y'

    return html`<main class="border-bd-default bg-bg-subtle flex flex-1 flex-col gap-3 overflow-hidden border-y p-3 py-5">
      <div class="flex min-h-0 flex-1 flex-col items-center">
        <div class="flex min-h-0 w-full max-w-[75%] flex-1 flex-col gap-2">
          <div ref=${containerRef} class="relative min-h-0 flex-1 overflow-hidden rounded-xl shadow-lg">
            <${EditVideo} key=${`edit_${vodId}`} className="h-full" videoRef=${videoRef} src=${vmOrgUrl}
              overlay=${isBannerPreviewOn || showCaption ? html`
                ${isBannerPreviewOn && html`<${BannerOverlay} videoRef=${videoRef} />`}
                ${showCaption && html`<${CaptionOverlay} videoRef=${videoRef} subtitles=${sceneSubtitles} useCropFrame />`}` : undefined} />
            <${ReframeOverlay} videoRef=${videoRef} containerRef=${containerRef} />
          </div>
          <div class="flex shrink-0 items-center justify-center gap-2">
            <${Button} className="w-4 bg-transparent" variant="ghost" size="xs" leftIcon=${isPlaying ? I.Pause : I.Play} iconSize=${16} onClick=${() => setPlayerState({ isPlaying: !isPlaying })} />
            <p class="text-tx-strong text-sm font-bold tracking-widest tabular-nums">${formatVideoTime(playInfo.currentTime)}</p>
            <p class="text-tx-subtle text-xs">/</p>
            <p class="text-tx-caption text-xs tracking-widest tabular-nums">${formatVideoTime(playInfo.duration)}</p>
          </div>
        </div>
      </div>
      <div class="card mx-auto w-full max-w-[75%] shrink-0">
        <div class="flex flex-col gap-2 p-3">
          <div class="flex items-center gap-2 pb-0.5 text-xs">
            <div class="text-tx-primary flex items-center gap-1">
              <${Icon} icon=${I.CircleAlert} color="primary" size="sm" className="text-tx-primary h-4 w-4" />
              <span class="font-semibold">AI 큐레이터</span>
            </div>
            <span class="text-tx-subtle" aria-hidden="true">·</span>
            <span class="text-tx-caption">이 장면을 고른 이유예요</span>
            ${scenarioName && html`<span class="text-tx-subtle" aria-hidden="true">·</span>`}
            <span class="text-tx-muted">${scenarioName}</span>
          </div>
          <${HighlightText} variant="bg">
            <div class="flex cursor-pointer items-center justify-between gap-2" onClick=${() => setIsReasonOpen(p => !p)}>
              <strong class="text-sm font-bold">${selectedScene?.sceneTitle ?? '장면을 선택해 주세요'}</strong>
              <button type="button" class="text-tx-subtle hover:bg-bg-subtle flex h-6 w-6 items-center justify-center rounded-md transition-colors" aria-label=${isReasonOpen ? '이유 접기' : '이유 펼치기'}>
                ${isReasonOpen ? html`<${I.ChevronUp} size=${16} className="text-tx-strong shrink-0" />` : html`<${I.ChevronDown} size=${16} className="text-tx-strong shrink-0" />`}
              </button>
            </div>
            <div class=${`grid transition-all duration-500 ease-in-out ${isReasonOpen ? 'mt-2 grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'}`}>
              <div class="overflow-hidden"><p class="leading-body text-xs">${selectedScene?.sceneReason ?? '타임라인에서 장면을 클릭하면 AI가 선정한 이유를 보여드려요.'}</p></div>
            </div>
          <//>
        </div>
      </div>
    </main>`
  }

  /* =====================================================================
   * 하단 타임라인
   * ===================================================================== */
  /** 타임라인 편집 상태(초안 시간·리프레임 스위치)와 장면 전환 dirty 가드 (useTimelineEditOrchestration) */
  const useTimelineEditOrchestration = () => {
    const selectedScene = useEditStore(s => s.selectedScene)
    const isEditing = useEditStore(s => s.isEditing)
    const isEditCaption = useEditStore(s => s.isEditCaption)
    const overlayCropDirty = useEditStore(s => s.overlayCropDirty)
    const [draftTimeCode, setDraftTimeCode] = useState(null)
    const [reframePending, setReframePending] = useState(null)
    const [aiReframePending, setAiReframePending] = useState(null)
    const { open: openConfirm, close: closeConfirm, alertProps } = useAlert()
    const reframeCommitted = selectedScene?.isCrop ?? false
    const reframeEffective = reframePending ?? reframeCommitted
    const isDirty = draftTimeCode !== null || (reframePending !== null && reframePending !== reframeCommitted) || overlayCropDirty
    const pending = useRef({ scene: null, closeEditor: false, add: false, action: null })

    useEffect(() => { setDraftTimeCode(null); setReframePending(null); setAiReframePending(null) }, [selectedScene?.sceneId])
    useEffect(() => { useEditStore.getState().setIsReframe(isEditing ? (reframePending ?? selectedScene?.isCrop ?? false) : false) }, [isEditing, selectedScene?.sceneId, selectedScene?.isCrop, reframePending])

    const onConfirm = () => {
      setDraftTimeCode(null); setReframePending(null)
      useEditStore.getState().setOverlayCropDirty(false)
      closeConfirm()
      const p = pending.current
      if (p.action) { p.action(); p.action = null; return }
      const { addScene, setSelectedScene, playFromTime, setIsEditing } = useEditStore.getState()
      if (p.scene) {
        if (p.add) addScene(p.scene)
        const resolved = useEditStore.getState().selectedSceneList.find(s => s.sceneId === p.scene.sceneId) ?? p.scene
        setSelectedScene(resolved)
        playFromTime(resolved.tempStart ?? resolved.originStart ?? resolved.startTime)
        setIsEditing(p.closeEditor)
        pending.current = { scene: null, closeEditor: false, add: false, action: null }
      }
    }
    const onCancel = () => { closeConfirm(); pending.current = { scene: null, closeEditor: false, add: false, action: null } }
    const openDirtyConfirm = () => openConfirm({ variant: 'warning', title: '적용하지 않은 편집 내용은 사라집니다.', description: '계속하시겠습니까?',
      buttons: [{ label: '취소', variant: 'outline', onClick: onCancel }, { label: '확인', variant: 'danger', onClick: onConfirm }] })
    const onCheckDirtyGuard = onProceed => {
      if (!isDirty) return onProceed()
      pending.current.action = onProceed
      openDirtyConfirm()
    }
    /** 장면 선택 (선택 트랙 / 추출 트랙 / 우측 선택 장면 목록 공통) */
    const onSelect = (sceneData, isEdit, isAdd = false) => {
      const isSameScene = sceneData.sceneId === selectedScene?.sceneId
      if (!isDirty || isSameScene || isEditCaption) {
        const { addScene, playFromTime, setSelectedScene, setIsEditing, player } = useEditStore.getState()
        if (isAdd) addScene(sceneData)
        const scene = useEditStore.getState().selectedSceneList.find(s => s.sceneId === sceneData.sceneId) ?? sceneData
        const isOutOfBounds = player.currentTime < scene.tempStart || player.currentTime > scene.tempEnd
        setSelectedScene(scene)
        if (!isSameScene || isOutOfBounds) playFromTime(scene.tempStart ?? scene.originStart ?? scene.startTime)
        setIsEditing(isEdit)
      } else {
        pending.current = { scene: sceneData, closeEditor: isEdit, add: isAdd, action: null }
        openDirtyConfirm()
      }
    }
    const onDraftChange = (start, end) => {
      const scene = useEditStore.getState().selectedScene
      if (scene) setDraftTimeCode({ sceneId: scene.sceneId, start, end })
    }
    /** 시간 및 리프레임을 스토어에 반영하고 편집 모드 종료 */
    const onApply = () => {
      const st = useEditStore.getState(), scene = st.selectedScene
      const reframeAtApply = reframePending ?? scene?.isCrop ?? false
      if (draftTimeCode && scene && draftTimeCode.sceneId === scene.sceneId) {
        st.patchSelectedSceneTime(scene.sceneId, draftTimeCode.start, draftTimeCode.end)
        setDraftTimeCode(null)
      }
      if (reframeAtApply && scene && st.overlayNaturalCropGetter) {
        const ac = st.overlayNaturalCropGetter()
        if (ac && ac.width > 0 && ac.height > 0) st.patchSelectedSceneCrop({ xPos: ac.x, yPos: ac.y, width: ac.width, height: ac.height })
      } else if (!reframeAtApply && scene) st.clearSelectedSceneReframe()
      if (scene) st.patchSelectedSceneAiReframe(aiReframePending ?? scene.isAiReframe ?? false)
      setReframePending(null); setAiReframePending(null)
      st.setOverlayCropDirty(false); st.setIsReframe(false); st.setIsEditing(false)
    }
    return { draftTimeCode, reframeEffective, setReframePending, aiReframePending, setAiReframePending, onApply, onDraftChange, onSelect, onCheckDirtyGuard, alertProps, isEditing }
  }

  /** 편집 패널 그립 드래그 이동 (useTimelineEditorPanelDrag) — 위치는 숨겼다 보여도 유지 */
  let savedPanelPosition = null
  const clampToViewport = (x, y, w, h) => ({ x: clamp(x, 0, Math.max(0, innerWidth - w)), y: clamp(y, 0, Math.max(0, innerHeight - h)) })
  const useTimelineEditorPanelDrag = isVisible => {
    const panelRef = useRef(null), anchorRef = useRef(null)
    const apply = (panel, p) => { panel.style.transform = `translate3d(${p.x}px, ${p.y}px, 0)` }
    useLayoutEffect(() => {
      const panel = panelRef.current
      if (!isVisible || !panel) return
      const { width, height } = panel.getBoundingClientRect()
      if (!savedPanelPosition) {
        const a = anchorRef.current?.getBoundingClientRect()
        if (!a) return
        savedPanelPosition = { x: a.left + (a.width - width) / 2, y: a.top }
      }
      savedPanelPosition = clampToViewport(savedPanelPosition.x, savedPanelPosition.y, width, height)
      apply(panel, savedPanelPosition)
    }, [isVisible])
    useEffect(() => {
      if (!isVisible) return
      const onResize = () => {
        const panel = panelRef.current
        if (!panel || !savedPanelPosition) return
        const { width, height } = panel.getBoundingClientRect()
        savedPanelPosition = clampToViewport(savedPanelPosition.x, savedPanelPosition.y, width, height)
        apply(panel, savedPanelPosition)
      }
      addEventListener('resize', onResize)
      return () => removeEventListener('resize', onResize)
    }, [isVisible])
    const handleGripMouseDown = e => {
      e.preventDefault(); e.stopPropagation()
      const panel = panelRef.current
      if (!panel) return
      const r = panel.getBoundingClientRect(), sx = e.clientX, sy = e.clientY
      const prevSelect = document.body.style.userSelect
      document.body.style.userSelect = 'none'
      const onMove = ev => {
        if (ev.buttons === 0) return onUp()
        if (!panelRef.current) return
        savedPanelPosition = clampToViewport(r.left + ev.clientX - sx, r.top + ev.clientY - sy, r.width, r.height)
        apply(panelRef.current, savedPanelPosition)
      }
      const onUp = () => { removeEventListener('mousemove', onMove); removeEventListener('mouseup', onUp); document.body.style.userSelect = prevSelect }
      addEventListener('mousemove', onMove); addEventListener('mouseup', onUp)
    }
    return { panelRef, anchorRef, handleGripMouseDown }
  }

  /** 떠 있는 장면 편집 바 — 시작/종료 시각 입력, 분할, 크롭/AI 리프레임, 적용 (TimelineEditor) */
  function TimelineEditor({ onApply, draftTimeCode, onDraftChange, reframeChecked, onReframeCheckedChange, aiReframeChecked, onAiReframeCheckedChange, onGripMouseDown }) {
    const [focusId, setFocusId] = useState('')
    const selectedScene = useEditStore(s => s.selectedScene)
    const isEditCaption = useEditStore(s => s.isEditCaption)
    const isFitWithPadding = useEditStore(s => s.isFitWithPadding)
    const { open: openConfirm, close: closeConfirm, alertProps } = useAlert()
    // 타임라인 좌표 → 원본 영상 절대시간 오프셋
    const videoOffset = (selectedScene?.tempStart ?? selectedScene?.startTime ?? 0) - (selectedScene?.startTime ?? 0)
    const [timeCode, setTimeCode] = useState({ start: 0, end: 0 })
    const [startInput, setStartInput] = useState('00:00:00.000')
    const [endInput, setEndInput] = useState('00:00:00.000')
    const syncInputDisplay = (start, end) => { setStartInput(formatVideoTime(start + videoOffset, true)); setEndInput(formatVideoTime(end + videoOffset, true)) }
    useLayoutEffect(() => {
      if (!selectedScene) return
      setFocusId('')
      setTimeCode({ start: selectedScene.startTime, end: selectedScene.endTime })
      syncInputDisplay(selectedScene.startTime, selectedScene.endTime)
    }, [selectedScene?.sceneId])
    useLayoutEffect(() => {
      if (!selectedScene || !draftTimeCode || draftTimeCode.sceneId !== selectedScene.sceneId) return
      setTimeCode({ start: draftTimeCode.start, end: draftTimeCode.end })
      if (focusId !== 'start') setStartInput(formatVideoTime(draftTimeCode.start + videoOffset, true))
      if (focusId !== 'end') setEndInput(formatVideoTime(draftTimeCode.end + videoOffset, true))
    }, [draftTimeCode, selectedScene?.sceneId, focusId])

    const commitTimeInput = (id, raw) => {
      const parsed = tryParseTimeToSeconds(raw)
      let nextStart = timeCode.start, nextEnd = timeCode.end
      if (parsed !== null) {
        const composed = parsed - videoOffset // 사용자 입력은 원본 영상 절대시간
        if (id === 'start') nextStart = clamp(composed, selectedScene?.startTime ?? 0, timeCode.end - MIN_CLIP_GAP)
        else nextEnd = clamp(composed, timeCode.start + MIN_CLIP_GAP, selectedScene?.endTime ?? 0)
      }
      setTimeCode({ start: nextStart, end: nextEnd })
      onDraftChange(nextStart, nextEnd)
      syncInputDisplay(nextStart, nextEnd)
    }
    const onApplyConfirm = () => {
      const changed = draftTimeCode !== null && selectedScene !== null && (draftTimeCode.start > selectedScene.startTime || draftTimeCode.end < selectedScene.endTime)
      if (!changed) return onApply()
      openConfirm({ variant: 'info', title: '적용하시겠습니까?', description: '장면 길이를 변경하면 이전 상태로 되돌릴 수 없습니다.\n변경하기 전에 영상을 미리 확인하세요.', contentClassName: 'whitespace-pre-line',
        buttons: [{ label: '취소', variant: 'outline', onClick: closeConfirm }, { label: '확인', variant: 'primary', onClick: () => { closeConfirm(); onApply() } }] })
    }
    const onSceneSplit = () => {
      closeConfirm()
      if (!useEditStore.getState().splitSelectedScene()) {
        toast({ color: 'yellow', icon: I.CircleAlert, title: '장면을 분할할 수 없습니다.', description: '분할 지점이 장면의 시작/끝과 너무 가까워요.' })
        return
      }
      const updated = useEditStore.getState().selectedScene
      if (updated) { setFocusId(''); setTimeCode({ start: updated.startTime, end: updated.endTime }); syncInputDisplay(updated.startTime, updated.endTime) }
    }
    const onSplitConfirm = () => {
      if (!selectedScene || selectedScene.order === -1 || !selectedScene.sceneId) return
      openConfirm({ variant: 'info', title: '장면을 분할하시겠습니까?', description: '장면 분할 이후 다시 병합할 수 없습니다.\n분할하기 전에 영상을 미리 확인하세요.', contentClassName: 'whitespace-pre-line',
        buttons: [{ label: '취소', variant: 'outline', onClick: closeConfirm }, { label: '확인', variant: 'primary', onClick: onSceneSplit }] })
    }
    const splitRef = useRef(onSplitConfirm); splitRef.current = onSplitConfirm
    useEffect(() => {
      const onKey = e => {
        if (e.key.toLowerCase() !== 'b' || !(e.ctrlKey || e.metaKey)) return
        const tag = e.target.tagName.toLowerCase()
        if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return
        e.preventDefault()
        splitRef.current()
      }
      addEventListener('keydown', onKey)
      return () => removeEventListener('keydown', onKey)
    }, [])
    const inputProps = id => ({
      id, size: 'sm', className: 'w-33 tabular-nums', value: id === 'start' ? startInput : endInput, disabled: isEditCaption,
      onChange: e => { e.stopPropagation?.(); (id === 'start' ? setStartInput : setEndInput)(e.target.value) },
      onFocus: () => setFocusId(id),
      onBlur: e => { commitTimeInput(id, e.currentTarget.value); setFocusId('') },
      onKeyDown: e => { e.stopPropagation(); if (e.key === 'Enter') commitTimeInput(id, e.currentTarget.value) },
    })
    return html`<div class="card flex h-13 w-max max-w-full items-center gap-2 px-4 py-2 shadow-md">
      <div class="flex shrink-0 items-center gap-2">
        <${Button} variant="iconOnly" leftIcon=${I.GripVertical} size="xs" className="text-tx-caption cursor-grab border-none bg-transparent active:cursor-grabbing" onMouseDown=${onGripMouseDown} />
        <${Input} ...${inputProps('start')} />
        <span class="text-tx-caption text-xs">-</span>
        <${Input} ...${inputProps('end')} />
      </div>
      <${Button} variant="iconOnly" size="sm" title="Ctrl/⌘ + B" leftIcon=${I.SquareSplitHorizontal} onClick=${onSplitConfirm} disabled=${selectedScene?.order === -1 || !selectedScene?.sceneId} />
      <div class="bg-bg-subtle flex shrink-0 items-center rounded-xs p-1">
        <button type="button" onClick=${() => { onReframeCheckedChange(true); onAiReframeCheckedChange(false) }}
          class=${cn(TabButtonVariants({ variant: 'square', disabled: isFitWithPadding, isActive: reframeChecked && !aiReframeChecked }), 'min-w-0 flex-1 justify-center px-2 transition-none')}>
          <${I.Crop} size=${16} />크롭</button>
        <button type="button" onClick=${() => { onReframeCheckedChange(true); onAiReframeCheckedChange(true) }}
          class=${cn(TabButtonVariants({ variant: 'square', disabled: isFitWithPadding, isActive: reframeChecked && aiReframeChecked }), 'min-w-0 flex-1 justify-center transition-none')}>
          <img src=${ASSETS.badgeAi} alt="AI Reframe" class="w-8" aria-hidden="true" />AI 리프레임</button>
      </div>
      <${Button} variant="dark" size="sm" className="shrink-0 px-3" onClick=${onApplyConfirm} disabled=${isEditCaption}>적용<//>
      <${Alert} ...${alertProps} />
    </div>`
  }

  /** 시나리오 별 선택 장면 트랙 색상 (A: ANALS·FIXED / B: EXPLOR) */
  const TRACK_A = { style: 'bg-bg-blue border-bd-ott/40 hover:bg-bg-ott/40', active: 'opacity-100 bg-bg-ott/40' }
  const TRACK_B = { style: '[background:var(--gradient-track-fill-and-border)] brightness-[1.2] border-transparent hover:brightness-[1]', active: 'opacity-100 brightness-[1]' }
  const TRACK_COLORS = { ANALS: TRACK_A, FIXED: TRACK_A, EXPLOR: TRACK_B, '': TRACK_B } // '' = 수동 구간 추출 (원본엔 색 지정이 없어 탐색형 색을 씀)

  const calcPlayheadLeft = (currentTime, scenes, duration, width, selectedSceneId) => {
    if (!width || !duration) return -1
    const t = videoTimeToTimelineTime(currentTime, scenes, selectedSceneId)
    return t === null ? -1 : (t / duration) * width
  }

  /** 선택 장면 트랙 — 재생바, 장면 선택, 경계 드래그 핸들 (SelectTrack) */
  function SelectTrack({ duration, scenes = [], onSelect, previewTime, onDraftChange, onCheckDirtyGuard, isConfirmOpen }) {
    const containerRef = useRef(null), playheadRef = useRef(null)
    const selectedScene = useEditStore(s => s.selectedScene)
    const isEditCaption = useEditStore(s => s.isEditCaption)
    const widthRef = useRef(0)
    const latest = useRef({}); latest.current = { scenes, duration, selectedScene, onCheckDirtyGuard, isConfirmOpen }
    const updatePlayheadDom = (px, instant = false) => {
      const el = playheadRef.current
      if (!el) return
      el.style.display = px < 0 ? 'none' : 'block'
      if (px >= 0) { el.style.transition = instant ? 'none' : ''; el.style.left = `${px}px` }
    }
    useEffect(() => {
      const ro = new ResizeObserver(entries => {
        widthRef.current = entries[0]?.contentRect.width ?? 0
        const { scenes: sc, duration: d, selectedScene: sel } = latest.current
        if (!sel) return updatePlayheadDom(-1, true)
        updatePlayheadDom(calcPlayheadLeft(useEditStore.getState().player.currentTime, sc, d, widthRef.current, sel.sceneId), true)
      })
      ro.observe(containerRef.current)
      return () => ro.disconnect()
    }, [])
    // currentTime·선택 장면 변경 시 리렌더 없이 재생바 DOM 직접 갱신
    useEffect(() => subscribeEdit((state, prev) => {
      const { currentTime } = state.player
      const sceneChanged = state.selectedScene?.sceneId !== prev.selectedScene?.sceneId
      const seekChanged = state.seekRequest !== prev.seekRequest && state.seekRequest !== null
      if (currentTime === prev.player.currentTime && !sceneChanged && !seekChanged && state.selectedSceneList === prev.selectedSceneList) return
      if (!state.selectedScene) return updatePlayheadDom(-1, true)
      const t = sceneChanged ? state.selectedScene.tempStart : seekChanged ? state.seekRequest.time : currentTime
      const isSeek = Math.abs(t - prev.player.currentTime) > 0.5 || sceneChanged || seekChanged
      // 렌더 직후 값이 반영되도록 다음 프레임에 계산 (장면 목록·전체 길이 갱신 대기)
      requestAnimationFrame(() => updatePlayheadDom(calcPlayheadLeft(t, latest.current.scenes, latest.current.duration, widthRef.current, state.selectedScene.sceneId), isSeek))
    }), [])
    // 좌/우 방향키로 재생바 0.5초 이동, 장면이 바뀌면 미적용 편집 확인
    useEffect(() => {
      const onKey = e => {
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return
        const { scenes: sc, duration: d, selectedScene: sel, onCheckDirtyGuard: guard, isConfirmOpen: confirmOpen } = latest.current
        if (confirmOpen) return
        const tag = e.target.tagName.toLowerCase()
        if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return
        if (!sel || d <= 0) return
        const t = videoTimeToTimelineTime(useEditStore.getState().player.currentTime, sc, sel.sceneId)
        if (t === null) return
        const step = e.key === 'ArrowLeft' ? -MIN_CLIP_GAP : MIN_CLIP_GAP
        if ((step < 0 && t <= 0) || (step > 0 && t >= d)) return
        e.preventDefault()
        const next = clamp(t + step, 0, d)
        const nextScene = findSceneByTimelineTime(next, sc)
        const moveTo = () => seekToTimelinePosition(next, latest.current.scenes)
        if (nextScene && nextScene.sceneId !== sel.sceneId && guard) guard(moveTo)
        else moveTo()
      }
      addEventListener('keydown', onKey)
      return () => removeEventListener('keydown', onKey)
    }, [])
    const onPlayheadMouseDown = e => {
      e.stopPropagation(); e.preventDefault()
      const startX = e.clientX, startLeft = parseFloat(playheadRef.current?.style.left ?? '0')
      if (playheadRef.current) playheadRef.current.style.transition = 'none'
      const onMove = ev => {
        if (ev.buttons === 0) return onUp()
        const nextLeft = clamp(startLeft + ev.clientX - startX, 0, widthRef.current)
        if (playheadRef.current) playheadRef.current.style.left = `${nextLeft}px`
        if (widthRef.current && latest.current.duration) seekToTimelinePosition(pxToTimelineTime(nextLeft, widthRef.current, latest.current.duration), latest.current.scenes)
      }
      const onUp = () => { removeEventListener('mousemove', onMove); removeEventListener('mouseup', onUp); if (playheadRef.current) playheadRef.current.style.transition = '' }
      addEventListener('mousemove', onMove); addEventListener('mouseup', onUp)
    }
    /** 핸들 드래그로 선택 장면의 시작/종료 시간 조절 — 드래그 중엔 DOM 만, 놓을 때 초안 커밋 */
    const onDragHandler = (event, sceneItem) => {
      event.stopPropagation(); event.preventDefault()
      const handleId = event.currentTarget.dataset.handle
      if (!sceneItem.originStart || !sceneItem.originEnd) return
      const container = containerRef.current
      if (!container || duration <= 0) return
      const pxPerSec = container.getBoundingClientRect().width / duration
      const startX = event.clientX
      const isThis = previewTime?.sceneId === sceneItem.sceneId
      const initialStart = isThis ? previewTime.start : sceneItem.startTime, initialEnd = isThis ? previewTime.end : sceneItem.endTime
      const trackEl = event.currentTarget.parentElement
      let lastStart = initialStart, lastEnd = initialEnd
      const onMove = e => {
        if (e.buttons === 0) return onUp()
        const delta = (e.clientX - startX) / pxPerSec
        if (handleId === 'left') lastStart = clamp(initialStart + delta, sceneItem.startTime, initialEnd - MIN_CLIP_GAP)
        else lastEnd = clamp(initialEnd + delta, initialStart + MIN_CLIP_GAP, sceneItem.endTime)
        trackEl.style.left = `${(lastStart / duration) * 100}%`
        trackEl.style.width = `${((lastEnd - lastStart) / duration) * 100}%`
      }
      const onUp = () => { removeEventListener('mousemove', onMove); removeEventListener('mouseup', onUp); onDraftChange?.(lastStart, lastEnd) }
      addEventListener('mousemove', onMove); addEventListener('mouseup', onUp)
    }
    const hasScenes = duration > 0 && scenes.length > 0
    return html`<div ref=${containerRef} class="bg-bg-muted relative h-10 rounded-sm">
      ${hasScenes && html`
        ${scenes.map(sceneItem => {
          const isSelected = selectedScene?.sceneId === sceneItem.sceneId
          const isPreview = previewTime?.sceneId === sceneItem.sceneId && isSelected
          const start = isPreview ? previewTime.start : sceneItem.startTime, end = isPreview ? previewTime.end : sceneItem.endTime
          const colors = TRACK_COLORS[sceneItem.scenarioTpVal]
          return html`<div key=${sceneItem.sceneId} title=${sceneItem.sceneTitle} onClick=${() => onSelect(sceneItem, true)}
            class=${cn('group absolute inset-y-0 flex cursor-pointer justify-between rounded-md border-2 p-1 opacity-65', colors?.style, isSelected && colors?.active)}
            style=${{ left: `${(start / duration) * 100}%`, width: `${((end - start) / duration) * 100}%` }}>
            ${isSelected && !isEditCaption && html`
              <div data-handle="left" class="bg-ott-base h-full w-1.5 cursor-ew-resize rounded-full" onMouseDown=${e => onDragHandler(e, sceneItem)} onClick=${e => e.stopPropagation()}></div>
              <div data-handle="right" class="bg-ott-base h-full w-1.5 cursor-ew-resize rounded-full" onMouseDown=${e => onDragHandler(e, sceneItem)} onClick=${e => e.stopPropagation()}></div>`}
          </div>`
        })}
        <div ref=${playheadRef} class="bg-bg-red-strong absolute inset-y-0 -top-3.5 w-0.5 cursor-ew-resize rounded-sm [transition:left_0.25s_linear]" style=${{ left: '0px', display: 'none' }} onMouseDown=${onPlayheadMouseDown}>
          <div class="bg-bg-red-strong pointer-events-none absolute top-0 left-1/2 h-2 w-2.5 -translate-x-1/2 translate-y-[calc(-100%+3px)] [clip-path:polygon(50%_100%,0_0,100%_0)]"></div>
        </div>`}
    </div>`
  }

  /** 전체 영상 트랙 — AI 추출 장면, 호버 시 추가 버튼 (ExtractTrack) */
  function ExtractTrack({ duration, scenes = [], onSelect }) {
    const [hoverId, setHoverId] = useState('')
    const [containerWidth, setContainerWidth] = useState(0)
    const containerRef = useRef(null)
    const selectedScene = useEditStore(s => s.selectedScene)
    useEffect(() => {
      const ro = new ResizeObserver(entries => setContainerWidth(entries[0]?.contentRect.width ?? 0))
      ro.observe(containerRef.current)
      return () => ro.disconnect()
    }, [])
    const onAddScene = (e, sceneItem) => { e.stopPropagation(); onSelect(addSceneItems(useEditStore.getState().selectedSceneList, sceneItem), true, true) }
    const onAddAllScene = e => { e.stopPropagation(); if (scenes.length) useEditStore.getState().addAllScenes(scenes) }
    // 끝부분에서 '전체 추가' 버튼이 잘릴 때만 안쪽으로 당긴다
    const explorAddLeft = (leftPct, widthPct) => {
      if (!containerWidth) return '50%'
      const sceneLeft = (leftPct / 100) * containerWidth, center = sceneLeft + ((widthPct / 100) * containerWidth) / 2
      const maxCenter = containerWidth - 14 - 56
      return center <= maxCenter ? '50%' : `${maxCenter - sceneLeft}px`
    }
    return html`<div ref=${containerRef} class="bg-bg-muted relative h-10 rounded-sm">
      ${duration > 0 && scenes.map(sceneItem => {
        const isSelected = selectedScene?.sceneId === sceneItem.sceneId
        const left = (sceneItem.startTime / duration) * 100, width = ((sceneItem.endTime - sceneItem.startTime) / duration) * 100
        const isExplor = sceneItem.scenarioTpVal === 'EXPLOR' || sceneItem.scenarioTpVal === ''
        return html`<div key=${sceneItem.sceneId} title=${sceneItem.sceneTitle} style=${{ left: `${left}%`, width: `${width}%` }}
          class=${cn("bg-brand-light border-bd-primary-soft/60 hover:bg-bg-primary-soft/60 absolute inset-y-0 flex cursor-pointer justify-between rounded-md border-2 p-1 before:absolute before:inset-x-0 before:-top-10 before:h-10 before:content-[''] hover:opacity-100", isSelected && 'bg-bg-primary-soft/60 opacity-100')}
          onClick=${() => onSelect(sceneItem, false)} onMouseEnter=${() => setHoverId(sceneItem.sceneId)} onMouseLeave=${() => setHoverId('')}>
          ${hoverId === sceneItem.sceneId && html`<div class=${cn('bg-bg-primary-light absolute -top-5 z-10 flex -translate-y-1/2 rounded-full', isExplor ? 'w-21 -translate-x-[14px]' : 'left-1/2 -translate-x-1/2')}
            style=${isExplor ? { left: explorAddLeft(left, width) } : undefined}>
            <div class="bg-bg-primary rounded-full" onClick=${e => onAddScene(e, sceneItem)}><${Icon} icon=${I.Plus} color="primary" size="sm" className="text-tx-white" /></div>
            ${isExplor && html`<div class="text-11 flex w-full items-center justify-center pr-1" onClick=${onAddAllScene}><span>전체 추가</span></div>`}
          </div>`}
        </div>`
      })}
    </div>`
  }

  const PX_PER_LABEL = 60
  function TimelineRow({ duration = 0, tooltipContent, keyPrefix, className, scenes, onSelect, previewTime, onDraftChange, onLabelClick, onCheckDirtyGuard, isConfirmOpen }) {
    const trackRef = useRef(null)
    const [trackWidth, setTrackWidth] = useState(0)
    useEffect(() => {
      const ro = new ResizeObserver(entries => setTrackWidth(entries[0]?.contentRect.width ?? 0))
      ro.observe(trackRef.current)
      return () => ro.disconnect()
    }, [])
    const labelCount = Math.max(2, Math.min(12, Math.floor(trackWidth / PX_PER_LABEL)))
    const labels = duration > 0 && trackWidth > 0 ? Array.from({ length: labelCount }, (_, i) => formatTimelineLabel((duration * i) / (labelCount - 1))) : []
    const isSelected = keyPrefix === 'selected'
    const onLabelAreaClick = e => {
      if (!isSelected || !onLabelClick || !trackRef.current) return
      const r = trackRef.current.getBoundingClientRect()
      onLabelClick(((e.clientX - r.left) / r.width) * duration)
    }
    return html`<div class=${cn('flex items-end gap-3', className)}>
      <div class="group relative flex h-10 shrink-0 items-center">
        <${Tooltip} content=${tooltipContent}><p class=${cn('text-xs whitespace-pre-line', isSelected ? 'text-tx-ott' : 'text-tx-primary')}>${isSelected ? '선택\n장면' : '전체\n영상'}</p><//>
      </div>
      <div ref=${trackRef} class="flex-1">
        <div class=${cn('mb-1.5 flex justify-between px-0.5', isSelected && onLabelClick && 'cursor-pointer')} onClick=${onLabelAreaClick}>
          ${labels.length ? labels.map((item, i) => html`<span key=${`${keyPrefix}-${i}-${item}`} class="text-tx-caption text-[9px]">${item}</span>`) : html`<span class="text-tx-caption text-[9px]">00:00</span>`}
        </div>
        ${isSelected
          ? html`<${SelectTrack} duration=${duration} scenes=${scenes ?? []} onSelect=${onSelect} previewTime=${previewTime} onDraftChange=${onDraftChange} onCheckDirtyGuard=${onCheckDirtyGuard} isConfirmOpen=${isConfirmOpen} />`
          : html`<${ExtractTrack} duration=${duration} scenes=${scenes ?? []} onSelect=${onSelect} />`}
      </div>
    </div>`
  }

  function TimelineSection({ draftTimeCode, reframeEffective, setReframePending, aiReframePending, setAiReframePending, onApply, onDraftChange, onSelect, isEditing, onCheckDirtyGuard, alertProps }) {
    const playDuration = useEditStore(s => s.player.duration)
    const extractSceneList = useEditStore(s => s.extractSceneList)
    const selectedSceneList = useEditStore(s => s.selectedSceneList)
    const selectedScene = useEditStore(s => s.selectedScene)
    const isGenerating = useEditStore(s => s.isGenerating)
    const isEditorVisible = !isGenerating && isEditing
    const { panelRef, anchorRef, handleGripMouseDown } = useTimelineEditorPanelDrag(isEditorVisible)
    const selectTotalDuration = selectedSceneList.reduce((acc, cur) => (cur.order === -1 ? acc : acc + cur.duration), 0)
    const extractList = useMemo(() => extractSceneList.map(convertSceneItem), [extractSceneList])
    return html`<div class="relative shrink-0 px-4 py-3">
      <div ref=${anchorRef} class="pointer-events-none absolute inset-x-4 -top-12 flex justify-center" aria-hidden="true"></div>
      ${isEditorVisible && html`<div ref=${panelRef} class="z-modal pointer-events-auto fixed top-0 left-0">
        <${TimelineEditor} onApply=${onApply} draftTimeCode=${draftTimeCode} onDraftChange=${onDraftChange} reframeChecked=${reframeEffective} onReframeCheckedChange=${setReframePending}
          aiReframeChecked=${aiReframePending ?? selectedScene?.isAiReframe ?? false} onAiReframeCheckedChange=${setAiReframePending} onGripMouseDown=${handleGripMouseDown} />
      </div>`}
      <${TimelineRow} duration=${selectTotalDuration} tooltipContent="추출 된 장면 중 선택된 장면이 표시됩니다." keyPrefix="selected" scenes=${selectedSceneList.filter(i => i.order !== -1)}
        onSelect=${onSelect} previewTime=${draftTimeCode} onDraftChange=${onDraftChange} onLabelClick=${t => seekToTimelinePosition(t, selectedSceneList)}
        onCheckDirtyGuard=${onCheckDirtyGuard} isConfirmOpen=${alertProps.isOpen} />
      <${TimelineRow} duration=${playDuration} scenes=${extractList} keyPrefix="extract" className="mt-4" onSelect=${onSelect}
        tooltipContent=${html`AI가 추출한 장면이 표시됩니다.<br />추가 버튼으로 선택 장면에 추가할 수 있습니다.`} />
    </div>`
  }

  /* =====================================================================
   * 우측 편집 영역 — 선택 장면 / 편집하기 / 인코딩
   * ===================================================================== */
  function SceneItemContent({ scene, className }) {

      <div class="flex min-w-0 items-center gap-2">

        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-1">

          </div>

        ${isDeleted

          : html`<${Button} variant="text" size="sm" className="text-tx-red enabled:hover:text-tx-red py-1 hover:bg-transparent" onClick=${e => { e.stopPropagation(); removeScene(scene.sceneId) }}>삭제<//>`}

  /** 말자막 한 줄 — 타이핑 중엔 로컬 상태, blur 시 스토어 커밋 */
  function SubtitleItem({ sceneId, subtitle, isDeleted, triggerClick }) {
    const { subtitleId, text, originText, startTime, endTime } = subtitle
    const [localText, setLocalText] = useState(text)
    const ref = useRef(null)
    useEffect(() => setLocalText(text), [text])
    useLayoutEffect(() => { const el = ref.current; if (el) { el.style.height = '0px'; el.style.height = `${el.scrollHeight}px` } }, [localText])
    const isFocus = useEditStore(s => s.selectedScene?.sceneId === sceneId && s.player.currentTime >= startTime && s.player.currentTime <= endTime)
    return html`<div class=${cn('group card mx-1 flex items-center gap-2 border px-2 py-2.5', isDeleted && 'bg-bg-muted', isFocus && 'border-bd-primary shadow-base')}>
      <button type="button" disabled=${isDeleted} onClick=${e => { e.stopPropagation(); triggerClick(sceneId, startTime) }}
        class=${cn('text-tx-caption text-11 group-focus-within:text-tx-primary focus:text-tx-primary w-14 shrink-0 pt-px text-right leading-tight font-semibold tabular-nums outline-none', isFocus && 'text-tx-primary')}>
        ${formatVideoTime(startTime)}</button>
      <textarea ref=${ref} rows="1" placeholder="자막 없음 — 입력" value=${localText} disabled=${isDeleted}
        class="text-13 placeholder:text-placeholder-default min-w-0 flex-1 resize-none overflow-hidden px-1 leading-tight outline-none disabled:opacity-60"
        onInput=${e => setLocalText(e.target.value)} onBlur=${e => useEditStore.getState().patchSceneSubtitle(sceneId, subtitleId, e.target.value)}></textarea>
      ${originText !== localText && html`<i class="bg-bg-primary h-1.5 w-1.5 shrink-0 rounded-full" aria-hidden="true"></i>`}
    </div>`
  }

  function SceneEditItem({ scene, triggerClick }) {

      e.stopPropagation()

        buttons: [{ label: '취소', variant: 'outline', onClick: closeConfirm }, { label: '삭제', variant: 'danger', onClick: () => { useEditStore.getState().deleteSceneSubtitles(scene.sceneId); closeConfirm() } }] })
    }
    return html`<li class="flex min-w-0 flex-col gap-2 last:pb-4">
      <div class="before:border-bd-default relative flex h-4 w-full min-w-0 items-center justify-between leading-[1.4] font-semibold before:absolute before:top-[7px] before:right-2 before:left-0 before:block before:border-t before:content-['']">
        <strong class="text-tx-caption bg-bg-white relative flex min-w-0 flex-1 items-center gap-1 px-2">
          <span class="min-w-0 truncate" title=${scene.sceneTitle}>${scene.sceneTitle}</span>
          ${scene.isEdit && html`<${I.Pencil} size=${10} className="text-tx-ott shrink-0" />`}
          ${scene.isCrop && html`<${I.Crop} size=${10} className="text-tx-red shrink-0" />`}
        </strong>
        <span class="text-tx-red/70 bg-bg-white relative shrink-0 cursor-pointer px-2 text-xs whitespace-nowrap" onClick=${onDeleteEdit}>일괄 삭제</span>
      </div>
      <div class="flex flex-col gap-1.5">

  function SceneEditPanel() {
    const captionYn = useEditStore(s => s.captionYn)
    const selectedSceneList = useEditStore(s => s.selectedSceneList)
    const { open: openConfirm, close: closeConfirm, alertProps } = useAlert()
    const onCaptionClick = (sceneId, startTime) => {
      const { selectedScene, selectedSceneList: list, setSelectedScene, requestSeek } = useEditStore.getState()
      if (selectedScene?.sceneId !== sceneId) setSelectedScene(list.find(s => s.sceneId === sceneId) ?? null)
      requestSeek(startTime)
    }
    const toggle = () => { const st = useEditStore.getState(); st.toggleCaptionYn(); st.setIsCaptionPreviewOn(!st.isCaptionPreviewOn) }
    const onToggleCaption = () => {
      if (captionYn !== 'Y') return toggle()
      openConfirm({ variant: 'warning', title: '말자막 해제', description: '말자막 OFF를 하면 숏츠 제작 중에 말자막을 추가·수정하실 수 없습니다.',

            : html`<${EmptyState} className="h-full" title="말자막이 OFF 되었습니다." description="숏츠 제작 중에 말자막을 추가·수정할 수 없습니다" />`}

      </div>
      <${Alert} ...${alertProps} />`

  /** 선택된 장면 목록 — 포인터 드래그로 순서 변경 (원본 dnd-kit 대신), 클릭 시 타임라인과 같은 전환 */
  function SceneSelectList({ onSceneSelect }) {
    const [activeId, setActiveId] = useState(null)
    const dragRef = useRef(null)
    const selectedSceneList = useEditStore(s => s.selectedSceneList)
    const isEditCaption = useEditStore(s => s.isEditCaption)
    const isFitWithPadding = useEditStore(s => s.isFitWithPadding)
    const outroYn = useEditStore(s => s.outroYn)
    const { setToggleEditCaption, setToggleFitWithPadding, toggleOutroYn } = useEditStore.getState()
    const visibleSceneList = selectedSceneList.filter(i => i.order > 0)
    const totalDuration = formatVideoTime(visibleSceneList.reduce((acc, cur) => acc + cur.duration, 0), true)
    const isDisabled = selectedSceneList.length === 0
    const onPointerDown = (e, scene) => {
      if (scene.order === -1 || e.button !== 0) return
      e.preventDefault() // 드래그 중 글자 선택 방지
      const st = { id: scene.sceneId, dragging: false }, startY = e.clientY
      dragRef.current = st
      const onMove = ev => {
        if (!st.dragging) { if (Math.abs(ev.clientY - startY) < 5) return; st.dragging = true; setActiveId(st.id) } // 5px 이상 움직여야 드래그 (짧은 클릭과 구분)
        const over = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-scene-id]')?.dataset.sceneId
        if (!over || over === st.id) return
        const { selectedSceneList: list, reorderSceneList } = useEditStore.getState()
        const ids = list.map(s => s.sceneId)
        const isDeleted = list.find(s => s.sceneId === over)?.order === -1
        reorderSceneList(arrayMove(ids, ids.indexOf(st.id), isDeleted ? list.findLastIndex(s => s.order > 0) : ids.indexOf(over)))
      }
      const onUp = () => {
        removeEventListener('pointermove', onMove); removeEventListener('pointerup', onUp)
        setActiveId(null)
        setTimeout(() => { if (dragRef.current === st) dragRef.current = null }, 0) // 드래그 직후 click 은 무시
      }
      addEventListener('pointermove', onMove); addEventListener('pointerup', onUp)
    }
    return html`<div class="flex h-full min-w-0 flex-col gap-4 px-4 py-4">
      <div class="flex flex-col gap-4">
        <${Title} className="text-base" size="xs" title=${`선택 장면 (${visibleSceneList.length})`}
          rightSlot=${html`<div class="flex items-center gap-1"><span class="text-tx-primary pb-1 text-sm font-semibold">총 길이 ${totalDuration}</span></div>`} />
        <div class="flex items-center justify-end gap-4">
          <${Checkbox} label="아웃트로" checked=${outroYn === 'Y'} onChange=${() => toggleOutroYn()} disabled=${isDisabled} />
          <${Checkbox} label="패딩 적용" checked=${isFitWithPadding} onChange=${() => setToggleFitWithPadding()} disabled=${isDisabled} />
          <div class="flex">
            <span class=${cn('text-13 text-tx-black flex cursor-pointer items-center pr-1 pl-0', isDisabled && 'cursor-default opacity-30')} onClick=${() => !isDisabled && setToggleEditCaption()}>말자막 편집</span>
            <${Checkbox} variant="switch" checked=${isEditCaption} onChange=${() => setToggleEditCaption()} disabled=${isDisabled} />
          </div>
        </div>
      </div>
      <div class=${cn('flex min-w-0 flex-1 justify-center', isEditCaption ? 'min-h-0' : 'overflow-y-auto')}>
        ${selectedSceneList.length
          ? isEditCaption ? html`<${SceneEditPanel} />`
            : html`<ul class="flex w-full flex-col gap-1.5">
                ${selectedSceneList.map(scene => {
                  const isDeleted = scene.order === -1
                  return html`<li key=${scene.sceneId} data-scene-id=${scene.sceneId} onPointerDown=${e => onPointerDown(e, scene)}
                    onClick=${() => { if (dragRef.current?.dragging) return; if (!isDeleted) onSceneSelect(scene, true) }}
                    class=${cn(isDeleted ? 'cursor-default' : 'cursor-pointer', 'touch-none select-none', activeId === scene.sceneId && 'relative z-10 opacity-80 shadow-lg')}>
                    <${SceneItemContent} scene=${scene} />
                  </li>`
                })}
              </ul>`
          : html`<${EmptyState} title="선택된 장면이 없습니다." />`}
      </div>
    </div>`
  }

  /** 배너 미리보기 이미지 위 텍스트 드래그 (useBannerPreview) — 드래그 중엔 DOM, 놓을 때 스토어 반영 */
  const useBannerPreview = ({ imgNatural, location, onLocationChange }) => {
    const previewRef = useRef(null), textRef = useRef(null)
    const [imageRect, setImageRect] = useState({ ox: 0, oy: 0, dw: 0, dh: 0 })
    useLayoutEffect(() => {
      const el = previewRef.current
      if (!el || imgNatural.width <= 0) return
      const update = () => { const { width, height } = el.getBoundingClientRect(); setImageRect(getContainedRect(width, height, imgNatural.width, imgNatural.height)) }
      update()
      const ro = new ResizeObserver(update)
      ro.observe(el)
      return () => ro.disconnect()
    }, [imgNatural.width, imgNatural.height])
    const handleTextMouseDown = e => {
      e.preventDefault(); e.stopPropagation()
      const sx = e.clientX, sy = e.clientY
      let cur = { ...location }
      const onMove = ev => {
        const rect = previewRef.current?.getBoundingClientRect()
        if (!rect) return
        const { dw, dh } = getContainedRect(rect.width, rect.height, imgNatural.width, imgNatural.height)
        cur = { x: clamp(location.x + (dw > 0 ? ((ev.clientX - sx) / dw) * 100 : 0), 0, 100), y: clamp(location.y + (dh > 0 ? ((ev.clientY - sy) / dh) * 100 : 0), 0, 100) }
        if (textRef.current) { textRef.current.style.left = `${cur.x}%`; textRef.current.style.top = `${cur.y}%` }
      }
      const onUp = () => {
        removeEventListener('mousemove', onMove); removeEventListener('mouseup', onUp)
        onLocationChange({ x: Number(cur.x.toFixed(3)), y: Number(cur.y.toFixed(3)) })
      }
      addEventListener('mousemove', onMove); addEventListener('mouseup', onUp)
    }
    return { previewRef, textRef, imageRect, handleTextMouseDown }
  }

  const blockNumKeys = e => { if (['-', 'e', 'E', '+', '.'].includes(e.key)) e.preventDefault() }
  /** 숫자 입력 — 범위 밖 값은 무시 */
  const NumberField = ({ id, label, className, min, max, value, onPatch }) => html`<${Input} type="number" className=${className} id=${id} label=${label} min=${min} max=${max} value=${String(value)}
    onChange=${e => { const v = e.target.value; if (v === '' || (Number(v) >= min && Number(v) <= max)) onPatch({ [id]: parseInt(v, 10) }) }}
    onKeyDown=${blockNumKeys} onBlur=${() => !parseInt(String(value), 10) && onPatch({ [id]: min })} onClear=${() => onPatch({ [id]: min })} />`
  /** 색상 스와치 — 고르는 동안엔 DOM 만, 확정(change) 때 스토어 반영 */
  const ColorSwatch = ({ value, onLive, onCommit }) => html`<label class="border-bd-normal relative h-9.5 w-9.5 cursor-pointer rounded-sm border p-1">
    <span class="card block h-full w-full rounded-sm" style=${{ backgroundColor: value }}></span>
    <input type="color" value=${value} onInput=${e => { e.target.previousElementSibling.style.backgroundColor = e.target.value; onLive?.(e.target.value) }}
      onChange=${e => onCommit(e.target.value)} class="absolute inset-0 h-full w-full cursor-pointer opacity-0" />
  </label>`

  function SceneBannerTab() {

    const { fontIdx, fontSize, fontColor, strokeColor, strokeWidth, shadowColor, shadowOpacity, shadowOffsetX, shadowOffsetY, text, previewUrl, fontStyle, location } = banner
    const bannerFontList = useEditStore(s => s.bannerFontList)
    const hookingCommentList = useEditStore(s => s.hookingCommentList)
    const isBannerPreviewOn = useEditStore(s => s.isBannerPreviewOn)
    const editRatio = useEditStore(s => s.editRatio)
    const vw = useEditStore(s => s.player.videoNaturalSize.width)
    const vh = useEditStore(s => s.player.videoNaturalSize.height)
    const { patchBanner, setIsBannerPreviewOn } = useEditStore.getState()
    const [isDragging, setIsDragging] = useState(false)
    const recommendedSize = useMemo(() => calcBannerRecommendedSize({ width: vw, height: vh }, editRatio), [editRatio, vw, vh])
    const emptyPreviewUrl = recommendedSize ? svgUri(`<svg xmlns="http://www.w3.org/2000/svg" width="${recommendedSize.width}" height="${recommendedSize.height}" viewBox="0 0 ${recommendedSize.width} ${recommendedSize.height}"></svg>`) : ''
    // 이미지가 없으면 권장 사이즈의 투명 배경을 기본 이미지로 쓴다
    const loadDefaultImage = () => recommendedSize && patchBanner({ previewUrl: emptyPreviewUrl, naturalSize: recommendedSize, hasLocalFile: false })
    useEffect(() => { if (!previewUrl && recommendedSize) loadDefaultImage() }, [previewUrl, recommendedSize])
    const { previewRef, textRef, imageRect, handleTextMouseDown } = useBannerPreview({
      imgNatural: banner.naturalSize, location, onLocationChange: loc => patchBanner({ location: loc }),
    })
    useEffect(() => { if (imageRect.dw > 0) patchBanner({ previewWidth: imageRect.dw }) }, [imageRect.dw])
    const onUpload = e => { e.preventDefault(); setIsDragging(false); notInPreview('배너 이미지 업로드') }
    const onChangeCenter = () => {
      const el = textRef.current
      if (!el || imageRect.dw <= 0) return
      patchBanner({ location: { x: Number(clamp(((imageRect.dw - el.offsetWidth) / 2 / imageRect.dw) * 100, 0, 100).toFixed(3)), y: location.y } })
    }
    const fontOptions = bannerFontList.map(i => ({ label: i.assetNm, value: i.assetCd }))
    const dragProps = { onDragOver: e => { e.preventDefault(); setIsDragging(true) }, onDragLeave: () => setIsDragging(false), onDrop: onUpload }
    return html`<div class="flex h-full min-w-0 flex-col gap-5 overflow-y-auto px-4">
      <div>
        <${Title} title="배너 추가" size="xs" tag="h4" className="mb-2" />
        <label onClick=${onUpload} ...${dragProps}
          class=${cn('card bg-bg-subtle hover:border-bd-primary-soft flex w-full cursor-pointer flex-col items-center justify-center gap-2 border-dashed py-4 transition-colors', isDragging ? 'border-bd-primary-soft bg-bg-primary-subtle' : 'hover:bg-bg-primary-subtle')}>
          <img src=${ASSETS.imageUpload} alt="image_upload" class="h-12" />
          <p class="text-tx-muted text-sm font-semibold">해당 영역을 클릭하여 이미지 추가</p>
          ${recommendedSize && html`<p class="text-tx-primary text-xs font-bold">권장 사이즈: ${recommendedSize.width} x ${recommendedSize.height}</p>`}
        </label>
      </div>
      <div>
        <${Title} title="제목 입력" size="xs" tag="h4" className="mb-2" description="(30자 제한)" />
        <div class="flex flex-col gap-2">
          <div class="flex min-w-0 flex-wrap items-center gap-2">
            ${hookingCommentList.slice(0, 5).map((value, i) => html`<span key=${`${value}_${i}`} onClick=${() => patchBanner({ text: value.slice(0, 30) })}
              class=${cn(badgeVariants({ variant: 'purple', shape: 'rounded' }), 'max-w-full min-w-0 shrink cursor-pointer overflow-hidden')}><${TruncatedText} className="block min-w-0" text=${value} /></span>`)}
          </div>
          <${Textarea} value=${text} onChange=${e => patchBanner({ text: e.target.value })} placeholder="텍스트 입력" rows=${1} count=${text.length} maxLength=${30} />
        </div>
        <div class="mt-3 flex flex-col gap-2">
          <${Title} title="폰트 스타일" size="xs" tag="h4" />
          <div class="flex items-end gap-2">
            <${Selectbox} label="폰트 설정" options=${fontOptions} value=${fontIdx} onChange=${v => patchBanner({ fontIdx: v })} className="min-w-0 flex-1" />
            <${ColorSwatch} value=${fontColor} onLive=${v => { if (textRef.current) textRef.current.style.color = v }} onCommit=${v => patchBanner({ fontColor: v })} />
          </div>
          <div class="flex items-end gap-2">
            <${NumberField} id="fontSize" label="폰트 크기" className="w-20" min=${1} max=${100} value=${fontSize} onPatch=${patchBanner} />
            <${Button} title="굵기 변경" variant="iconOnly" leftIcon=${I.Bold} className=${cn(fontStyle === 'BOLD' && 'bg-bg-primary text-tx-white enabled:hover:text-tx-white')}
              onClick=${() => patchBanner({ fontStyle: fontStyle === 'BOLD' ? 'REGULAR' : 'BOLD' })} />
            <${Button} title="가운데 정렬" variant="iconOnly" leftIcon=${I.TextAlignCenter} onClick=${onChangeCenter} />
          </div>
        </div>
        <div class="mt-2 flex items-end gap-2">
          <${NumberField} id="strokeWidth" label="윤곽선 · 색상" className="w-20" min=${0} max=${12} value=${strokeWidth} onPatch=${patchBanner} />
          <${ColorSwatch} value=${strokeColor} onCommit=${v => patchBanner({ strokeColor: v })} />
          <${NumberField} id="shadowOpacity" label="그림자 투명도 · 색상" className="w-24" min=${0} max=${100} value=${shadowOpacity} onPatch=${patchBanner} />
          <${ColorSwatch} value=${shadowColor} onCommit=${v => patchBanner({ shadowColor: v })} />
        </div>
      </div>
      <div>
        <div class="mb-2 flex items-center justify-between gap-4">
          <div class="flex items-center gap-2">
            <${Title} title="미리보기" size="xs" tag="h4" />
            <${Button} variant=${isBannerPreviewOn ? 'outline' : 'primary'} size="xs" onClick=${() => setIsBannerPreviewOn(!isBannerPreviewOn)} className="h-7 px-2.5 text-xs">${isBannerPreviewOn ? '끄기' : '적용'}<//>
          </div>
          <div class="flex items-center">
            <${Button} variant="text" leftIcon=${I.Trash2} onClick=${() => { patchBanner({ uploadId: '', location: { ...DEFAULT_BANNER_LOCATION } }); loadDefaultImage() }}>이미지 삭제<//>
          </div>
        </div>
        <div ref=${previewRef} class="card relative mb-4 w-full overflow-hidden border-dashed select-none" ...${dragProps}>
          ${(previewUrl || emptyPreviewUrl) && html`<img src=${previewUrl || emptyPreviewUrl} alt="배너 미리보기" class="block w-full object-cover" draggable=${false} />`}
          ${imageRect.dw > 0 && html`<div class="pointer-events-none absolute overflow-hidden" style=${{ left: imageRect.ox, top: imageRect.oy, width: imageRect.dw, height: imageRect.dh }}>
            ${text && html`<div ref=${textRef} draggable=${false} onMouseDown=${handleTextMouseDown}
              class="pointer-events-auto absolute -translate-y-1/2 cursor-move rounded-[2px] px-1 py-[2px] text-center leading-[1.3] whitespace-pre [outline:1.5px_dashed_#F0F0F0] select-none"
              style=${{ left: `${location.x}%`, top: `${location.y}%`, fontFamily: fontFamilyOf(bannerFontList, fontIdx), fontSize: `${fontSize}px`, fontWeight: fontStyle === 'BOLD' ? 'bold' : 'normal', color: fontColor,
                ...(strokeWidth > 0 && { WebkitTextStroke: `${strokeWidth}px ${strokeColor}`, paintOrder: 'stroke fill' }),
                ...(shadowOpacity > 0 && { textShadow: buildTextShadow(shadowOpacity, shadowColor, shadowOffsetX, shadowOffsetY) }) }}>${text}</div>`}
          </div>`}
        </div>
      </div>
    </div>`
  }

  const SUBTITLE_POSITION_OPTIONS = [{ label: '하단', value: 'BOTTOM' }, { label: '중단', value: 'MIDDLE' }, { label: '상단', value: 'TOP' }]
  const BORDER_COLORS = [{ color: '000000', label: 'BLACK' }, { color: 'FFFFFF', label: 'WHITE' }, { color: 'FFFF00', label: 'YELLOW' }, { color: 'FF0000', label: 'RED' }, { color: '00FF00', label: 'GREEN' }, { color: '0000FF', label: 'BLUE' }]
  const SHADOW_COLORS = [{ color: '000000', label: 'BLACK' }, { color: 'FFFFFF', label: 'WHITE' }]
  function SceneCaptionTab() {

        <${Button} variant="iconOnly" leftIcon=${I.Bold} className=${cn(fontStyle === 'BOLD' && 'bg-bg-primary text-tx-white enabled:hover:text-tx-white')}

      <div class="mt-2 flex items-end gap-2">

  /** 인코딩 결과 미리보기 — 실제 인코딩 영상 대신 선택 장면을 순서대로 이어서 재생한다 */
  function ScenePreview() {
    const wrapperRef = useRef(null), videoRef = useRef(null)
    const [isExportOpen, setIsExportOpen] = useState(false)
    const isGenerating = useEditStore(s => s.isGenerating)
    const compositionId = useEditStore(s => s.compositionId)
    const previewUrl = useEditStore(s => s.shortFormPreviewUrl)
    const editRatio = useEditStore(s => s.editRatio)
    const selectedSceneList = useEditStore(s => s.selectedSceneList)
    const isBannerPreviewOn = useEditStore(s => s.isBannerPreviewOn)
    const captionYn = useEditStore(s => s.captionYn)
    const { open: openConfirm, close: closeConfirm, alertProps } = useAlert()
    const { push } = useRouter()
    const clips = selectedSceneList.filter(i => i.order > 0)
    const clipsRef = useRef(clips); clipsRef.current = clips
    const allSubtitles = useMemo(() => clips.flatMap(c => c.subtitleData), [selectedSceneList])

    // 마운트 시 1회 — 저장 이력이 없거나 저장 뒤 바뀐 내용이 있으면 인코딩(저장) 시작
    useEffect(() => {
      const st = useEditStore.getState()
      if (st.isGenerating) return
      if (!st.compositionId || (st.savedSnapshot && st.savedSnapshot !== snapshotKey(st))) runSave()
    }, [])
    // 장면 경계에서 다음 장면으로 점프, 끝나면 처음으로
    useEffect(() => {
      const v = videoRef.current
      if (!v) return
      const toStart = () => { if (clipsRef.current[0]) v.currentTime = clipsRef.current[0].tempStart }
      const onTime = () => {
        const list = clipsRef.current, t = v.currentTime
        if (list.some(c => t >= c.tempStart && t < c.tempEnd)) return
        const next = list.find(c => c.tempStart > t - 0.3)
        if (next && v.currentTime < next.tempStart) v.currentTime = next.tempStart
        else if (!next || t >= list.at(-1).tempEnd) { v.pause(); toStart() }
      }
      v.addEventListener('loadedmetadata', toStart)
      v.addEventListener('timeupdate', onTime)
      return () => { v.removeEventListener('loadedmetadata', toStart); v.removeEventListener('timeupdate', onTime) }
    }, [isGenerating, previewUrl])

    const onCreate = async () => {
      closeConfirm()
      useEditStore.getState().setIsLoading(true)
      await sleep(900)
      toast({ color: 'green', icon: I.CircleCheckBig, title: '하이라이트 생성 요청 완료', description: '최종 숏폼 영상 생성을 시작했습니다.' })
      push('/hl/my')
    }
    const exportItem = (IconComp, label) => html`<li><button type="button" onClick=${e => { e.stopPropagation(); setIsExportOpen(false); notInPreview(label) }}
      class="hover:bg-bg-primary-subtle hover:text-tx-primary text-tx-strong flex w-full cursor-pointer items-center gap-2 rounded-lg px-2 py-2.5 text-left text-xs font-medium transition">
      <${Icon} icon=${IconComp} color="gray" size="sm" className="text-tx-primary h-4 w-4" />${label}</button></li>`
    return html`<div class="relative flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden p-4">
      <${Title} className="pb-4 text-base" size="sm" title="미리보기" />
      ${isGenerating
        ? html`<div class="absolute inset-0 flex h-full w-full flex-col items-center justify-center">
            <p class="pb-4 text-center text-lg leading-relaxed font-medium">인코딩 진행 중</p><${LoadingSpinner} variant="dot" /></div>`
        : html`
          <div class="bg-bg-black flex min-h-0 flex-1 items-center justify-center overflow-hidden rounded-md">
            <div class="relative max-h-full w-full overflow-hidden" style=${{ aspectRatio: (editRatio || '9:16').replace(':', ' / ') }}>
              <${EditVideo} key=${`preview_${compositionId}`} className="h-full w-full rounded-none [&_video]:rounded-none [&_video]:object-cover" videoRef=${videoRef} src=${previewUrl}
                overlay=${html`${isBannerPreviewOn && html`<${BannerOverlay} videoRef=${videoRef} fill />`}${captionYn === 'Y' && html`<${CaptionOverlay} videoRef=${videoRef} subtitles=${allSubtitles} fill />`}`} />
            </div>
          </div>
          <div class="flex shrink-0 gap-2 pt-4">
            <div ref=${wrapperRef} class="card relative flex w-full flex-1 items-center rounded-xs">
              <${Button} variant="text" size="lg" className="h-full flex-1" disabled=${!compositionId} onClick=${() => setIsExportOpen(p => !p)}>다운로드<//>
              <span class="bg-bd-subtle my-1.5 w-px self-stretch"></span>
              <${Button} variant="ghost" size="xs" iconSize=${16} className="h-full shrink-0 enabled:hover:bg-transparent" leftIcon=${I.ChevronDown} isRotate=${isExportOpen}
                aria-label="내보내기 메뉴 열기" onClick=${() => setIsExportOpen(p => !p)} disabled=${!compositionId} />
              ${isExportOpen && html`<div class="card z-dropdown absolute bottom-full left-0 mb-2 w-[185px] rounded-xl p-4 shadow-lg" role="dialog">
                <div class="min-w-0">
                  <div class="flex items-center justify-between gap-2">
                    <h3 class="text-tx-strong min-w-0 text-sm font-bold">내보내기</h3>
                    <${Button} className="shrink-0" variant="ghost" leftIcon=${I.X} size="xs" iconSize=${15} onClick=${() => setIsExportOpen(false)} />
                  </div>
