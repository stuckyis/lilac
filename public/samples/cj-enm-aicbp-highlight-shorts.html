      setScenarioDetail({ [id]: value })
    }

    /** 하단 버튼 */
    const leftButton = [{ label: '비활성화', variant: 'danger', onClick: onDisabledConfirm, disabled: scenarioDetail.actvYn === 'N' || isSubmitting }]
    const rightButton = [
      { label: '닫기', variant: 'outline', onClick: onClose, disabled: isSubmitting },
      { label: '저장', variant: 'primary', onClick: onSaveConfirm, disabled: isSubmitting },
    ]
    const bottomButtons = scenarioDetail.scenarioId ? [leftButton, rightButton] : rightButton

    return html`<${Modal} isOpen=${isOpen} onClose=${onClose} title=${selectedItem?.scenarioNm || `${scenarioTpNm(scenarioType)} 시나리오 추가`}
      panelClassName="w-full max-w-[580px]" buttons=${bottomButtons}>
      <div className="flex flex-col gap-4">
        <div className="flex flex-wrap items-start gap-4">
          <${InfoField} title="유형" width="w-25">${`${scenarioTpNm(scenarioType)} (${scenarioType})`}<//>
          <${InfoField} title="시나리오ID" bold=${false}>${scenarioDetail.scenarioId}<//>
          ${scenarioDetail.scenarioId && html`
            <${Selectbox} className="w-30 shrink-0" size="sm" label="버전 조회" value=${scenarioDetail.verIndexNo} options=${versionOptions}
              onChange=${value => { if (!value || scenarioDetail.verIndexNo === Number(value)) return; getScenarioDetail(scenarioDetail.scenarioId, Number(value)) }} />
            <${ActiveField} actvYn=${scenarioDetail.actvYn} />`}
        </div>
        <div className="card border-bd-ott/40 bg-bg-ott/14 text-tx-ott px-4 py-2.5 text-xs">
          ${PROMPT_DESCRIPTION[selectedItem ? 'DETAIL' : 'CREATE'][scenarioType]}
        </div>
        ${isFixed && html`<${Selectbox} label="카테고리" value=${ctgValue} options=${categoryOptions} onChange=${setCtgValue}
          disabled=${!!scenarioDetail.scenarioId} required=${!scenarioDetail.scenarioId} />`}
        <${Input} id="scenarioNm" label="시나리오명" value=${scenarioDetail.scenarioNm || ''} onChange=${onChangeText} required
          error=${isValidate && !scenarioDetail.scenarioNm.trim()} errorText="시나리오명을 입력해주세요." />
        ${isFixed ? html`
          <${Textarea} id="introContent" label="서론 내용 (intro_content)" value=${scenarioDetail.introContent} onChange=${onChangeText} rows=${2} required
            error=${isValidate && !scenarioDetail.introContent.trim()} errorText="서론 내용을 입력해주세요." />
          <${Textarea} id="bodyContent" label="본론 내용 (body_content)" value=${scenarioDetail.bodyContent} onChange=${onChangeText} rows=${2} required
            error=${isValidate && !scenarioDetail.bodyContent.trim()} errorText="본론 내용을 입력해주세요." />
          <${Textarea} id="contrContent" label="결론 내용 (conclusion_content)" value=${scenarioDetail.contrContent} onChange=${onChangeText} rows=${2} required
            error=${isValidate && !scenarioDetail.contrContent.trim()} errorText="결론 내용을 입력해주세요." />`
        : html`<${Textarea} id="examCnts" label="예시 Body (example_body)" value=${scenarioDetail.examCnts} onChange=${onChangeText} rows=${5} required

      </div>
      <${Alert} ...${alertProps} />
      ${isLoadingDetail && html`<${DetailLoading} />`}
    <//>`
  }

    const [hh, mm] = HOURS[i % HOURS.length]
    const pgm = DEMO.pgms[(i * 3) % DEMO.pgms.length]
    const products = Array.from({ length: 2 + (i % 4) }, (_, k) => DEMO.products[(i * 7 + k * 3) % DEMO.products.length])
    const sche = Math.floor(daysAgo(Math.floor(i / 5) + 1, hh, mm).getTime() / 1000)
    const status = STATUS_SEQ[i % STATUS_SEQ.length]
    return {
      bdTpVal: TYPES[i % TYPES.length], bdCd: String(1048200 + (50 - i) * 3), bdNm: `${pgm.name} - ${products[0].name}`,
      pgmCd: pgm.code, pgmNm: pgm.name, bdScheStrDtm: sche, overallStatus: status, estimatedAnalysisTime: '',
      analsReqDtm: status === 'pending' ? 0 : status === 'processing' ? nowSec() - (12 + i) * 60 : sche + 3 * 3600,
      tnailUrl: vodThumb(products[0], pgm.name),
      products, host: DEMO.hosts[i % DEMO.hosts.length],
    }
  })
  const findVod = vodId => VOD_DB.find(v => v.bdCd === parseVodId(vodId).bdCd)
  const bucketOf = v => (v.overallStatus === 'failed' ? 'pending' : v.overallStatus) // 실패 건은 '분석 대기' 탭에 센다

  /** 지난 방송 목록 조회 (getContentList) */
  const getContentList = async ({ type, keyword, bdTpVal, status, startDate, endDate }) => {
    await sleep(500)
    const kw = keyword.trim()
    const hit = v => ({
      VIDEO_TITLE: v.bdNm.includes(kw), PROGRAM_NAME: v.pgmNm.includes(kw), PROGRAM_CODE: v.pgmCd.includes(kw),
      PRODUCT_NAME: v.products.some(p => p.name.includes(kw)), PRODUCT_CODE: v.products.some(p => p.code.includes(kw)),
    })[type]
    const base = VOD_DB.filter(v => (!bdTpVal || v.bdTpVal === bdTpVal) && (!kw || hit(v))
      && (!startDate || v.bdScheStrDtm * 1000 >= startDate) && (!endDate || v.bdScheStrDtm * 1000 <= endDate))
    const counts = { processing: 0, completed: 0, pending: 0 }
    base.forEach(v => counts[bucketOf(v)]++)
    const list = status ? base.filter(v => bucketOf(v) === status) : base
    return { list, total: list.length, status: counts }
  }

  /** 원본 영상 분석 요청 (postVodAnalysis) — 미리보기: 분석 중으로 바꾸고 일정 시간 뒤 완료 처리 */
  const ANALYSIS_MS = 15000
  const postVodAnalysis = async vodId => {
    await sleep(400)
    const v = findVod(vodId)
    if (!v) throw new Error('지난 방송 정보를 찾을 수 없습니다.')
    v.overallStatus = 'processing'
    v.analsReqDtm = nowSec()
    setTimeout(() => {
      v.overallStatus = 'completed'
      useVodListStore.setState({}) // 목록은 같은 객체를 들고 있으므로 다시 그리기만 한다
      const d = useVodDetailStore.getState().detailInfo
      if (d.bdCd === v.bdCd) useVodDetailStore.setState({ detailInfo: { ...d, overallStatus: 'completed' } })
    }, ANALYSIS_MS)
    return { code: 200 }
  }

  /** 지난 방송 상세 정보 조회 (getContentDetailInfo) */
  const getContentDetailInfo = async vodId => {
    await sleep(500)
    const v = findVod(vodId)
    if (!v) throw new Error('지난 방송 정보를 찾을 수 없습니다.')
    const { bdTpVal, bdCd, bdNm, pgmCd, pgmNm, bdScheStrDtm, overallStatus, analsReqDtm, tnailUrl } = v
    return { bdTpVal, bdCd, bdNm, pgmCd, pgmNm, bdScheStrDtm, overallStatus, analsReqDtm, tnailUrl, remainingAnalysisTime: '',
      vmOrgUrl: SAMPLE_VIDEO, cleanUrl: `https://vod.example.com/clean/${bdCd}.mp4` }
  }

  /** PD 리뷰 (getVodAnalysisSummary) · AI 분석 요약 (getContentSummary) */
  const getVodAnalysisSummary = async vodId => {
    await sleep(350)
    const v = findVod(vodId)
    if (!v) return null
    const [main] = v.products
    return { bdCd: v.bdCd, bdReviewSumry: `쇼호스트 ${v.host}의 진행으로 「${main.name}」의 '${extraOf(main)[1][0]}' 포인트를 집중 소개한 방송입니다. 실사용 시연 구간의 시청 유지율이 높았고, 구성 비교 설명이 다소 길어 후반부 이탈이 있었습니다. 다음 방송에서는 혜택 안내를 앞쪽으로 당기는 것을 권장합니다.` }
  }
  const getContentSummary = async vodId => {
    await sleep(350)
    const v = findVod(vodId)
    if (!v || v.overallStatus !== 'completed') return { contentSummary: '' }
    const [main, ...rest] = v.products
    return { contentSummary: `${timestampToString(v.bdScheStrDtm, 'dot')} ${v.pgmNm} 방송은 「${main.name}」을 메인으로 ${rest.map(p => p.name).join(', ')} 등 총 ${v.products.length}개 상품을 소개했습니다. 방송 초반 '${extraOf(main)[1][0]}' 시연 장면에서 시청자 반응이 가장 높았고, 중반부 가격 혜택·구성 비교 구간에서 주문이 집중되었습니다. 하이라이트 숏츠로는 시연 장면과 구성 소개 구간을 추천합니다.` }
  }
  /** 셀링포인트 (getVodSellingPoint) — 편성 상품의 AI 카테고리별로 묶는다 */
  const getVodSellingPoint = async vodId => {
    await sleep(300)
    const v = findVod(vodId)
    const map = new Map()
    v?.products.forEach(p => { const [ctg, benefits] = extraOf(p); map.set(ctg, [...(map.get(ctg) ?? []), ...benefits]) })
    return { sellingPoints: [...map].map(([stdioCtgCd, benefits]) => ({ stdioCtgCd, stdioCtgNm: CTG_NAME[stdioCtgCd], benefits })) }
  }
  /** 편성 상품 목록 (getVodProductList) */
  const getVodProductList = async vodId => {
    await sleep(450)
    const v = findVod(vodId)
    const bdItems = (v?.products ?? []).map(p => ({
      itemCd: p.code, itemNm: p.name, itemImgUrl: productImg(p, 200), dpCtgId: '', stdioCtgCd: extraOf(p)[0], itemAttrExistsYn: extraOf(p)[2] ? 'Y' : 'N',
    }))
    return { category: [], bdItems }
  }
  const productByCode = code => DEMO.products.find(p => p.code === code)
  /** 상품 속성 (getVodProductDetail) */
  const getVodProductDetail = async itemCd => {
    await sleep(400)
    return (extraOf(productByCode(itemCd))?.[2] ?? []).map(([attrNm, attrVal], i) => ({ attrCd: String(i + 1), attrNm, attrVal }))
  }
  /** 단품 재고 (getVodProductStockList) */
  const getVodProductStockList = async itemCd => {
    await sleep(400)
    const units = extraOf(productByCode(itemCd))?.[3] ?? []
    return {
      itemUnitStockList: units.map((unitNm, i) => {
        const r = rnd(Number(itemCd) + i)
        return { unitCd: `${itemCd}${String(i + 1).padStart(3, '0')}`, unitNm, slStatCd: '', slStatNm: '', stockQty: r < 0.12 ? 0 : Math.round(r * 480) }
      }),
    }
  }

  /* =====================================================================
   * 스토어 (stores/highlight/vod/*)
   * ===================================================================== */
  let fetchGeneration = 0
  const DEFAULT_VOD_DATA = { total: 0, list: [] }
  const DEFAULT_STATUS_INFO = { all: 0, processing: 0, completed: 0, pending: 0 }

  const useVodListStore = createStore((set, get) => ({
    searchInfo: { ...DEFAULT_SEARCH_VALUE },
    savedListUiState: null, // 상세 이동 후 스크롤 복원
    setSearchInfo: info => set({ searchInfo: info }),
    setStatus: status => set(state => ({ searchInfo: { ...state.searchInfo, status } })),
    clearSearch: () => set({ searchInfo: { ...DEFAULT_SEARCH_VALUE } }),
    resetSearchInfo: () => {
      const c = get().searchInfo, d = DEFAULT_SEARCH_VALUE
      const isAlreadyDefault = ['type', 'keyword', 'bdTpVal', 'status', 'startDate', 'endDate'].every(k => c[k] === d[k])
      if (!isAlreadyDefault) set({ searchInfo: { ...DEFAULT_SEARCH_VALUE } })
    },

    vodData: { ...DEFAULT_VOD_DATA },
    statusInfo: { ...DEFAULT_STATUS_INFO },
    isLoading: true,
    hasMore: false,
    fetchList: async searchInfo => {
      set({ isLoading: true, savedListUiState: null, vodData: { ...DEFAULT_VOD_DATA } })
      const generation = fetchGeneration
      try {
        const res = await getContentList({ ...searchInfo, status: searchInfo.status === 'all' ? '' : searchInfo.status })
        if (generation !== fetchGeneration) return // 목록 초기화 이후 도착한 오래된 응답 무시
        const { list, total, status } = res
        set({ vodData: { total, list }, statusInfo: { ...status, all: status.completed + status.pending + status.processing }, hasMore: false })
      } finally {
        if (generation === fetchGeneration) set({ isLoading: false })
      }
    },
    setListUiState: uiState => set({ savedListUiState: uiState }),
    resetList: () => {
      fetchGeneration++ // 진행 중인 요청 모두 무효화
      set({ vodData: { ...DEFAULT_VOD_DATA }, hasMore: false, isLoading: true, savedListUiState: null })
    },
  }))

  const DEFAULT_VOD_ANALYSIS_DATA = {
    bdTpVal: '', bdCd: '', bdNm: '', pgmCd: '', pgmNm: '', bdScheStrDtm: 0, overallStatus: '', analsReqDtm: 0,
    remainingAnalysisTime: '', tnailUrl: '', vmOrgUrl: '', cleanUrl: '',
  }
  let detailRequestToken = 0
  const useVodDetailStore = createStore(set => ({
    detailInfo: DEFAULT_VOD_ANALYSIS_DATA,
    isDetailLoading: false, isAnalysisLoading: false, isPointLoading: false, isProductLoading: false, detailError: null,
    fetchVodDetail: async vodId => {
      const currentToken = ++detailRequestToken
      set({ isDetailLoading: true, detailError: null })
      try {
        const res = await getContentDetailInfo(vodId)
        if (currentToken !== detailRequestToken) return // 이전 요청이 뒤늦게 도착하면 폐기
        set({ detailInfo: res, isDetailLoading: false })
      } catch (e) {
        if (currentToken !== detailRequestToken) return
        set({ detailError: e instanceof Error ? e.message : '상세 조회 실패', isDetailLoading: false })
      } finally {
        set({ isDetailLoading: false })
      }
    },
    setIsAnalysisLoading: v => set({ isAnalysisLoading: v }),
    setIsPointLoading: v => set({ isPointLoading: v }),
    setIsProductLoading: v => set({ isProductLoading: v }),
    resetVodDetail: () => set({ detailInfo: DEFAULT_VOD_ANALYSIS_DATA, detailError: null, isDetailLoading: false, isAnalysisLoading: false, isPointLoading: false, isProductLoading: false }),
  }))

  /* =====================================================================
   * hooks/useInfiniteScroll (일반 리스트용 부분만)
   * ===================================================================== */
  const useInfiniteScroll = ({ onLoadMore, hasMore, isLoading, rootMargin = '0px', threshold = 0.1 }) => {
    const loadMoreRef = useRef(null)
    const latest = useRef(null)
    latest.current = () => hasMore && !isLoading && onLoadMore()
    useEffect(() => {
      const el = loadMoreRef.current
      if (!el) return
      const io = new IntersectionObserver(([e]) => e.isIntersecting && latest.current(), { threshold, rootMargin })
      io.observe(el)
      return () => io.disconnect()
    })
    return { loadMoreRef }
  }

  /* =====================================================================
   * 공용 조각
   * ===================================================================== */
  const sparkleImg = (size, className) => html`<img src=${ASSETS.iconSparkle} alt="sparkle_icon" width=${size} height=${size} class=${className} />`
  const gradientText = text => html`<span class="text-13 inline-block [background-image:var(--gradient-200)] bg-clip-text bg-no-repeat font-bold text-transparent [-webkit-background-clip:text] [-webkit-text-fill-color:transparent]">${text}</span>`

  /** 분석 요청 확인 → 요청 → 완료 알럿 (VodCardPanel · StatusButtonArea 공통 흐름) */
  const useAnalyzeConfirm = onDone => {
    const { open, close, alertProps } = useAlert()
    const onAnalyze = async (vodId, status) => {
      close()
      try {
        await postVodAnalysis(vodId, status === 'failed')
        open({ variant: 'success', title: '영상 분석 요청되었습니다.', description: ' ',
          buttons: [{ label: '확인', variant: 'primary', onClick: () => { close(); onDone(vodId) } }] })
      } catch (error) {
        open({ variant: 'error', title: '영상 분석 요청 실패', description: error instanceof Error ? error.message : ' ',
          buttons: [{ label: '확인', variant: 'primary', onClick: close }] })
      }
    }
    const confirm = (vodId, status) => open({
      variant: 'info', title: '분석 요청하시겠습니까?', description: ' ',
      buttons: [{ label: '취소', variant: 'outline', onClick: close }, { label: '확인', variant: 'primary', onClick: () => onAnalyze(vodId, status.toLocaleLowerCase()) }],
    })
    return { confirm, alertProps }
  }

  /* =====================================================================
   * 목록: VodSearch
   * ===================================================================== */
  const VodSearch = () => {
    const setSearchInfo = useVodListStore(s => s.setSearchInfo)
    const clearSearch = useVodListStore(s => s.clearSearch)
    const fetchList = useVodListStore(s => s.fetchList)
    const [tempInfo, setTempInfo] = useState(() => useVodListStore.getState().searchInfo)

    const onChangeSelect = (id, value) => setTempInfo(prev => ({ ...prev, [id]: value }))
    const onChangeInput = e => { const { id, value } = e.target; setTempInfo(prev => ({ ...prev, [id]: value })) }
    const onChangeDate = ([startDate, endDate]) => setTempInfo(prev => ({
      ...prev, startDate: startDate ? startOfDayMs(startDate) : 0, endDate: endDate ? endOfDayMs(endDate) : 0,
    }))
    /** 검색 조건 초기화 및 목록 재조회 */
    const onClear = () => { setTempInfo({ ...DEFAULT_SEARCH_VALUE }); fetchList({ ...DEFAULT_SEARCH_VALUE }); clearSearch() }
    /** 검색 실행 > 현재 선택된 상태 탭은 유지 */
    const onSearch = () => {
      const { status } = useVodListStore.getState().searchInfo
      setSearchInfo({ ...tempInfo, status })
      fetchList({ ...tempInfo, status })
    }

    return html`<div class="flex flex-wrap items-end gap-2">
      <${Selectbox} className="w-32" label="방송 유형" options=${VOD_TYPE_OPTIONS} value=${tempInfo.bdTpVal} onChange=${v => onChangeSelect('bdTpVal', v)} />
      <${Selectbox} className="w-32" label="검색 유형" options=${VOD_SEARCH_TYPE_OPTIONS} value=${tempInfo.type} onChange=${v => onChangeSelect('type', v)} />
      <${Input} className="w-59.5" id="keyword" value=${tempInfo.keyword} placeholder="검색어를 입력하세요" onChange=${onChangeInput}
        onKeyUp=${e => e.key === 'Enter' && onSearch()} onClear=${() => setTempInfo(prev => ({ ...prev, keyword: '' }))} showSearchIcon />
      <${DateTimepicker} className="w-80" label="편성 일시" range
        startDate=${tempInfo.startDate ? new Date(tempInfo.startDate) : null} endDate=${tempInfo.endDate ? new Date(tempInfo.endDate) : null} onRangeChange=${onChangeDate} />
      <${Button} size="md" iconSize=${16} variant="iconOnlyPrimary" leftIcon=${I.Search} onClick=${onSearch} />
      <${Button} size="md" variant="iconOnly" iconSize=${16} leftIcon=${I.RefreshCw} onClick=${onClear} />
    </div>`
  }

  /* =====================================================================
   * 목록: VodCardPanel
   * ===================================================================== */
  const renderVodCardSkeleton = key => html`
    <div key=${key} class="card flex min-h-[300px] w-full max-w-md min-w-0 flex-col">
      <${Skeleton} className="min-h-0 flex-1 rounded-t-md" />
      <div class="flex flex-col gap-3 p-4">
        <div><${Skeleton} variant="text" className="w-[70%]" /><${Skeleton} variant="text" className="mt-1 w-[60%]" /></div>
        <${Skeleton} className="h-9" />
      </div>
    </div>`

  const VodCardPanel = () => {
    const searchInfo = useVodListStore(s => s.searchInfo)
    const vodData = useVodListStore(s => s.vodData)
    const isLoading = useVodListStore(s => s.isLoading)
    const scrollContainerRef = useRef(null)
    const [visibleCount, setVisibleCount] = useState(PAGE_SIZE.MEDIUM)

    // 마운트 및 상태 탭 변경 시 목록 조회 (상세에서 돌아온 경우는 노출 개수만 복원)
    useEffect(() => {
      const { savedListUiState, fetchList } = useVodListStore.getState()
      if (savedListUiState) { setVisibleCount(savedListUiState.visibleCount); return }
      fetchList(searchInfo)
    }, [searchInfo.status])

    // 이전 스크롤 위치 복원
    useEffect(() => {
      const { setListUiState, savedListUiState } = useVodListStore.getState()
      if (savedListUiState && visibleCount === savedListUiState.visibleCount && scrollContainerRef.current) {
        const container = getScrollableAncestor(scrollContainerRef.current)
        // 셸 라우터가 화면 전환 직후 스크롤을 맨 위로 올리므로 한 프레임 뒤에 복원한다
        requestAnimationFrame(() => container?.scrollTo({ top: savedListUiState.scrollY }))
        setListUiState(null)
      }
    }, [visibleCount])

    const visibleItems = vodData.list.slice(0, visibleCount)
    const hasMore = visibleCount < vodData.list.length
    const { loadMoreRef } = useInfiniteScroll({ onLoadMore: () => setVisibleCount(prev => prev + PAGE_SIZE.MEDIUM), hasMore, isLoading: false })

    const refreshList = () => { setVisibleCount(PAGE_SIZE.MEDIUM); useVodListStore.getState().fetchList(useVodListStore.getState().searchInfo) }
    const { confirm, alertProps } = useAnalyzeConfirm(refreshList)

    // 화면 이동 > 스크롤 및 노출 개수 저장
    const onPageMove = vodId => {
      const scrollY = getScrollableAncestor(scrollContainerRef.current)?.scrollTop ?? 0
      useVodListStore.getState().setListUiState({ scrollY, visibleCount })
      navigate(`/hl/vod/${vodId}`)
    }
    const onConfirm = (event, id, overallStatus) => { event.stopPropagation(); confirm(id, overallStatus) }

    /** 분석 상태에 따른 버튼 렌더링 */
    const statusButtonArea = data => {
      const { overallStatus, bdTpVal, pgmCd, bdCd, bdScheStrDtm } = data
      const vodId = [bdTpVal, pgmCd, bdCd, timestampToLocalISO(bdScheStrDtm)].join('_')
      switch (overallStatus.toLocaleLowerCase()) {
        case 'failed':
          return html`<${Button} leftIcon=${I.RefreshCw} iconSize=${16} onClick=${e => onConfirm(e, vodId, overallStatus)}>분석 재요청<//>`
        case 'processing':
          return html`<div role="status" class=${cn(buttonVariants({ variant: 'ghost', size: 'md' }), 'bg-bg-primary-subtle cursor-default')} onClick=${e => e.stopPropagation()}>
            <span class="flex items-center gap-1.5 font-semibold">
              ${sparkleImg(14, 'size-[14px] shrink-0')}
              <span class="bg-gradient-to-r from-[#36bcff] to-[#f541ff] bg-clip-text text-transparent">영상 분석 중...</span>
            </span>
          </div>`
        case 'completed':
          return html`<${Button} variant="primary" leftIcon=${I.Film} iconSize=${16}>하이라이트 만들기<//>`
        default:
          return html`<${Button} variant="outlineGradient" onClick=${e => onConfirm(e, vodId, overallStatus)}>
            ${sparkleImg(14, 'size-[14px] shrink-0')}${gradientText('영상 분석')}<//>`
      }
    }

    /** 지난 방송 카드 1개 */
    const renderVodCardItem = data => {
      const { bdTpVal, bdCd, pgmCd, bdScheStrDtm, tnailUrl, pgmNm, bdNm, overallStatus, analsReqDtm } = data
      const vodId = [bdTpVal, pgmCd, bdCd, unixToTimestamp(bdScheStrDtm)].join('_')
      return html`<div key=${vodId} class="card flex h-full min-h-[300px] w-full max-w-md min-w-0 cursor-pointer flex-col select-none" onClick=${() => onPageMove(vodId)}>
        <div class="bg-bg-black relative min-h-0 flex-1 rounded-t-md">
          ${tnailUrl && html`<${ImageBox} className="object-contain" src=${tnailUrl} alt=${pgmNm} />`}
          <div class="absolute inset-x-0 top-0 rounded-md bg-gradient-to-b from-black/70 via-black/30 px-3 pt-3 pb-8">
            <div class="flex items-start justify-between gap-2">
              <span class=${`text-xs font-medium ${textColor(overallStatus)}`}>
                ${STATUS_LABEL[overallStatus ?? 'pending']}
                ${overallStatus === 'processing' && analsReqDtm && html`<span class="ml-1.5 font-normal text-white/70">${timestampToString(analsReqDtm, 'dotFull')}</span>`}
              </span>
            </div>
          </div>
        </div>
        <div class="flex min-w-0 shrink-0 flex-col gap-3 p-4">
          <div class="min-w-0">
            <h3 class="text-tx-strong min-w-0 truncate text-sm font-semibold">${bdNm}</h3>
            <p class="text-tx-muted mt-1 flex gap-1 text-xs">
              ${pgmCd}<span class="text-tx-subtle">|</span><span class="text-tx-caption">${timestampToString(bdScheStrDtm, 'dotFull')}</span>
            </p>
          </div>
          ${statusButtonArea(data)}
        </div>
      </div>`
    }

    if (isLoading) {
      return html`<div class="grid grid-cols-[repeat(auto-fill,minmax(16rem,1fr))] gap-5 pr-2">
        ${Array.from({ length: 5 }, (_, i) => renderVodCardSkeleton(`skeleton_${i}`))}</div>`
    }

    return html`
      <div ref=${scrollContainerRef} class="pr-2">
        ${vodData.list.length
          ? html`<div class="grid grid-cols-[repeat(auto-fill,minmax(16rem,1fr))] gap-5">${visibleItems.map(renderVodCardItem)}</div>
            <div ref=${loadMoreRef} class="h-px" aria-hidden="true"></div>`
          : html`<${EmptyState} title="검색 결과가 없습니다" description="검색어를 변경하거나 필터를 조정해 보세요." />`}
      </div>
      <${Alert} ...${alertProps} />`
  }

  /* =====================================================================
   * 목록: VodCardList · 페이지
   * ===================================================================== */
  const VodCardList = () => {
    const searchInfo = useVodListStore(s => s.searchInfo)
    const setStatus = useVodListStore(s => s.setStatus)
    const statusInfo = useVodListStore(s => s.statusInfo)
    const tabs = VOD_STATUS_TABS.map(item => ({ id: item.id, label: `${item.label} (${formatNumber(statusInfo[item.id])})`, content: html`<${VodCardPanel} />` }))
    // 탭 라벨: 검색 영역 바로 아래에 고정
    return html`<${Tabs} variant="underline" tabs=${tabs} value=${searchInfo.status} onChange=${setStatus}
      stickyClassName="bg-bg-white sticky [top:var(--search-h)] z-20" className="pb-5" />`
  }

  const VodListPage = () => {
    const searchRef = useRef(null)
    const [searchH, setSearchH] = useState(0)
    useEffect(() => {
      const el = searchRef.current
      if (!el) return
      const ro = new ResizeObserver(() => setSearchH(el.offsetHeight))
      ro.observe(el)
      return () => ro.disconnect()
    }, [])
    // 다른 화면으로 나갈 때만 초기화 (상세 화면 이동 시 값 유지)
    useEffect(() => () => {
      if (useVodListStore.getState().savedListUiState !== null) return
      useVodListStore.getState().resetList()
      useVodListStore.getState().resetSearchInfo()
    }, [])
    return html`<div class="flex h-full flex-col px-10" style=${{ '--search-h': `${searchH + 54}px` }}>
      <div ref=${searchRef} class="bg-bg-white sticky top-[54px] z-30 py-3"><${VodSearch} /></div>
      <${VodCardList} />
    </div>`
  }

  /* =====================================================================
   * 상세: InfoSectionMeta
   * ===================================================================== */
  const STATUS_NAME = { pending: '분석 대기', failed: '분석 실패', processing: '분석 중', completed: '분석 완료' }
  const STATUS_DOT = { pending: 'bg-bg-heavy', failed: 'bg-bg-red-strong', processing: 'bg-bg-yellow-strong', completed: 'bg-bg-green-strong' }
  const STATUS_BADGE = { pending: 'gray', failed: 'red', processing: 'yellow', completed: 'green' }

  const InfoSectionMeta = () => {
    const detailInfo = useVodDetailStore(s => s.detailInfo)
    const st = detailInfo.overallStatus.toLocaleLowerCase()
    return html`<div class="flex items-center gap-2">
      ${detailInfo.overallStatus && html`<span class="text-tx-normal inline-flex items-center gap-1.5 font-medium">
        <${Badge} variant=${STATUS_BADGE[st]} shape="rounded" className="text-xs">
          ${STATUS_NAME[st]}<span class=${cn(STATUS_DOT[st], 'ml-1 h-2 w-2 rounded-full')}></span>
        <//>
      </span>`}
      ${detailInfo.analsReqDtm != null && detailInfo.analsReqDtm > 0 && st !== 'completed' && html`
        <span class="before:bg-bd-default text-tx-strong text-13 relative flex items-center leading-none before:mr-2 before:inline-block before:h-4 before:w-px before:content-['']">
          ${`분석 시작 일시 : ${timestampToString(detailInfo.analsReqDtm, 'dotFull')}`}
        </span>`}
    </div>`
  }

  /* =====================================================================
   * 상세: StatusButtonArea
   * ===================================================================== */
  const StatusButtonArea = ({ status, vodId }) => {
    const { confirm, alertProps } = useAnalyzeConfirm(id => useVodDetailStore.getState().fetchVodDetail(id))
    const statusButton = () => {
      switch (status.toLocaleLowerCase()) {
        case 'failed':
          return html`<${Button} size="lg" leftIcon=${I.RefreshCw} iconSize=${16} className="w-full" onClick=${() => confirm(vodId, status)}>분석 재요청<//>`
        case 'processing':
          return html`<div class=${cn(buttonVariants({ variant: 'ghost', size: 'lg' }), 'bg-bg-primary-subtle w-full')}>
            <span class="flex items-center gap-1.5 font-semibold">
              ${sparkleImg(16, 'size-4 shrink-0')}
              <span class="bg-gradient-to-r from-[#36bcff] to-[#f541ff] bg-clip-text text-sm text-transparent">영상 분석 중...</span>
            </span>
          </div>`
        case 'completed':
          // 원본은 새 탭(target=_blank)으로 연다 — 미리보기는 같은 창에서 편집 화면으로 이동
          return html`<${Button} variant="primary" size="lg" leftIcon=${I.Film} href=${`/hl/edit/${vodIdToTimestamp(vodId)}`} className="w-full">하이라이트 만들기<//>`
        default:
          return html`<${Button} size="lg" variant="outlineGradient" onClick=${() => confirm(vodId, status)} className="w-full" disabled=${!status}>
            ${sparkleImg(16)}${gradientText('영상 분석')}<//>`
      }
    }
    return html`${statusButton()}<${Alert} ...${alertProps} />`
  }

  /* =====================================================================
   * 상세: InfoSection
   * ===================================================================== */
  const MetaRow = ({ label, truncate = false, children }) => html`
    <div class=${cn('grid min-h-10 grid-cols-[6rem_minmax(0,1fr)] gap-4 py-2.5', truncate ? 'items-center' : 'items-start')}>
      <span class="text-tx-caption text-xs">${label}</span>
      <div class=${cn('text-tx-normal text-right text-xs', truncate ? 'min-w-0 overflow-hidden' : '[word-break:break-word]')}>${children}</div>
    </div>`

  const InfoSection = ({ vodId }) => {
    const detailInfo = useVodDetailStore(s => s.detailInfo)
    const videoRef = useRef(null)
    const [isShow, setIsShow] = useState(false)

    // 재생 시 다운로드 버튼 표시 (원본 useVideoStateSync 의 onPlayStateChange)
    useEffect(() => {
      const v = videoRef.current
      if (!v) return
      const onPlay = () => setIsShow(true)
      v.addEventListener('play', onPlay)
      return () => v.removeEventListener('play', onPlay)
    }, [])

    return html`<div class="max-laptop:static max-laptop:shrink sticky top-[54px] z-10 w-full max-w-full min-w-0 shrink-0 self-start overflow-hidden pt-6">
      <div class="flex min-h-0 min-w-0 flex-col gap-4 overflow-hidden">
        <div class="relative flex aspect-video w-full items-center justify-center overflow-hidden rounded-xl">
          <${Video} className="bg-bg-muted h-full w-full" videoRef=${videoRef} src=${detailInfo.vmOrgUrl} poster=${detailInfo.tnailUrl}
            overlay=${isShow && html`<${Button} variant="ghost" size="sm" leftIcon=${I.Download} iconSize=${14} onClick=${() => notInPreview('영상 다운로드')}
              className="enabled:hover:text-tx-white enabled:hover:bg-bg-black/30 bg-bg-black/30 text-tx-white pointer-events-auto absolute right-2.5 bottom-10 h-6 rounded-full border-none px-3">다운로드<//>`} />
        </div>

        <div class="card min-w-0 overflow-hidden px-4">
          <${MetaRow} label="프로그램명">${detailInfo.pgmNm || '-'}<//>
          <${MetaRow} label="프로그램 코드">${detailInfo.pgmCd || '-'}<//>
          <${MetaRow} label="편성 일시">${detailInfo.bdScheStrDtm ? timestampToString(detailInfo.bdScheStrDtm, 'dotFull') : '-'}<//>
          <${MetaRow} label="클린본 URL" truncate>
            ${detailInfo.cleanUrl
              ? html`<button type="button" title=${detailInfo.cleanUrl} class="text-tx-normal flex w-full max-w-full min-w-0 items-center gap-1 overflow-hidden text-right select-none"
                  onClick=${() => navigator.clipboard?.writeText(detailInfo.cleanUrl).catch(() => {})}>
                  <span class="block min-w-0 flex-1 truncate">${detailInfo.cleanUrl}</span><${I.Copy} size=${12} className="shrink-0" />
                </button>`
              : '-'}
          <//>
        </div>
        <div class="laptop:block hidden"><${StatusButtonArea} status=${detailInfo.overallStatus} vodId=${vodId} /></div>
      </div>
    </div>`
  }

  /* =====================================================================
   * 상세: AnalyzeSection (AI 추천)
   * ===================================================================== */
  const AnalyzeSection = ({ vodId }) => {
    const [activeSellingPoint, setActiveSellingPoint] = useState('')
    const [pdReview, setPdReview] = useState('')
    const [analysisSummary, setAnalysisSummary] = useState('')
    const [sellingPoints, setSellingPoints] = useState([])
    const { overallStatus } = useVodDetailStore(s => s.detailInfo)
    const [collapsed, setCollapsed] = useState(true)

    const sellingPointItems = (code, items) => html`<ul class="space-y-1.5">
      ${items.slice(0, 5).map((point, index) => html`<li key=${`${code}_${index}`} class="text-tx-normal flex items-start gap-2 text-xs">
        <${I.Check} className="text-tx-primary mt-0.5 h-3.5 w-3.5 shrink-0" />${point}</li>`)}
    </ul>`
    const sellingPointTabs = sellingPoints.map(item => ({ id: item.stdioCtgCd, label: item.stdioCtgNm, content: sellingPointItems(item.stdioCtgCd, item.benefits) }))

    /** 셀링포인트 조회 */
    useEffect(() => {
      if (!vodId) return
      const { setIsPointLoading } = useVodDetailStore.getState()
      let cancelled = false
      setSellingPoints([]); setActiveSellingPoint('')
      setIsPointLoading(true)
      getVodSellingPoint(vodId).then(res => {
        if (cancelled) return
        const points = res?.sellingPoints ?? []
        setSellingPoints(points); setActiveSellingPoint(points[0]?.stdioCtgCd ?? '')
      }).finally(() => { if (!cancelled) setIsPointLoading(false) })
      return () => { cancelled = true }
    }, [vodId])

    /** 분석 완료: AI 분석 요약 / 그 외(또는 요약 없음): PD 리뷰 */
    useEffect(() => {
      if (!vodId || !overallStatus) return
      const { setIsAnalysisLoading } = useVodDetailStore.getState()
      let cancelled = false
      setPdReview(''); setAnalysisSummary(''); setIsAnalysisLoading(true)
      const fetchAnalysisSummary = async () => {
        try {
          const res = await getVodAnalysisSummary(vodId)
          if (!cancelled) setPdReview(res?.bdReviewSumry ?? '')
        } finally { if (!cancelled) setIsAnalysisLoading(false) }
      }
      const fetchContentSummary = async () => {
        const res = await getContentSummary(vodId)
        if (cancelled) return
        if (res?.contentSummary) { setAnalysisSummary(res.contentSummary); setIsAnalysisLoading(false) } else await fetchAnalysisSummary()
      }
      overallStatus === 'completed' ? fetchContentSummary() : fetchAnalysisSummary()
      return () => { cancelled = true }
    }, [vodId, overallStatus])

    useEffect(() => { setCollapsed(!pdReview && !analysisSummary && sellingPoints.length === 0) }, [pdReview, analysisSummary, sellingPoints])

    return html`<div class="card flex min-h-0 flex-col p-5">
      <div class="flex shrink-0 items-center justify-between gap-2">
        <h3 class="text-tx-black flex gap-2 text-sm font-bold">${sparkleImg(16, 'size-4 shrink-0')}AI 추천</h3>
        <${Button} variant="ghost" size="xs" iconSize=${16} leftIcon=${I.ChevronUp} isRotate=${collapsed} onClick=${() => setCollapsed(prev => !prev)} />
      </div>
      ${!collapsed && html`<div class="mt-4 min-h-0 flex-1 space-y-4 overflow-y-auto">
        <div>
          <strong class="text-tx-strong word-highlighter text-13 mb-3.5 font-semibold tracking-wide uppercase">${pdReview && !analysisSummary ? '방송 리뷰' : '방송 요약'}</strong>
          <p class="text-tx-normal bg-bg-subtle p-4 text-xs leading-relaxed">${analysisSummary || pdReview || 'AI 요약 정보는 영상 분석 완료 후 확인하실 수 있습니다.'}</p>
        </div>
        ${!!sellingPoints.length && html`<div>
          <strong class="text-tx-strong word-highlighter text-13 mb-3.5 font-semibold tracking-wide uppercase">셀링포인트</strong>
          <div class="bg-bg-subtle flex flex-col gap-4 p-4">
            <${Tabs} variant="rounded" tabs=${sellingPointTabs} value=${activeSellingPoint} onChange=${setActiveSellingPoint} />
          </div>
        </div>`}
      </div>`}
    </div>`
  }

  /* =====================================================================
   * 상세: 상품 모달 (ProductInfoModal · ProductItemStockModal)
   * ===================================================================== */
  const ModalProductHead = ({ productInfo, children }) => html`
    <div class="border-bd-default flex shrink-0 items-center gap-4 border-t border-b [border-bottom-style:dashed] px-5.5 py-5">
      <div class="h-16 w-16 shrink-0"><${ImageBox} src=${productInfo.itemImgUrl} alt=${productInfo.itemNm} /></div>
      ${children}
    </div>`

  const INFO_COLUMNS = [{ key: 'label', header: '항목', align: 'center' }, { key: 'value', header: '내용', align: 'left' }]
  const ProductInfoModal = ({ isOpen, onClose, productInfo }) => {
    const [isLoading, setIsLoading] = useState(false)
    const [detailInfo, setDetailInfo] = useState([])
    useEffect(() => {
      if (!isOpen || !productInfo.itemCd) return
      setIsLoading(true)
      getVodProductDetail(productInfo.itemCd)
        .then(res => setDetailInfo(res?.map(item => ({ label: item.attrNm || '-', value: item.attrVal === 'null' ? '-' : item.attrVal || '-' })) ?? []))
        .finally(() => setIsLoading(false))
      return () => { setDetailInfo([]); setIsLoading(false) }
    }, [isOpen, productInfo])

    return html`<${Modal} isOpen=${isOpen} onClose=${onClose} title="상품 상세 정보" size="md" contentPadding=${false}>
      <${ModalProductHead} productInfo=${productInfo}>
        <div class="flex w-full flex-col gap-1">
          <div><p class="text-tx-strong text-base font-semibold">${productInfo.itemNm}</p></div>
          <div><p class="text-tx-muted mt-0.5 text-xs">${productInfo.itemCd}</p></div>
        </div>
      <//>
      <div class="relative flex min-h-75 w-full">
        ${isLoading
          ? html`<div class="z-loading absolute inset-0 flex h-full items-center justify-center"><${LoadingSpinner} /></div>`
          : html`<${Table} headerType="row" className="mx-5 mt-5" colGroup=${[{ width: '28%' }, { width: '72%' }]} columns=${INFO_COLUMNS} data=${detailInfo} isScroll
              emptyState=${html`<${EmptyState} title="상품 상세 정보가 없습니다" />`} />`}
      </div>
    <//>`
  }

  const PRODUCT_STOCK_SEARCH_TYPE_OPTIONS = [{ label: '단품명', value: 'unitNm' }, { label: '단품 코드', value: 'unitCd' }]
  const DEFAULT_PRODUCT_STOCK_SEARCH = { type: 'unitNm', keyword: '' }
  const STOCK_COLUMNS = [
    { key: 'unitNm', header: '단품명', align: 'center' },
    { key: 'unitCd', header: '단품 코드', align: 'center' },
    { key: 'stockQty', header: '가용 재고', align: 'center', render: row => formatNumber(row.stockQty) },
  ]
  const ProductItemStockModal = ({ isOpen, onClose, productInfo }) => {
    const [isLoading, setIsLoading] = useState(false)
    const [tempSearchInfo, setTempSearchInfo] = useState({ ...DEFAULT_PRODUCT_STOCK_SEARCH })
    const [stockSearchInfo, setStockSearchInfo] = useState({ ...DEFAULT_PRODUCT_STOCK_SEARCH })
    const [stockList, setStockList] = useState({ list: [], total: 0 })

    const onSearch = () => setStockSearchInfo(tempSearchInfo)
    const onClear = () => { setTempSearchInfo({ ...DEFAULT_PRODUCT_STOCK_SEARCH }); setStockSearchInfo({ ...DEFAULT_PRODUCT_STOCK_SEARCH }) }
    const totalStockQty = stockList.list.reduce((sum, item) => sum + (item.stockQty ?? 0), 0)

    useEffect(() => {
      if (!isOpen || !productInfo.itemCd) return
      setIsLoading(true)
      getVodProductStockList(productInfo.itemCd)
        .then(res => { const list = res?.itemUnitStockList ?? []; setStockList({ list, total: list.length }) })
        .finally(() => setIsLoading(false))
      return () => { setStockList({ list: [], total: 0 }); setIsLoading(false) }
    }, [isOpen, productInfo])

    const { type, keyword } = stockSearchInfo
    const filtered = !keyword ? stockList.list : stockList.list.filter(item => (type === 'unitCd' ? item.unitCd : item.unitNm).includes(keyword))

    return html`<${Modal} isOpen=${isOpen} onClose=${onClose} size="md" title="단품 재고 정보" contentPadding=${false}>
      <${ModalProductHead} productInfo=${productInfo}>
        <div class="flex w-full flex-col gap-2">
          <div class="flex flex-1 items-center justify-between gap-2">
            <p class="text-tx-strong text-base font-semibold">${productInfo.itemNm}</p>
            <div class="text-tx-strong flex shrink-0 items-center gap-3 text-xs">
              <p>단품 항목 개수<span class="text-tx-primary pl-1 font-semibold">${formatNumber(stockList.total)}</span></p>
              <span class="bg-bg-element h-3 w-px"></span>
              <p>단품 재고 총 개수<span class="text-tx-primary pl-1 font-semibold">${formatNumber(totalStockQty)}</span></p>
            </div>
          </div>
          <div class="flex items-center justify-between"><p class="text-tx-muted mt-0.5 text-xs">${productInfo.itemCd}</p></div>
        </div>
      <//>

      <div class="flex shrink-0 items-center gap-2 px-5.5 py-5">
        <${Selectbox} className="w-32" options=${PRODUCT_STOCK_SEARCH_TYPE_OPTIONS} value=${tempSearchInfo.type} onChange=${v => setTempSearchInfo(prev => ({ ...prev, type: v }))} />
        <${Input} className="w-90" id="keyword" value=${tempSearchInfo.keyword} placeholder="검색어를 입력하세요"
          onChange=${e => setTempSearchInfo(prev => ({ ...prev, keyword: e.target.value }))} onKeyUp=${e => e.key === 'Enter' && onSearch()}
          onClear=${() => setTempSearchInfo(prev => ({ ...prev, keyword: '' }))} showSearchIcon />
        <${Button} size="md" iconSize=${16} variant="iconOnlyPrimary" leftIcon=${I.Search} onClick=${onSearch} />
        <${Button} size="md" variant="iconOnly" iconSize=${16} leftIcon=${I.RefreshCw} onClick=${onClear} />
      </div>

      <div class="relative flex min-h-75 w-full">
        ${isLoading
          ? html`<div class="z-loading absolute inset-0 flex h-full items-center justify-center"><${LoadingSpinner} /></div>`
          : html`<${Table} className="mx-5.5 mb-5" columns=${STOCK_COLUMNS} colGroup=${[{ width: '40%' }, { width: '40%' }, { width: '20%' }]} data=${filtered} isScroll
              emptyState=${html`<${EmptyState} title="단품 재고 정보가 없습니다" />`} />`}
      </div>
    <//>`
  }

  /* =====================================================================
   * 상세: ProductSection (편성 상품)
   * ===================================================================== */
  const PRODUCT_SEARCH_TYPE_OPTIONS = [{ label: '상품명', value: 'productNm' }, { label: '상품 코드', value: 'productCd' }]
  const DEFAULT_PRODUCT_SEARCH = { type: 'productNm', keyword: '' }

  const ProductSection = ({ vodId }) => {
    const [activeModal, setActiveModal] = useState('')
    const [selectedProductInfo, setSelectedProductInfo] = useState(DEFAULT_PRODUCT_INFO)
    const [tempSearchInfo, setTempSearchInfo] = useState({ ...DEFAULT_PRODUCT_SEARCH })
    const [productSearchInfo, setProductSearchInfo] = useState({ ...DEFAULT_PRODUCT_SEARCH })
    const [productList, setProductList] = useState([])

    const onSearch = () => setProductSearchInfo(tempSearchInfo)
    const onClear = () => { setTempSearchInfo({ ...DEFAULT_PRODUCT_SEARCH }); setProductSearchInfo({ ...DEFAULT_PRODUCT_SEARCH }) }

    /** 편성 상품 목록 조회 */
    useEffect(() => {
      if (!vodId) return
      const { setIsProductLoading } = useVodDetailStore.getState()
      setIsProductLoading(true)
      getVodProductList(vodId).then(res => setProductList(res.bdItems)).finally(() => setIsProductLoading(false))
    }, [vodId])

    const { type, keyword } = productSearchInfo
    const filtered = !keyword ? productList : productList.filter(item => (type === 'productCd' ? item.itemCd : item.itemNm).includes(keyword))

    const onOpenModal = (modal, product) => { setSelectedProductInfo(product); setActiveModal(modal) }
    const onCloseModal = () => { setActiveModal(''); setSelectedProductInfo(DEFAULT_PRODUCT_INFO) }

    return html`<div class="card flex min-h-60 w-full min-w-0 flex-1 flex-col p-5">
      <h3 class="text-tx-strong flex shrink-0 items-center gap-2 text-sm font-bold">
        <${Icon} icon=${I.Tag} variant="rounded" color="blue" size="sm" className="text-tx-primary" />편성 상품
      </h3>

      <div class="mt-4 mb-4 flex w-full min-w-0 shrink-0 items-center gap-2">
        <${Selectbox} className="w-32 shrink-0" options=${PRODUCT_SEARCH_TYPE_OPTIONS} value=${tempSearchInfo.type} onChange=${v => setTempSearchInfo(prev => ({ ...prev, type: v }))} />
        <${Input} className="min-w-0 flex-1" id="keyword" value=${tempSearchInfo.keyword} placeholder="검색어를 입력하세요"
          onChange=${e => setTempSearchInfo(prev => ({ ...prev, keyword: e.target.value }))} onKeyUp=${e => e.key === 'Enter' && onSearch()}
          onClear=${() => setTempSearchInfo(prev => ({ ...prev, keyword: '' }))} showSearchIcon />
        <${Button} size="md" iconSize=${16} variant="iconOnlyPrimary" className="shrink-0" leftIcon=${I.Search} onClick=${onSearch} />
        <${Button} size="md" variant="iconOnly" iconSize=${16} className="shrink-0" leftIcon=${I.RefreshCw} onClick=${onClear} />
      </div>

      ${filtered.length
        ? html`<ul class="grid min-h-0 flex-1 grid-cols-2 content-start gap-4 overflow-x-hidden overflow-y-auto">
            ${filtered.map(product => html`<li key=${product.itemCd} class="card flex min-w-0 items-center gap-4 overflow-hidden p-3">
              ${product.itemImgUrl
                ? html`<${ImageBox} src=${product.itemImgUrl} alt=${product.itemNm} size="sm" wrapperClassName="size-16 shrink-0" />`
                : html`<div class="bg-bg-muted size-16 shrink-0"></div>`}
              <div class="flex w-0 min-w-0 flex-1 flex-col gap-1 overflow-hidden">
                <strong class="text-tx-strong block min-w-0 text-sm font-semibold select-none">${product.itemNm}</strong>
                <p class="text-tx-caption block min-w-0 truncate text-xs">${product.itemCd}</p>
                <div class="flex flex-wrap gap-2">
                  <${Button} variant="outline" size="xs" className="text-tx-primary border-bd-primary" onClick=${() => onOpenModal('stock', product)}>단품 재고 정보<//>
                  ${product.itemAttrExistsYn === 'Y' && html`<${Button} variant="outline" size="xs" onClick=${() => onOpenModal('info', product)}>상품 상세 정보<//>`}
                </div>
              </div>
            </li>`)}
          </ul>`
        : html`<${EmptyState} title="조건에 맞는 데이터가 없습니다." height="h-full" />`}

      <${ProductInfoModal} isOpen=${activeModal === 'info'} onClose=${onCloseModal} productInfo=${selectedProductInfo} />
      <${ProductItemStockModal} isOpen=${activeModal === 'stock'} onClose=${onCloseModal} productInfo=${selectedProductInfo} />
    </div>`
  }

  /* =====================================================================
   * 상세 페이지
   * ===================================================================== */
  const LAPTOP_LAYOUT_MEDIA_QUERY = '(max-width: 1199px)'
  const VodDetailPage = ({ params }) => {
    const { bdNm, overallStatus } = useVodDetailStore(s => s.detailInfo)
    const isLoading = useVodDetailStore(s => s.isDetailLoading || s.isAnalysisLoading || s.isPointLoading || s.isProductLoading)
    const vodId = useMemo(() => vodIdToISO(params.id), [params.id])
    const [isLaptopLayout, setIsLaptopLayout] = useState(() => matchMedia(LAPTOP_LAYOUT_MEDIA_QUERY).matches)

    useEffect(() => {
      const { fetchVodDetail, resetVodDetail } = useVodDetailStore.getState()
      fetchVodDetail(vodId)
      return () => resetVodDetail()
    }, [vodId])

    useEffect(() => {
      const mq = matchMedia(LAPTOP_LAYOUT_MEDIA_QUERY)
      const onChange = () => setIsLaptopLayout(mq.matches)
      mq.addEventListener('change', onChange)
      return () => mq.removeEventListener('change', onChange)
    }, [])
    const isActionAnimated = !isLoading && isLaptopLayout
    // shortcut: 원본은 스크롤·리사이즈마다 하단 버튼의 fixed/absolute 좌표를 계산한다 — 같은 효과를 position: sticky 로 낸다 (1200px 미만에서만 보임)

    return html`<div class="relative flex flex-col pb-20">
      <${DetailTopBar} title=${bdNm || '-'} backHref="/hl/vod" rightSlot=${html`<${InfoSectionMeta} />`} />

      <div class="max-laptop:pb-[66px] relative flex min-h-0 flex-1 flex-col px-10">
        <div class="max-laptop:flex-none max-laptop:auto-rows-auto max-laptop:grid-cols-1 max-laptop:grid-rows-none grid min-h-0 min-w-0 flex-1 grid-cols-[minmax(0,31.25rem)_minmax(0,1fr)] grid-rows-[minmax(0,1fr)] gap-5">
          <${InfoSection} vodId=${vodId} />
          <div class="max-laptop:flex-none max-laptop:overflow-visible max-laptop:pt-0 flex min-h-0 flex-col gap-4 overflow-hidden pt-6">
            <${AnalyzeSection} vodId=${vodId} />
            <${ProductSection} vodId=${vodId} />
          </div>
        </div>

        <div class=${cn('laptop:hidden z-10', (isLoading || !isActionAnimated) && 'pointer-events-none opacity-0', isActionAnimated && 'fx-slide-in-up')}
          style=${{ position: 'sticky', bottom: 0, '--height': '46px' }}>
          <${StatusButtonArea} status=${overallStatus} vodId=${vodId} />
        </div>
      </div>

      ${isLoading && html`<div class="z-loading bg-bg-muted/80 fixed inset-0 flex items-center justify-center"><${LoadingSpinner} size="lg" /></div>`}
    </div>`
  }

  PAGES.VodList = VodListPage
  PAGES.VodDetail = VodDetailPage
})()

;
;

/* =====================================================================
 * 라우트
 * ===================================================================== */
const HL_CRUMB = [{ label: 'AI 생성' }, { label: '하이라이트 숏츠' }]
const sparkles = I.Sparkles
const ROUTES = [
  { re: /^\/hl\/vod$/, page: 'VodList', layout: { title: '지난 방송 목록', icon: sparkles, breadcrumbItems: [...HL_CRUMB, { label: '지난 방송 목록' }] } },
  { re: /^\/hl\/vod\/([^/]+)$/, page: 'VodDetail', layout: { title: '지난 방송 상세', icon: sparkles, breadcrumbItems: [...HL_CRUMB, { label: '지난 방송 목록', href: '/hl/vod' }, { label: '지난 방송 상세' }] } },
  { re: /^\/hl\/my$/, page: 'MyShorts', layout: { title: '내가 만든 숏츠', icon: sparkles, breadcrumbItems: [...HL_CRUMB, { label: '내가 만든 숏츠' }] } },
  { re: /^\/hl\/pmpt$/, page: 'Pmpt', layout: { title: '하이라이트 프롬프트', icon: sparkles, breadcrumbItems: [...HL_CRUMB, { label: '하이라이트 프롬프트' }] } },
  { re: /^\/hl\/pgm$/, page: 'Pgm', layout: { title: '분석 대상 PGM 관리', icon: I.Shield, breadcrumbItems: [...HL_CRUMB, { label: '분석 대상 PGM 관리' }] } },
  { re: /^\/hl\/edit\/([^/]+)$/, page: 'Edit', layout: null },
]
const Placeholder = ({ name }) => html`<${EmptyState} title=${`${name} 화면 준비 중`} description="screens 모듈이 아직 없습니다." />`

function App() {
  const path = useRoute()
  const route = ROUTES.find(r => r.re.test(path))
  useEffect(() => { if (!route) navigate(DEFAULT_ROUTE) }, [route])
  useEffect(() => { document.getElementById('main-scroll-container')?.scrollTo(0, 0) }, [path])
  if (!route) return null
  const params = { id: decodeURIComponent(path.match(route.re)[1] ?? '') }
  const Page = PAGES[route.page]
  const body = Page ? html`<${Page} key=${path} params=${params} />` : html`<${Placeholder} name=${route.page} />`
  return html`
    ${route.layout ? html`<${SubLayout} ...${route.layout} pathname=${path}>${body}<//>` : body}
    <${ToastHost} />`
}

render(html`<${App} />`, document.getElementById('app'))
</script>
</body>
</html>
