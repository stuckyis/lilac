<style type="text/tailwindcss">
/**
 * tokens.css
 * Design Tokens: 디자인 시스템의 기본 토큰을 정의합니다.
 * ---------------------------------------------------------
 * [규칙 1] @theme inline에 정의된 값은 직접 사용을 지양합니다. (ex. bg-primary-500 대신 bg-bg-primary 권장)
 * [규칙 2] 스타일이 2회 이상 사용될 경우 토큰으로 등록하고, 1회성인 경우 대괄호 문법을 사용합니다. (ex. text-[99px])
 * [규칙 3] 네이밍: --color-{context}-{role}, --text-{typography}, --spacing-{value}
 */

@theme inline {
  /* =========================
   * PRIMITIVE COLORS (Raw Scale)
   * ========================= */
  --color-primary-700: #3a0570; /* Dark */
  --color-primary-500: #640faf; /* Main Primary */
  --color-primary-400: #9a47fa;
  --color-primary-300: #c9acff;
  --color-primary-100: #ece6ff; /* Light */
  --color-primary-75: #f3ebfa;
  --color-primary-50: #faf4ff; /* BG */

  --color-gray-900: #111111;
  --color-gray-700: #4d4d4d;
  --color-gray-500: #666666;
  --color-gray-400: #929292;
  --color-gray-300: #cccccc;
  --color-gray-200: #e6e6e6;
  --color-gray-100: #f0f0f0;
  --color-gray-50: #fafafa;

  /** point color */
  /* --color-green-base: #43a3a0; */
  /* --color-yellow-base: #f26d00; */
  /* --color-blue-base: #00aeeb; */

  --color-green-base: #43a3a0;
  --color-green-light: #ecf6f6;
  --color-yellow-base: #f26d00;
  --color-yellow-light: #fef0e6;
  --color-red-base: #ec0040;
  --color-red-light: #fde6ec;
  --color-blue-base: #1e40af;
  --color-blue-light: #dbeafe;
  --color-pink-base: #db2777;
  --color-pink-light: #fce7f3;

  /** channel color */
  --color-brand-light: #f3ebfa;
  --color-brand-base: #640faf;
  --color-instagram-light: #ffe0f5;
  --color-instagram-base: #f26d00;
  --color-tiktok-light: #f2f5f8;
  --color-tiktok-base: #43a3a0;
  --color-youtube-light: #ffe0ea;
  --color-youtube-base: #ec0040;
  --color-ott-base: #00aee8;

  --color-gradient: linear-gradient(135deg, var(--color-primary-500), #7b6cd7);
  --color-grad100-from: #97dcff;
  --color-grad100-to: #f986ff;
  --color-grad200-from: #36bcff;
  --color-grad200-to: #f541ff;

  /* Z-INDEX */
  --z-dropdown: 1000; /* 셀렉트박스 드롭다운*/
  --z-sticky: 1020;
  --z-modal: 1100;
  --z-toast: 1200;
  --z-loading: 1300;
}

@theme {
  /* =========================
   * BASE COLORS
   * ========================= */
  --color-white: #ffffff;
  --color-black: #111111;

  /* =========================
   * SEMANTIC COLORS
   * ========================= */

  /* TEXT COLOR */
  --color-tx-body: var(--color-gray-700); /* 확정 */

  --color-tx-strong: var(--color-gray-900); /* Title */
  --color-tx-normal: var(--color-gray-700); /* Content */
  --color-tx-medium: var(--color-gray-600); /* Description */
  --color-tx-muted: var(--color-gray-500); /* Muted, Disabled */
  --color-tx-caption: var(--color-gray-400); /* Caption */
  --color-tx-subtle: var(--color-gray-300);

  --color-tx-primary-dark: var(--color-primary-700);
  --color-tx-primary: var(--color-primary-500);
  --color-tx-primary-bright: var(--color-primary-400);
  --color-tx-primary-soft: var(--color-primary-300);

  --color-tx-red: var(--color-red-base);
  --color-tx-yellow: var(--color-yellow-base);
  --color-tx-blue: var(--color-blue-base);
  --color-tx-green: var(--color-green-base);
  --color-tx-pink: var(--color-pink-base);

  --color-tx-youtube: var(--color-youtube-base);
  --color-tx-instagram: var(--color-instagram-base);
  --color-tx-tiktok: var(--color-tiktok-base);
  --color-tx-ott: var(--color-ott-base);

  --color-tx-black: var(--color-black);
  --color-tx-white: var(--color-white);

  --color-placeholder-default: var(--color-gray-300); /* Placeholder */

  /* BACKGROUND COLOR */
  --color-bg-default: var(--color-white);
  --color-bg-subtle: var(--color-gray-50); /* footer bg */
  --color-bg-muted: var(--color-gray-100); /* input, th bg*/
  --color-bg-element: var(--color-gray-200);
  --color-bg-strong: var(--color-gray-300);
  --color-bg-heavy: var(--color-gray-500);

  --color-bg-primary-dark: var(--color-primary-700);
  --color-bg-primary: var(--color-primary-500);
  --color-bg-primary-bright: var(--color-primary-400);
  --color-bg-primary-soft: var(--color-primary-300);
  --color-bg-primary-light: var(--color-primary-100);
  --color-bg-primary-surface: var(--color-primary-75);
  --color-bg-primary-subtle: var(--color-primary-50);

  --color-bg-red-strong: var(--color-red-base);
  --color-bg-red: var(--color-red-light);
  --color-bg-yellow-strong: var(--color-yellow-base);
  --color-bg-yellow: var(--color-yellow-light);
  --color-bg-blue-strong: var(--color-blue-base);
  --color-bg-blue: var(--color-blue-light);
  --color-bg-green-strong: var(--color-green-base);
  --color-bg-green: var(--color-green-light);
  --color-bg-pink: var(--color-pink-light);
  --color-bg-black: var(--color-black);
  --color-bg-white: var(--color-white);

  --background-image-primary-gradient: var(--color-gradient);

  /* BORDER COLOR */
  --color-bd-default: var(--color-gray-200); /* 기본 보더 */
  --color-bd-subtle: var(--color-gray-100); /* 연한 보더 */
  --color-bd-element: var(--color-gray-700);
  --color-bd-normal: var(--color-gray-300);

  --color-bd-primary-dark: var(--color-primary-700);
  --color-bd-primary: var(--color-primary-500);
  --color-bd-primary-bright: var(--color-primary-400);
  --color-bd-primary-soft: var(--color-primary-300);
  --color-bd-primary-light: var(--color-primary-100);
  --color-bd-primary-subtle: var(--color-primary-50);

  --color-bd-red: var(--color-red-base);
  --color-bd-blue: var(--color-blue-base);
  --color-bd-green: var(--color-green-base);
  --color-bd-yellow: var(--color-yellow-base);

  --color-bd-youtube: var(--color-youtube-base);
  --color-bd-instagram: var(--color-instagram-base);
  --color-bd-tiktok: var(--color-tiktok-base);
  --color-bd-ott: var(--color-ott-base);

  --color-bd-black: var(--color-black);

  /* =========================
   * CHANNEL COLOR
   * ========================= */
  --color-bg-brand: var(--color-brand-base);
  --color-bg-instagram: var(--color-instagram-base);
  --color-bg-instagram-light: var(--color-instagram-light);
  --color-bg-tiktok: var(--color-tiktok-base);
  --color-bg-tiktok-light: var(--color-tiktok-light);
  --color-bg-youtube: var(--color-youtube-base);
  --color-bg-youtube-light: var(--color-youtube-light);
  --color-bg-ott: var(--color-ott-base);
  --color-bg-ott-light: var(--color-ott-light);

  /* =========================
   * BROADCAST TYPE COLOR 
   * ========================= */
  --color-bg-tv: var(--color-red-base); /* TV (red 강조) */
  --color-bg-tvplus: var(--color-yellow-base); /* TV+ (yellow 강조) */
  --color-bg-mlc: var(--color-bg-primary); /* MLC (purple 기본) */

  /* =========================
   * TYPOGRAPHY
   * ========================= */
  /* FONT FAMILY */
  --font-base:
    var(--font-pretendard), ui-sans-serif, -apple-system, "Malgun Gothic",
    sans-serif;

  /* FONT SIZE */
  --text-11: 11px;
  --text-13: 13px;
  --text-15: 15px;
  --text-17: 17px;
  --text-22: 22px;
  --text-26: 26px;

  /* line-height */
  --leading-tight: 1.2;
  --leading-base: 1.5;
  --leading-body: 1.7;

  /* LETTER SPACING */
  --tracking-tight: -0.01em;
  --tracking-normal: 0;
  --tracking-wide: 0.02em;

  /* =========================
   * LAYOUT & SYSTEM
   * ========================= */

  /* BREAKPOINT 
  브레이크포인트 1200 (컨텐츠가 많아 1024에서 브레이크포인트 분기할경우 레이아웃이 깨지는 경우 사용
  */
  --breakpoint-laptop: 1200px;

  /* SPACING */
  --spacing-17: 17px;
  --spacing-18: 18px;
  --spacing-22: 22px;
  --spacing-26: 26px;

  /* RADIUS : 필요 사이즈 존재시 등록 */
  /* --radius-xs: 2px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px; */

  /* SHADOW */
  --shadow-base: 0 0 0 3px rgba(100, 15, 175, 0.18);
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-dropdown: 0 4px 12px rgba(0, 0, 0, 0.12);
  --shadow-modal: 0 8px 24px rgba(0, 0, 0, 0.16);
  --shadow-primary-float: 0 8px 24px rgba(100, 15, 175, 0.18);

  /* tailwind.config.ts(zIndex)에서 사용하는 별칭 */
  --z-index-dropdown: var(--z-dropdown);
  --z-index-sticky: var(--z-sticky);
  --z-index-modal: var(--z-modal);
  --z-index-toast: var(--z-toast);
  --z-index-loading: var(--z-loading);

  /* OPACITY */
  --opacity-disabled: 0.4;
  --opacity-overlay: 0.6;

  /* MOTION */
  --duration-fast: 150ms;
  --duration-base: 250ms;
  --duration-slow: 400ms;
  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);

  /* 그라디언트 컬러  */
  --gradient-100: linear-gradient(
    95deg,
    var(--color-grad100-from) 13%,
    var(--color-grad100-to) 137%
  );
  --gradient-200: linear-gradient(
    93deg,
    var(--color-grad200-from) 0.85%,
    var(--color-grad200-to) 106%
  );
  /* 타임라인 gradient 트랙: 안쪽 grad100 채움 + 테두리 영역에 --gradient-200 */
  --gradient-track-fill-and-border:
    linear-gradient(
        to right,
        var(--color-grad100-from),
        var(--color-grad100-to)
      )
      padding-box,
    var(--gradient-200) border-box;
}


@layer base {
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--color-gray-300) transparent;
  }

  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }

  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background-color: var(--color-gray-300);
    border-radius: 2px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background-color: var(--color-gray-400);
  }
  html,
  body {
    height: 100%;
    color: var(--color-tx-body);
    font-family: var(--font-pretendard);
    line-height: var(--leading-body);
    -webkit-font-smoothing: antialiased; /** webkit 브라우저 폰트렌더링 오류 방지 */
    -moz-osx-font-smoothing: grayscale; /**  mac Firefox 폰트렌더링 오류 방지지*/
  }
  body {
    overflow: hidden;
    font-size: var(--text-13);
  }

  i,
  em,
  address {
    font-style: normal;
  }
  button {
    cursor: pointer;
    &:disabled {
      cursor: default;
    }
  }
  input,
  textarea {
    appearance: none;
    border-radius: 0;
    resize: none;
    &:focus,
    &:active {
      outline: none;
    }
  }
  /** 
      TODO
      기본 form요소 text color 가이드 나오면 text-fill-color 변경 필요.
    */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  input:-webkit-autofill:active,
  input:autofill,
  input:autofill:hover,
  input:autofill:focus,
  input:autofill:active {
    -webkit-text-fill-color: #101010;
    transition: background-color 5000s ease-in-out 0s;
  }

  /** TODO: 디자인 가이드 확정 후 placeholder 색상 변경 필요 */
  ::placeholder {
    opacity: 1;
    color: var(--color-text-muted);
  }

  button,
  a,
  select,
  [tabindex]:not([tabindex="-1"]) {
    &:focus:not(:focus-visible) {
      outline: none;
    }
    &:focus-visible {
      outline: none;
      border-color: var(--color-bd-primary);
      box-shadow: var(--shadow-base);
    }
  }

  @media (prefers-reduced-motion: no-preference) {
    html {
      scroll-behavior: smooth;
    }
  }
}

/**
 * Component Styles
 * Tailwind의 components layer - 재사용 가능한 컴포넌트 스타일을 정의합니다.
 * 
 * 서버/클라이언트: ✅ 둘 다 사용 가능
 * 용도: 자주 사용되는 UI 패턴을 클래스로 정의
 */

@layer components {
  /* 
    구분선이 있는 리스트 아이템 
    @example
    [예시1] list-divider before:bg-bg-subtle before:w-[7px] before:h-[16px] before:left-[-12px]
    [예시2] list-divider before:w-0.5 before:h-0.5 before:rounded-sm before:-left-1.5
    */
  .list-divider {
    @apply relative flex items-center;

    /* 첫 번째 자식이 아닐 때만 before 생성 */
    &::before {
      content: "";
      @apply absolute top-1/2 left-[-8px] -translate-y-1/2;
      @apply h-[12px] w-px;
      @apply bg-bg-primary;
    }
    &:first-child:before {
      display: none;
    }
  }
  /* block에 | 자 모양의 구분선 */
  .group-divider {
    @apply after:bg-bg-element flex items-center gap-1 after:ml-2 after:h-4 after:w-px after:content-[''];
  }
  /**
  라벨을 가지고있는 컴포넌트 공통으로 감싸는 div의 스타일.
*/
  .comp-container {
    @apply inline-flex w-full shrink-0 flex-col gap-1;
  }

  .round-count {
    @apply text-11 inline-flex h-4 min-w-4 items-center justify-center gap-1 rounded-full px-1 leading-17 font-bold;
  }

  /*
   서브페이지 공통 스타일
  */
  .sub-page-container {
    @apply bg-bg-subtle flex h-full min-h-0 flex-1 flex-col pb-20;
  }
  .sub-page-padding {
    @apply px-10 pt-6;
  }

  .filter-bar {
    @apply border-bd-default bg-bg-white flex flex-col rounded-[2px] border py-1;
    --filter-label-width: 48px;
  }
  .filter-inner {
    @apply border-bd-subtle flex w-full gap-2 border-t px-5 py-2.5;

    &:first-child {
      @apply border-t-0;
    }

    .comp-container {
      @apply flex-row items-center gap-2;

      & > label,
      & > strong {
        width: var(--filter-label-width);
        @apply shrink-0 text-left;
      }
    }
  }
  .dimmed {
    @apply fixed inset-0 flex items-center justify-center bg-black/50;
    /* backdrop-filter: blur(2px); 사파리 렌더링 이슈(상하좌우 복제되어 나옴)로 인해 삭제 */
  }
  .card {
    @apply border-bd-default bg-bg-white rounded-md border;
  }
  .word-highlighter {
    @apply inline-block w-fit self-start bg-[linear-gradient(to_top,var(--color-bg-primary-light)_42%,transparent_42%)] box-decoration-clone bg-[length:100%_22px] bg-bottom bg-no-repeat;
  }
}

@layer utilities {
  /* ============================================
   * Text Utilities
   * ============================================ */

  /* 그라데이션 텍스트 */
  .text-gradient {
    @apply from-primary-400 bg-gradient-to-r to-pink-500 bg-clip-text text-transparent;
  }

  /* 2줄 이상 말줄임  */
  .text-ellipse-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /** 스크롤 넓이 확보 : 스크롤바가 없어도 스크롤바 자리를 미리 확보함  */
  .gutter-stable {
    scrollbar-gutter: stable;
  }
  /* ============================================
   * Animation Utilities
   * ============================================ */
  .fx-fade-up {
    animation: fadeUp 0.6s var(--ease-standard) forwards;
  }

  .fx-slide-in-up {
    animation: slideInUp 0.7s var(--ease-standard) both;
  }

  .loading-spinner-dot-row {
    --loading-spinner-dot-period: 1.2s;
    --loading-spinner-dot-d-lg: var(
      --loading-spinner-dot-max,
      var(--loading-spinner-dot-width, 8px)
    );
    --loading-spinner-dot-d-sm: var(--loading-spinner-dot-min, 0px);
    --loading-spinner-dot-scale-sm: max(
      0.001,
      calc(var(--loading-spinner-dot-d-sm) / var(--loading-spinner-dot-d-lg))
    );

    display: flex;
    align-items: center;
    justify-content: space-between;
    width: var(
      --loading-spinner-total-width,
      calc(3 * var(--loading-spinner-dot-slot, 8px))
    );
    box-sizing: border-box;
  }

  .loading-spinner-dot-i {
    display: flex;
    box-sizing: border-box;
    width: var(--loading-spinner-dot-slot, 8px);
    height: var(--loading-spinner-dot-slot, 8px);
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
  }

  .loading-spinner-dot-i::before {
    content: "";
    display: block;
    width: var(--loading-spinner-dot-d-lg);
    height: var(--loading-spinner-dot-d-lg);
    border-radius: 9999px;
    background-color: var(--color-bg-primary-bright);
    transform-origin: center center;
    animation-name: loading-spinner-dot-wave;
    animation-duration: var(--loading-spinner-dot-period, 1.2s);
    animation-timing-function: cubic-bezier(0.42, 0, 0.58, 1);
    animation-iteration-count: infinite;
  }

  .loading-spinner-dot-row > .loading-spinner-dot-i:nth-child(1)::before {
    animation-delay: 0s;
  }

  .loading-spinner-dot-row > .loading-spinner-dot-i:nth-child(2)::before {
    animation-delay: calc(-1 * var(--loading-spinner-dot-period, 1.2s) / 3);
  }

  .loading-spinner-dot-row > .loading-spinner-dot-i:nth-child(3)::before {
    animation-delay: calc(-2 * var(--loading-spinner-dot-period, 1.2s) / 3);
  }

  /* ============================================
   * Glass Morphism
   * ============================================ */
  .glass-light {
    @apply border border-white/20 bg-white/10 backdrop-blur-lg;
  }

  /* ============================================
   * Interaction & Layout
   * ============================================ */
  /* 스크롤바 숨기기*/
  .scrollbar-hide {
    -ms-overflow-style: none;
    scrollbar-width: none;
    &::-webkit-scrollbar {
      display: none;
    }
  }

  /* Primary Scrollbar */

const tryParseTimeToSeconds = time => {
  const parts = String(time).trim().split(':')
  if (parts.length !== 3) return null
  const hh = Number(parts[0]), mm = Number(parts[1]), sPart = parts[2].replace(',', '.')
  if (!/^\d+(\.\d{1,3})?$/.test(sPart)) return null
  const s = Number(sPart)
  if ([hh, mm, s].some(n => Number.isNaN(n))) return null
  return hh * 3600 + mm * 60 + s
}
const parseTimeToSeconds = time => tryParseTimeToSeconds(time) ?? 0
const formatVideoTime = (seconds, withMs = false) => {
  const safe = Number.isFinite(seconds) && seconds > 0 ? seconds : 0
  const totalMs = Math.floor(safe * 1000)
  const hh = String(Math.floor(totalMs / 3600000)).padStart(2, '0')
  const mm = String(Math.floor((totalMs % 3600000) / 60000)).padStart(2, '0')
  const ss = String(Math.floor((totalMs % 60000) / 1000)).padStart(2, '0')
  const t = [hh, mm, ss].join(':')
  return withMs ? `${t}.${String(totalMs % 1000).padStart(3, '0')}` : t
}
const formatTimelineLabel = seconds => { const f = formatVideoTime(seconds); return seconds < 3600 ? f.slice(3) : f }
const formatNumber = n => (n == null || n === '' || Number.isNaN(Number(n)) ? '-' : Number(n).toLocaleString('ko-KR'))
const pad2 = n => String(n).padStart(2, '0')
// type: 'datetime' | 'date' | 'time' | 'dot' | 'dotFull' | '' (원본 timestampToString 과 같은 형식)
const formatDate = (input, type = '') => {
  const d = input instanceof Date ? input : new Date(input)
  if (Number.isNaN(d.getTime())) return '-'
  const date = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`
  const dot = date.replaceAll('-', '.')
  const time = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`
  return { datetime: `${date} ${time}`, date, time, dot, dotFull: `${dot} ${time}` }[type] ?? `${date} ${time}`
}

/* =====================================================================
 * 전역 상태 — zustand create((set, get) => …) 와 같은 모양
 *   const useFooStore = createStore((set, get) => ({ a: 1, inc: () => set(s => ({ a: s.a + 1 })) }))
 *   const a = useFooStore(s => s.a);  useFooStore.getState().inc()
 * ===================================================================== */
const createStore = init => {
  const subs = new Set()
  let state
  const get = () => state
  const set = partial => {
    const next = typeof partial === 'function' ? partial(state) : partial
    state = { ...state, ...next }
    subs.forEach(f => f())
  }
  state = typeof init === 'function' ? init(set, get) : init
  const useStore = (selector = s => s) => {
    const [, force] = useReducer(x => x + 1, 0)
    useLayoutEffect(() => { subs.add(force); return () => subs.delete(force) }, [])
    return selector(state)
  }
  useStore.getState = get
  useStore.setState = set
  useStore.subscribe = f => (subs.add(f), () => subs.delete(f))
  return useStore
}

 * ===================================================================== */
const DEFAULT_ROUTE = '/hl/vod'
const getPath = () => decodeURI(location.hash.replace(/^#/, '')) || DEFAULT_ROUTE
const toHref = p => (typeof p === 'string' && p.startsWith('/') ? `#${p}` : p)
const navigate = p => { location.hash = p }
const useRouter = () => ({ push: navigate, replace: p => location.replace(`#${p}`), back: () => history.back() })
const useRoute = () => {
  const [path, setPath] = useState(getPath())
  useEffect(() => {
    const onHash = () => setPath(getPath())
    addEventListener('hashchange', onHash)
    return () => removeEventListener('hashchange', onHash)
  }, [])
  return path
}
const Link = ({ href, children, ...props }) => html`<a href=${toHref(href)} ...${props}>${children}</a>`

/* =====================================================================
 * Portal — react-dom createPortal 대용 (body 아래 별도 루트에 그린다)
 * ===================================================================== */
const Portal = ({ children }) => {
  const el = useMemo(() => document.createElement('div'), [])
  useLayoutEffect(() => { document.body.appendChild(el); return () => { render(null, el); el.remove() } }, [el])
  useLayoutEffect(() => { render(children, el) })
  return null
}

function Button({ variant = 'outline', size = 'md', href, target = '_self', underline = false, leftIcon: LeftIcon, rightIcon: RightIcon, iconSize, isRotate = false, className, children, type = 'button', ...props }) {

function Input({ id, variant = 'default', type = 'text', size = 'md', label, required = false, placeholder = '', value: valueProp, defaultValue, disabled = false,

    const input = internalRef.current

const useOutsideClose = (open, refs, onClose) => {
  useEffect(() => {
    if (!open) return
    const onDown = e => { if (refs.some(r => r.current?.contains(e.target))) return; onClose() }
    document.addEventListener('pointerdown', onDown)
    return () => document.removeEventListener('pointerdown', onDown)
  }, [open])
}

function Selectbox({ size = 'md', label, required = false, placeholder = '선택해주세요.', value, disabled = false, modified = false, error = false, errorText, helperText, options, className, innerClassName, onChange }) {
  const [open, setOpen] = useState(false)

  const dropdownRef = useRef(null)
  const maxH = size === 'sm' ? 140 : 160
  const place = () => {
    const r = rootRef.current?.getBoundingClientRect()
    if (!r) return
    const up = innerHeight - r.bottom < maxH && r.top > innerHeight - r.bottom

  useOutsideClose(open, [rootRef, dropdownRef], () => setOpen(false))

  const surface = cn('border-bd-primary border bg-bg-white shadow-base z-[1150]', pos?.placement === 'up' ? 'rounded-t-xs border-b-0' : 'rounded-b-xs border-t-0')
  return html`<div class=${cn('comp-container', className)}>

    <div ref=${rootRef} class=${cn('relative w-full rounded-t-xs transition-shadow duration-200', open && 'shadow-base', innerClassName)}>

        <span class=${cn('text-tx-strong flex min-w-0 flex-1 items-center gap-1', !value && 'text-tx-muted')}>

        </span>
        <${I.ChevronDown} size=${16} className="text-tx-strong shrink-0" />
      </button>
      ${open && pos && html`<${Portal}>
        <div ref=${dropdownRef} class=${surface} style=${{ position: 'fixed', zIndex: 1150, left: `${pos.left}px`, width: `${pos.width}px`, ...(pos.placement === 'up' ? { bottom: `${pos.bottom}px` } : { top: `${pos.top}px` }) }}>
          <ul class=${cn('scrollbar-primary overflow-y-auto', size === 'sm' ? 'max-h-[140px]' : 'max-h-[160px]')}>

                <span class="flex min-w-0 flex-1 items-center gap-1">${option.prefix}<span class="truncate">${option.label}</span></span>
                ${option.value === value && html`<${I.Check} size=${14} className="text-tx-primary-dark shrink-0" />`}
              </button>
            </li>`)}
          </ul>
        </div>
      <//>`}
    </div>
    ${helperText && html`<${HelperText} variant="default" text=${helperText} />`}
    ${error && errorText && html`<${HelperText} variant="error" text=${errorText} />`}
  </div>`
}

function Tabs({ variant = 'rounded', tabs, value, defaultTab, className, headerClassName, buttonWrapperClassName, buttonClassName, panelClassName, onChange, scrollable = false, scrollClassName, rightSlot, rightSlotClassName, sticky = false, stickyClassName }) {

// Table — columns: [{ key, header, renderHeader?, render?(row), align, headerAlign, cellAlign }]
const TableExpandContext = createContext(null)
const useTableRowExpand = () => useContext(TableExpandContext)
const ROW_CLICK_IGNORE = "button, input, select, textarea, a, label, [role='button'], [role='checkbox'], [role='radio'], [role='combobox'], [role='listbox']"
function Table({ columns, data, colGroup, headerType = 'column', isScroll = false, isScrollX = false, className, isRowHover = false, getRowClassName, onRowClick,
  renderExpandedRow, expandedRowClassName, emptyState, emptyStateClassName, onScroll, footer, isLoading, loadingState }) {

  const useRowHeaderInBody = headerType === 'row' || headerType === 'both'
  const [expanded, setExpanded] = useState(() => new Set())
  const toggleRow = (i, has) => has && setExpanded(prev => { const n = new Set(prev); n.has(i) ? n.delete(i) : n.add(i); return n })
  const rowCls = (row, i) => cn('bg-bg-white text-sm transition-colors', isRowHover && 'hover:bg-bg-primary-subtle', onRowClick && 'hover:bg-bg-primary-subtle cursor-pointer', getRowClassName?.(row, i))
  const onRow = (row, i) => e => { if (e.target.closest(ROW_CLICK_IGNORE)) return; onRowClick?.(row, i) }
  const align = a => cn(a === 'left' && 'text-left', a === 'center' && 'text-center', a === 'right' && 'text-right')
  const thRow = col => cn(' bg-bg-subtle border-t border-bd-default text-xs text-tx-strong px-2.5 py-2 leading-tight font-bold shadow-[inset_-1px_0_0_0_var(--color-bd-default)]', align(col.cellAlign ?? col.headerAlign ?? col.align))
  const td = col => cn('text-tx-muted px-2.5 py-2 text-xs text-tx-normal break-keep border-b border-bd-subtle', useRowHeaderInBody && 'border-t border-bd-default', align(col.cellAlign ?? col.align))
  const cells = (row, ri) => columns.map((col, ci) => {
    const content = col.render ? col.render(row, ri) : String(row[col.key] ?? '')
    if (useRowHeaderInBody && ci === 0) return html`<th key=${col.key} scope="row" class=${cn(thRow(col), ri === 0 && 'border-t-0')}>${content}</th>`
    return html`<td key=${col.key} class=${cn(td(col), ri === 0 && 'border-t-0', ri === data.length - 1 && 'border-b-0')}>${content}</td>`
  })
  const rows = data.map((row, i) => {
    if (!renderExpandedRow) return html`<tr key=${i} onClick=${onRow(row, i)} class=${rowCls(row, i)}>${cells(row, i)}</tr>`
    const detail = renderExpandedRow(row, i)
    const has = detail !== null && detail !== undefined && detail !== false
    const isExpanded = expanded.has(i)
    return html`<${TableExpandContext.Provider} key=${i} value=${{ isExpanded, toggleExpanded: () => toggleRow(i, has) }}>
      <tr onClick=${onRow(row, i)} class=${rowCls(row, i)}>${cells(row, i)}</tr>
      ${has && isExpanded ? html`<tr class=${cn('bg-bg-white', expandedRowClassName)}><td colSpan=${columns.length} class="text-tx-muted border-bd-default w-full max-w-0 min-w-0 overflow-hidden border-t px-3.5 py-3 text-xs"><div class="w-full max-w-full min-w-0 overflow-hidden">${detail}</div></td></tr>` : null}
    <//>`

    isScroll && isScrollX && 'scrollbar-start overflow-auto', isScroll && !isScrollX && 'scrollbar-start overflow-y-auto overflow-x-hidden',
    !isScroll && isScrollX && 'overflow-x-auto overflow-y-hidden', !isScroll && !isScrollX && 'overflow-hidden',
    'border-b-bd-default min-w-0 border-b', hideHead && 'border-bd-default border-t border-b [--scrollbar-start:0px]', className)}>
    <table class=${cn('border-collapse', isScrollX ? 'w-full min-w-max table-fixed' : 'w-full table-fixed', data.length === 0 && 'h-full')}>
      ${colGroup && html`<colgroup>${colGroup.map(c => html`<col style=${{ width: c.width || 'auto', minWidth: c.minWidth || (c.width ? undefined : 0) }} />`)}</colgroup>`}
      ${!hideHead && html`<thead><tr>${columns.map(col => html`
        <th key=${col.key} class=${cn('text-tx-strong bg-bg-subtle border-bd-default px-2.5 py-1 text-xs leading-tight font-bold shadow-[inset_0_1px_0_0_var(--color-bd-default),inset_0_-1px_0_0_var(--color-bd-default)]', isScroll && 'sticky top-0 z-10')}>
          <span class=${cn('flex min-h-8 items-center', (col.headerAlign ?? col.align) === 'left' && 'justify-start', (col.headerAlign ?? col.align) === 'center' && 'justify-center', (col.headerAlign ?? col.align) === 'right' && 'justify-end')}>
            ${col.renderHeader ? col.renderHeader() : col.header}</span>
        </th>`)}</tr></thead>`}
      <tbody>
        ${data.length === 0
          ? isLoading ? (loadingState ?? '로딩 중...')
            : html`<tr><td colSpan=${Math.max(columns.length, 1)} class=${cn('text-tx-caption px-2.5 py-6 text-center text-xs', emptyStateClassName)}>${emptyState ?? '데이터가 없습니다.'}</td></tr>`
          : rows}

    ${footer}
  </div>`
}

function ImageBox({ size = 'md', src, alt, className, wrapperClassName, isLoading = false }) {
  const [failed, setFailed] = useState(false)
  useEffect(() => setFailed(false), [src])
  const ok = typeof src === 'string' && src.trim().length > 1
  return html`<span class=${cn('relative block min-h-0 min-w-0 overflow-hidden', wrapperClassName ?? 'size-full')}>
    ${isLoading && html`<${Skeleton} className="absolute inset-0 h-full w-full rounded-none" />`}
    ${!isLoading && ok && !failed && html`<img src=${src} alt=${alt} loading="lazy" class=${cn('absolute inset-0 h-full w-full object-contain', className)} onError=${() => setFailed(true)} />`}
    ${!isLoading && (!ok || failed) && html`<span role="alert" class=${cn('bg-bg-muted absolute inset-0 z-10 flex flex-col items-center justify-center text-center', size === 'sm' ? 'px-2' : 'px-8')}>
      <span class="opacity-20 grayscale"><${BrandMark} size=${size === 'sm' ? 20 : 30} /></span></span>`}
  </span>`
}

// Tooltip — 트리거를 누르면 위(또는 아래)에 말풍선
function Tooltip({ contentAlign = 'center', placement = 'top', content, children }) {
  const [open, setOpen] = useState(false)
  const [coords, setCoords] = useState({ top: 0, left: 0 })
  const ref = useRef(null), tipRef = useRef(null)
  useOutsideClose(open, [ref, tipRef], () => setOpen(false))
  useLayoutEffect(() => {
    if (!open || !ref.current || !tipRef.current) return
    const r = ref.current.getBoundingClientRect(), t = tipRef.current.getBoundingClientRect()
    const left = Math.min(Math.max(r.left + r.width / 2 - t.width / 2, 20), innerWidth - t.width - 20)
    const top = placement === 'top' && r.top - t.height - 8 > 0 ? r.top - t.height - 8 : r.bottom + 8
    setCoords({ top, left })
  }, [open])
  return html`
    <div ref=${ref} class="relative inline-flex align-top" onClick=${() => setOpen(o => !o)}><div class="cursor-pointer leading-0">${children}</div></div>
    ${open && html`<${Portal}><div ref=${tipRef} style=${{ top: `${coords.top}px`, left: `${coords.left}px` }}
      class=${cn('text-tx-white text-11 bg-bg-black pointer-events-auto fixed z-[1200] max-w-[min(22rem,calc(100vw-24px))] rounded-md px-2.5 py-1.5 break-keep whitespace-normal shadow-md', contentAlign === 'center' && 'text-center', contentAlign === 'left' && 'text-left', contentAlign === 'right' && 'text-right')}>${content}</div><//>`}`
}

// DateTimepicker — 원본은 MUI 달력. 미리보기에서는 브라우저 기본 날짜 입력으로 대신한다.
// range: startDate/endDate/onRangeChange([start,end]) · 단일: date/onChange(date) · time: 시각까지
function DateTimepicker({ label, range = false, time = false, startDate, endDate, onRangeChange, date, onChange, placeholder, disabled = false, required = false, error = false, errorText, className, size = 'md' }) {
  const type = time ? 'datetime-local' : 'date'
  const toVal = d => (d ? (time ? `${formatDate(d, 'date')}T${pad2(d.getHours())}:${pad2(d.getMinutes())}` : formatDate(d, 'date')) : '')
  const fromVal = v => (v ? new Date(time ? v : `${v}T00:00:00`) : null)
  const field = (val, onPick, ph) => html`<input type=${type} value=${toVal(val)} disabled=${disabled} placeholder=${ph}
    onInput=${e => onPick(fromVal(e.target.value))} class="text-tx-black h-full min-w-0 flex-1 bg-transparent text-13 [&::-webkit-calendar-picker-indicator]:opacity-60" />`
  return html`<div class=${cn('comp-container', className)}>
    ${label && html`<${FormLabel} title=${label} required=${required} />`}
    <div class=${cn(inputVariants({ size, disabled }), error && 'border-bd-red focus-within:border-bd-red')}>
      <div class=${cn(inputContentVariants(), 'text-tx-caption')}>
        <${I.Calendar} size=${16} className="shrink-0" />
        ${range ? html`${field(startDate, d => onRangeChange?.([d, endDate ?? null]), placeholder)}<span class="text-tx-caption">~</span>${field(endDate, d => onRangeChange?.([startDate ?? null, d]), placeholder)}`
          : field(date, d => onChange?.(d), placeholder)}
      </div>
    </div>
    ${error && errorText && html`<${HelperText} variant="error" text=${errorText} />`}
  </div>`
}

// Video — 원본은 Shaka Player. preview(호버 시 10초 미리보기) / player(눌러서 재생) 두 모드만 흉내 낸다.
function Video({ src, poster, isLoading = false, autoPlay = false, className, timeText, showTimeText = true, mode = 'player', videoRef, disableHoverPreview = false,
  overlay, overlayClassName, showVolumeControl = true, defaultMuted = false, showSeekBar = true, onClick, onPreviewPeekStart, onPreviewPeekEnd, onTimeUpdate, onLoadedMetadata }) {
  const localRef = useRef(null)
  const [loaded, setLoaded] = useState(autoPlay)
  const [showThumb, setShowThumb] = useState(!autoPlay)
  const [paused, setPaused] = useState(true)
  const [muted, setMuted] = useState(mode === 'preview' || defaultMuted)
  const [flash, setFlash] = useState(false)
  const [progress, setProgress] = useState(0)
  const peekTimer = useRef(null)
  const setVideo = node => { localRef.current = node; if (typeof videoRef === 'function') videoRef(node); else if (videoRef) videoRef.current = node }
  const playable = typeof src === 'string' && src.length > 0
  const flashIcon = () => { setFlash(true); setTimeout(() => setFlash(false), 600) }
  const play = () => { const v = localRef.current; if (!v) return; setLoaded(true); setShowThumb(false); v.play().then(flashIcon).catch(() => {}) }
  useEffect(() => { if (autoPlay && playable) { const v = localRef.current; if (v) { v.muted = true; setMuted(true); v.play().catch(() => {}) } } }, [src])
  const onEnter = () => {
    if (mode !== 'preview' || !playable || disableHoverPreview) return
    const v = localRef.current; if (!v) return
    setLoaded(true); v.muted = true; v.currentTime = 0
    v.play().then(() => { setShowThumb(false); onPreviewPeekStart?.() }).catch(() => {})
    clearTimeout(peekTimer.current)
    peekTimer.current = setTimeout(onLeave, 10000)
  }
  const onLeave = () => {
    if (mode !== 'preview') return
    clearTimeout(peekTimer.current)
    const v = localRef.current; if (v) v.pause()
    setShowThumb(true); onPreviewPeekEnd?.()
  }
  const onPlayerUp = e => {
    if (mode !== 'player' || !playable || showThumb && poster) return
    if (e.target.closest('button, input, [data-seek]')) return
    const v = localRef.current; if (!v) return
    if (!v.paused) { v.pause(); flashIcon() } else v.play().then(flashIcon).catch(() => {})
  }
  const seek = e => {
    const v = localRef.current; if (!v?.duration) return
    const r = e.currentTarget.getBoundingClientRect()
    v.currentTime = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1) * v.duration
  }
  return html`<div onContextMenu=${e => e.preventDefault()} onMouseEnter=${onEnter} onMouseLeave=${onLeave} onClick=${mode === 'preview' ? onClick : undefined} onPointerUp=${onPlayerUp}
    class=${cn('relative aspect-9/16 w-full overflow-hidden rounded-md', mode === 'preview' && playable && !disableHoverPreview && 'cursor-pointer', overlay != null && 'group', className)}>
    <video ref=${setVideo} src=${playable ? src : undefined} playsInline muted=${muted} preload=${loaded ? 'metadata' : 'none'}
      onPlay=${() => { setPaused(false); setShowThumb(false) }} onPause=${() => setPaused(true)}
      onTimeUpdate=${e => { const v = e.currentTarget; setProgress(v.duration ? v.currentTime / v.duration : 0); onTimeUpdate?.(e) }} onLoadedMetadata=${onLoadedMetadata}
      class=${cn('pointer-events-auto block h-full w-full overflow-hidden rounded-md object-contain', !showThumb && 'bg-bg-black')}></video>
    ${poster && showThumb && html`<button type="button" onClick=${e => { if (mode === 'player' && playable) { e.stopPropagation(); play() } }}
      class=${cn('absolute inset-0 z-10 h-full w-full', mode === 'player' && playable && 'cursor-pointer')} aria-label=${mode === 'player' ? '동영상 재생' : undefined}>
      <${ImageBox} src=${poster} alt="thumbnail" isLoading=${isLoading} className="bg-bg-black object-cover" />
      ${mode === 'player' && playable && html`<i class="absolute inset-0 flex items-center justify-center"><img src=${ASSETS.btnPlay} width="52" height="52" alt="재생" /></i>`}
    </button>`}
    ${mode === 'player' && loaded && (!poster || !showThumb) && (flash || paused) && html`<div class="pointer-events-none absolute inset-0 z-25 flex items-center justify-center" aria-hidden="true">
      <img src=${flash && !paused ? ASSETS.btnPause : ASSETS.btnPlay} width="52" height="52" alt="" /></div>`}
    ${mode === 'player' && !showThumb && showVolumeControl && html`<button type="button" onClick=${e => { e.stopPropagation(); const v = localRef.current; if (v) { v.muted = !v.muted; setMuted(v.muted) } }}
      class="bg-bg-black/30 text-tx-white pointer-events-auto absolute top-2.5 left-2.5 z-20 flex h-6 w-6 items-center justify-center rounded-full">
      ${muted ? html`<${I.VolumeX} size=${16} />` : html`<${I.Volume2} size=${16} />`}</button>`}
    ${mode === 'player' && showSeekBar && playable && !showThumb && html`<div data-seek onPointerDown=${seek} class="absolute inset-x-0 bottom-0 z-20 h-3 cursor-pointer">
      <div class="absolute inset-x-0 bottom-1 h-0.5 bg-white/40"><div class="bg-bg-primary-bright h-full" style=${{ width: `${progress * 100}%` }}></div>
      <span class="bg-bg-primary-bright absolute top-1/2 h-3 w-3 -translate-x-1/2 -translate-y-1/2 rounded-full" style=${{ left: `${progress * 100}%` }}></span></div></div>`}
    ${timeText != null && showTimeText ? html`<div class=${cn(videoPlayTimeVariants())}>${formatVideoTime(timeText).replace(/^00:/, '')}</div>` : null}
    ${overlay != null && html`<div class=${cn('pointer-events-none absolute inset-0 z-11', overlayClassName)}>${overlay}</div>`}
  </div>`
}

/* ---------- Modal · Alert · Toast ---------- */
const useBodyLock = isOpen => useEffect(() => { if (isOpen) document.body.style.overflow = 'hidden'; return () => { document.body.style.overflow = 'unset' } }, [isOpen])

const ModalButtons = ({ list }) => list.map(b => html`<${Button} key=${b.label} variant=${b.variant} size="sm" disabled=${b.disabled} onClick=${b.onClick} className=${b.className}>${b.label}<//>`)
// buttons: [{label, variant, onClick, disabled}] 또는 [[왼쪽들], [오른쪽들]]
function Modal({ isOpen, size = 'sm', title, children, contentPadding = true, contentClassName, className, panelClassName, customPanelClassName, buttons, renderCloseButton, hideCloseButton = false, closeOnBackdropClick = true, onClose }) {
  useBodyLock(isOpen)
  useEffect(() => {
    if (!isOpen) return
    const onKey = e => e.key === 'Escape' && onClose?.()
    document.addEventListener('keydown', onKey)
    return () => document.removeEventListener('keydown', onKey)
  }, [isOpen])
  if (!isOpen) return null
  const split = buttons && Array.isArray(buttons[0])
  const inner = html`
    ${title && html`<div class=${cn('flex h-14.5 min-w-0 shrink-0 items-center justify-between pl-3.5', renderCloseButton || hideCloseButton ? 'pr-3.5' : 'pr-15')}>
      <h2 class="text-tx-strong min-w-0 flex-1 truncate text-base font-bold">${title}</h2></div>`}
    <div class=${cn('flex-1 overflow-y-auto', contentPadding && 'px-5.5 py-5', contentClassName)}>${children}</div>
    ${buttons && html`<div class=${cn('mt-auto flex items-center gap-2 px-5.5 pt-3.5', split ? 'justify-between' : 'justify-end')}>
      ${split ? html`<div class="flex items-center gap-2"><${ModalButtons} list=${buttons[0]} /></div><div class="flex items-center gap-2"><${ModalButtons} list=${buttons[1]} /></div>`
        : html`<${ModalButtons} list=${buttons} />`}</div>`}`
  return html`<${Portal}>
    <div class=${cn(modalWrapperVariants(), className)} onClick=${e => e.stopPropagation()}>
      <div class="dimmed" onClick=${() => closeOnBackdropClick && onClose?.()}></div>
      <div class=${modalCenterVariants()}>
        ${renderCloseButton ? html`<div class="flex max-h-full min-h-0 w-full max-w-full justify-center self-center">
            <div class=${cn('relative max-h-full min-h-0 w-max', size === 'custom' && customPanelClassName)}>
              <div class=${cn(modalPanelVariants({ size }), panelClassName)}>${inner}</div>${renderCloseButton(onClose)}</div></div>`
          : html`<div class=${cn(modalPanelVariants({ size }), size === 'custom' && customPanelClassName, panelClassName)}>
              ${inner}
              ${!hideCloseButton && html`<button type="button" aria-label="닫기" onClick=${() => onClose?.()} class="text-tx-caption hover:text-tx-normal absolute top-2.5 right-3.5 flex h-10 w-10 items-center justify-center transition-colors"><${I.X} size=${24} /></button>`}
            </div>`}
      </div>
    </div>
  <//>`
}

const ALERT_ICON = { info: I.CircleAlert, success: I.CircleCheckBig, warning: I.TriangleAlert, error: I.Ban }
const ALERT_COLOR = { info: 'blue', success: 'green', warning: 'yellow', error: 'red' }
function Alert({ variant = 'info', isOpen, title, description, contentClassName, className, buttons }) {
  useBodyLock(isOpen)
  if (!isOpen) return null
  return html`<${Portal}>
    <div class=${cn(modalWrapperVariants(), className)}>
      <div class="dimmed"></div>
      <div class=${modalCenterVariants()}>
        <div class=${cn(modalPanelVariants(), 'w-[300px] gap-2 p-5')}>
          <div class=${cn('flex items-center', description && 'flex-col')}>
            <${Icon} icon=${ALERT_ICON[variant]} size="md" color=${ALERT_COLOR[variant]} />
            <h2 class="text-tx-strong text-sm font-bold">${title}</h2>
          </div>
          <div class=${cn('text-tx-muted flex-1 overflow-y-auto text-center text-xs whitespace-pre-line', contentClassName)}>${description}</div>
          ${buttons && html`<div class=${cn('mt-auto flex items-center justify-end gap-2 pt-4', description && 'justify-center')}>
            ${buttons.map(b => html`<${Button} key=${b.label} variant=${b.variant} size="sm" onClick=${b.onClick} className=${cn(buttons.length === 1 && 'w-full')}>${b.label}<//>`)}</div>`}
        </div>

  <//>`
}
// 원본 hooks/useAlert 와 같은 모양: const { open, close, alertProps } = useAlert(); open({ variant, title, description, buttons })
const useAlert = () => {
  const [isOpen, setIsOpen] = useState(false)
  const [config, setConfig] = useState({ variant: 'info', title: '' })
  const open = useCallback(c => { setConfig(c); setIsOpen(true) }, [])
  const close = useCallback(() => setIsOpen(false), [])
  return { open, close, alertProps: { ...config, isOpen } }
}

const Toast = ({ color = 'gray', icon: IconComponent, title, description, onClose }) => {
  const ToastIcon = IconComponent ?? I.CircleAlert
  return html`<div class=${ToastVariants({ color })}>

    <div class="flex flex-1 flex-col"><strong class="text-13 text-tx-strong font-semibold">${title}</strong>${description && html`<p class="text-11 text-tx-muted">${description}</p>`}</div>
    <button type="button" aria-label="닫기" onClick=${onClose} class="text-tx-caption shrink-0"><${I.X} size=${20} /></button>
  </div>`
}
// 원본 ToastProvider 의 useToast 와 같은 모양: const { toast } = useToast(); toast({ color, title, description, duration })
const useToastStore = createStore({ items: [] })
let toastSeq = 0
const toast = ({ color, icon, title, description, duration = TOAST_DURATION.BASE }) =>
  useToastStore.setState(s => ({ items: [...s.items, { id: ++toastSeq, color, icon, title, description, duration }] }))
const useToast = () => ({ toast })
const ToastItem = ({ item }) => {
  const [visible, setVisible] = useState(false)
  const dismiss = () => { setVisible(false); setTimeout(() => useToastStore.setState(s => ({ items: s.items.filter(t => t.id !== item.id) })), 200) }
  useEffect(() => { const a = setTimeout(() => setVisible(true), 10), b = setTimeout(dismiss, item.duration); return () => { clearTimeout(a); clearTimeout(b) } }, [])
  return html`<div class="relative transition-all duration-200 ease-out" style=${{ opacity: visible ? 1 : 0, transform: visible ? 'translateX(0)' : 'translateX(24px)' }}>
    <${Toast} color=${item.color} icon=${item.icon} title=${item.title} description=${item.description} onClose=${dismiss} /></div>`
}
const ToastHost = () => {
  const items = useToastStore(s => s.items)
  return html`<div class="z-toast fixed right-6 bottom-6 flex w-80 flex-col gap-2.5">${items.map(it => html`<${ToastItem} key=${it.id} item=${it} />`)}</div>`
}

      /** 순서 변경 후 order/startTime/endTime 재계산 (삭제 데이터 제외) */
      reorderSceneList: orderedIds => set(s => {
        const map = new Map(s.selectedSceneList.map(i => [i.sceneId, i]))
        const list = orderedIds.map(id => map.get(id)).filter(Boolean).reduce((acc, scene) => {
          const start = acc.filter(i => i.order > 0).at(-1)?.endTime ?? 0
          const isDeleted = scene.order === -1
          const lastOrder = acc.filter(i => i.order > 0).at(-1)?.order || 0
          return [...acc, { ...scene, order: isDeleted ? -1 : lastOrder + 1, startTime: isDeleted ? 0 : start, endTime: isDeleted ? 0 : start + scene.duration }]
        }, [])
        return { selectedSceneList: list, selectedScene: list.find(i => i.sceneId === s.selectedScene?.sceneId) ?? s.selectedScene ?? null }
      }),
      patchSceneSubtitle: (sceneId, subtitleId, text) => set(s => {
        const target = s.selectedSceneList.find(i => i.sceneId === sceneId)
        if (!target) return s
        const patched = target.subtitleData.map(i => (i.subtitleId === subtitleId ? { ...i, text } : i))
        const isCaptionChanged = patched.some(i => i.text !== i.originText)
        const apply = scene => (scene.sceneId === sceneId ? { ...scene, subtitleData: patched, isCaptionChanged } : scene)
        return { selectedSceneList: s.selectedSceneList.map(apply), selectedScene: s.selectedScene ? apply(s.selectedScene) : null }
      }),
      deleteSceneSubtitles: sceneId => set(s => {
        const apply = scene => (scene.sceneId === sceneId ? { ...scene, subtitleData: scene.subtitleData.map(i => ({ ...i, text: '' })), isCaptionChanged: true } : scene)
        return { selectedSceneList: s.selectedSceneList.map(apply), selectedScene: s.selectedScene ? apply(s.selectedScene) : null }
      }),
      // highlightForm
      toggleOutroYn: () => set({ outroYn: get().outroYn === 'N' ? 'Y' : 'N' }),
      toggleCaptionYn: () => set({ captionYn: get().captionYn === 'Y' ? 'N' : 'Y' }),
      setIsGenerating: isGenerating => set({ isGenerating }),
      setIsLoading: isLoading => set({ isLoading }),
      patchBanner: partial => set(s => ({ banner: { ...s.banner, ...partial } })),
      patchCaption: partial => set(s => ({ caption: { ...s.caption, ...partial } })),
      setSavedSnapshot: savedSnapshot => set({ savedSnapshot }),
      // draftHistory
      fetchDraftList: async () => { const t = demoToken; await sleep(300); if (t === demoToken) set({ draftList: [...draftDb] }) },
      fetchDraftDetail: async compositionId => {
        const t = demoToken
        await sleep(700)
        if (t !== demoToken) return
        const d = draftDb.find(i => i.compositionId === compositionId)?.detail
        if (!d) throw new Error('임시 저장 이력을 찾을 수 없습니다.')
        get().resetSceneEdit(true)
        const crop0 = calcInitialCenterCrop(get().player.videoNaturalSize, d.aspectRatio)
        let acc = 0
        const selectedSceneList = d.clips.map((c, i) => {
          const duration = c.endTime - c.startTime, start = acc
          acc += duration
          return { ...DEFAULT_SCENE_ITEM, order: i + 1, sceneId: c.sceneId, sceneTitle: c.sceneTitle, sceneReason: c.sceneReason, startTime: start, endTime: acc, duration,
            tempStart: c.startTime, tempEnd: c.endTime, originStart: c.startTime, originEnd: c.endTime, crop: c.crop ?? crop0,
            scenarioTpVal: c.scenarioTpVal, scenarioId: c.scenarioId, execPromt: c.execPromt,
            subtitleData: c.subtitles.map(sub => ({ ...sub, originText: sub.text })), isCrop: c.isCrop, isAiReframe: c.isAiReframe }
        })
        set({ compositionId, isFitWithPadding: d.fitWithPadding === 'Y', outroYn: d.outroYn, captionYn: d.captionYn, editRatio: d.aspectRatio, editTabValue: 'video',
          selectedSceneList, selectedScene: selectedSceneList[0], shortFormPreviewUrl: SAMPLE_VIDEO,
          banner: { ...d.banner, previewUrl: '', naturalSize: { width: 0, height: 0 }, previewWidth: 0, hasLocalFile: false }, caption: { ...d.caption } })
        get().requestSeek(d.clips[0].startTime)
        get().setSavedSnapshot(snapshotKey(get()))
      },
      // fontList · hookingComment
      getFontList: async () => { await sleep(200); set({ bannerFontList: FONT_LIST.filter(i => i.assetTpVal === 'FONT_BANNER'), captionFontList: FONT_LIST.filter(i => i.assetTpVal === 'FONT_CAPTION') }) },
      fetchHookingCommentList: async () => { await sleep(300); set({ hookingCommentList: HOOKING_COMMENTS }) },
      /** 화면 비율 재선택 및 임시 저장 이력 불러오기 시 상태 초기화 */
      resetSceneEdit: (skipSeek = false) => {
        const { draftList, detailInfo, player, analsList, fixedList, explorList, categoryList, bannerFontList, captionFontList, hookingCommentList, editRatio,
          overlayNaturalCropGetter, isHeaderModalOpen, isCaptionPreviewOn, isBannerPreviewOn } = get()
        set({ ...initialEditState(), draftList, detailInfo, analsList, fixedList, explorList, categoryList, bannerFontList, captionFontList, hookingCommentList, editRatio,
          overlayNaturalCropGetter, isHeaderModalOpen, isCaptionPreviewOn, isBannerPreviewOn, player: { ...player, isPlaying: false } })
        if (!skipSeek) get().requestSeek(0)
      },
      resetEdit: () => { demoToken += 1; set(initialEditState()) },
    }
  })
  // zustand 의 subscribe((state, prevState) => …) 모양으로 감싼다
  const subscribeEdit = fn => {
    let prev = useEditStore.getState()
    return useEditStore.subscribe(() => { const next = useEditStore.getState(), p = prev; prev = next; fn(next, p) })
  }

  /** 저장 (useHighlightSave) — 원본: SRT 업로드 → 장면 저장 → 클립 폴링 → 배너 업로드 → 임시저장 → 숏폼 폴링. 미리보기: 지연 후 결과만 반영 */
  const runSave = async () => {
    const S = useEditStore.getState, t = demoToken
    if (S().isGenerating) return
    S().setIsGenerating(true)
    await sleep(2800)
    if (t !== demoToken) return
    const st = S()
    const visible = st.selectedSceneList.filter(i => i.order > 0)
    const compositionId = `CMP-${Date.now().toString(36).toUpperCase().slice(-5)}`
    draftDb.unshift({
      compositionId, highlightName: st.banner.text || st.detailInfo.bdNm, presignedUrl: SAMPLE_VIDEO, tnailUrl: SAMPLE_POSTER,
      totalDuration: visible.reduce((a, c) => a + c.duration, 0),
      detail: {
        aspectRatio: st.editRatio, fitWithPadding: st.isFitWithPadding ? 'Y' : 'N', outroYn: st.outroYn, captionYn: st.captionYn, banner: { ...st.banner }, caption: { ...st.caption },
        clips: visible.map(v => ({ sceneId: v.sceneId, sceneTitle: v.sceneTitle, sceneReason: v.sceneReason, startTime: v.tempStart, endTime: v.tempEnd, crop: v.crop,
          scenarioTpVal: v.scenarioTpVal, scenarioId: v.scenarioId, execPromt: v.execPromt, subtitles: v.subtitleData, isCrop: v.isCrop, isAiReframe: v.isAiReframe })),
      },
    })
    useEditStore.setState(s => ({ compositionId, jobId: `JOB-${compositionId.slice(4)}`, draftList: [...draftDb], shortFormPreviewUrl: SAMPLE_VIDEO,
      banner: { ...s.banner, hasLocalFile: false }, isGenerating: false, isEditCaption: false, editTabValue: 'preview' }))
    S().setSavedSnapshot(snapshotKey(S()))
    toast({ color: 'green', icon: I.CircleCheckBig, title: '저장 완료', description: '장면이 성공적으로 저장되었습니다.' })
  }

  /* =====================================================================
   * 공통 조각
   * ===================================================================== */
  const TruncatedText = ({ text, className }) => html`<span title=${text} class=${cn('truncate', className)}>${text}</span>`

  // 원본 Video(forceLoad) 대용 — 셸 Video 는 사용자 클릭 전에는 영상을 불러오지 않아 편집 화면용으로 따로 둔다
  function EditVideo({ src, videoRef, overlay, className }) {
    const localRef = useRef(null)
    const [paused, setPaused] = useState(true)
    const [muted, setMuted] = useState(false)
    const [flash, setFlash] = useState(false)
    const [progress, setProgress] = useState(0)
    const setVideo = node => { localRef.current = node; if (videoRef) videoRef.current = node }
    const flashIcon = () => { setFlash(true); setTimeout(() => setFlash(false), 600) }
    const syncProgress = e => { const v = e.currentTarget; setProgress(v.duration ? v.currentTime / v.duration : 0) }
    const onUp = e => {
      if (e.button !== 0 || e.target.closest('button, input, [data-seek]')) return
      const v = localRef.current
      if (!v || !src) return
      if (!v.paused) { v.pause(); flashIcon() } else v.play().then(flashIcon).catch(() => {})
    }
    const seek = e => {
      const v = localRef.current
      if (!v?.duration) return
      const r = e.currentTarget.getBoundingClientRect()
      v.currentTime = clamp((e.clientX - r.left) / r.width, 0, 1) * v.duration
    }
    return html`<div onContextMenu=${e => e.preventDefault()} onPointerUp=${onUp} class=${cn('relative aspect-9/16 w-full cursor-pointer overflow-hidden rounded-md', className)}>
      <video ref=${setVideo} src=${src || undefined} playsInline muted=${muted} preload="auto" onPlay=${() => setPaused(false)} onPause=${() => setPaused(true)}
        onTimeUpdate=${syncProgress} onSeeked=${syncProgress} class="bg-bg-black pointer-events-auto block h-full w-full overflow-hidden rounded-md object-contain"></video>
      ${src && (flash || paused) && html`<div class="pointer-events-none absolute inset-0 z-25 flex items-center justify-center" aria-hidden="true">
        <img src=${flash && !paused ? ASSETS.btnPause : ASSETS.btnPlay} width="52" height="52" alt="" /></div>`}
      <button type="button" onClick=${() => { const v = localRef.current; if (v) { v.muted = !v.muted; setMuted(v.muted) } }}
        class="bg-bg-black/30 text-tx-white pointer-events-auto absolute top-2.5 left-2.5 z-20 flex h-6 w-6 items-center justify-center rounded-full">
        ${muted ? html`<${I.VolumeX} size=${16} />` : html`<${I.Volume2} size=${16} />`}</button>
      <div data-seek onPointerDown=${seek} class="absolute inset-x-0 bottom-0 z-20 h-3 cursor-pointer">
        <div class="absolute inset-x-0 bottom-1 h-0.5 bg-white/40"><div class="bg-bg-primary-bright h-full" style=${{ width: `${progress * 100}%` }}></div>
          <span class="bg-bg-primary-bright absolute top-1/2 h-3 w-3 -translate-x-1/2 -translate-y-1/2 rounded-full" style=${{ left: `${progress * 100}%` }}></span></div>
      </div>
      ${overlay != null && html`<div class="pointer-events-none absolute inset-0 z-11">${overlay}</div>`}
    </div>`
  }

  /** frameBox 바깥 영역을 반투명 블랙으로 딤 처리 (FrameDimOverlay) */
  const FrameDimOverlay = ({ frameBox: f, children, className }) => html`
    <div class=${cn('pointer-events-none absolute inset-0', className)}>
      <div class="bg-bg-black/55 absolute" style=${{ top: 0, left: 0, right: 0, height: f.top }}></div>
      <div class="bg-bg-black/55 absolute" style=${{ top: f.top + f.height, left: 0, right: 0, bottom: 0 }}></div>
      <div class="bg-bg-black/55 absolute" style=${{ top: f.top, left: 0, width: f.left, height: f.height }}></div>
      <div class="bg-bg-black/55 absolute" style=${{ top: f.top, left: f.left + f.width, right: 0, height: f.height }}></div>
      ${children}
    </div>`

  /** 영상 표시 영역(+ 리프레임 크롭 영역)을 매 프레임 추적 — fill 이면 엘리먼트 전체 */
  const useFrameBox = (videoRef, useCropFrame, fill = false) => {
    const [frameBox, setFrameBox] = useState(null)
    const ref = useRef(null)
    useEffect(() => {
      const video = videoRef.current
      if (!video) return
      let rafId
      const update = () => {
        rafId = requestAnimationFrame(update)
        if (!video.videoWidth || !video.videoHeight) return
        let next
        if (fill) next = { left: 0, top: 0, width: video.clientWidth, height: video.clientHeight }
        else {
          const { display, offset } = calcVideoLayout(video.clientWidth, video.clientHeight, video.videoWidth, video.videoHeight)
          const scale = display.width / video.videoWidth
          const c = useCropFrame ? useEditStore.getState().overlayNaturalCropGetter?.() : null
          next = c && c.width > 0 && c.height > 0
            ? { left: offset.xPos + c.x * scale, top: offset.yPos + c.y * scale, width: c.width * scale, height: c.height * scale }
            : { left: offset.xPos, top: offset.yPos, width: display.width, height: display.height }
        }
        const p = ref.current
        if (!p || p.left !== next.left || p.top !== next.top || p.width !== next.width || p.height !== next.height) { ref.current = next; setFrameBox(next) }
      }
      rafId = requestAnimationFrame(update)
      return () => cancelAnimationFrame(rafId)
    }, [videoRef, useCropFrame, fill])
    return frameBox
  }

  /** 원본 영상 위 배너(이미지+텍스트) 실시간 미리보기 (BannerOverlay) */
  function BannerOverlay({ videoRef, fill = false }) {
    const banner = useEditStore(s => s.banner)
    const bannerFontList = useEditStore(s => s.bannerFontList)
    const frameBox = useFrameBox(videoRef, true, fill)
    if (!banner.previewUrl || !frameBox || frameBox.width <= 0) return null
    const { text, fontIdx, fontSize, fontColor, fontStyle, strokeColor, strokeWidth, shadowColor, shadowOpacity, shadowOffsetX, shadowOffsetY, previewWidth, naturalSize, location } = banner
    const imageRect = getContainedRect(frameBox.width, frameBox.height, naturalSize.width, naturalSize.height)
    const fontScale = previewWidth > 0 ? imageRect.dw / previewWidth : 1
    return html`<div class="pointer-events-none absolute overflow-hidden" style=${{ left: frameBox.left, top: frameBox.top, width: frameBox.width, height: frameBox.height }}>
      <img src=${banner.previewUrl} alt="배너 미리보기" class="absolute block object-cover" />
      ${text && html`<div class="absolute -translate-y-1/2 rounded-[2px] px-1 py-[2px] text-center leading-[1.3] whitespace-pre" style=${{
        left: (location.x / 100) * imageRect.dw, top: (location.y / 100) * imageRect.dh, fontFamily: fontFamilyOf(bannerFontList, fontIdx),
        fontSize: `${fontSize * fontScale}px`, fontWeight: fontStyle === 'BOLD' ? 'bold' : 'normal', color: fontColor,
        ...(strokeWidth > 0 && { WebkitTextStroke: `${strokeWidth * fontScale}px ${strokeColor}`, paintOrder: 'stroke fill' }),
        ...(shadowOpacity > 0 && { textShadow: buildTextShadow(shadowOpacity, shadowColor, shadowOffsetX * fontScale, shadowOffsetY * fontScale) }),
      }}>${text}</div>`}
    </div>`
  }

  /** 원본 영상 위 최신 편집 상태의 말자막 실시간 미리보기 (CaptionOverlay) */
  function CaptionOverlay({ videoRef, subtitles, useCropFrame = false, fill = false }) {
    const caption = useEditStore(s => s.caption)
    const captionFontList = useEditStore(s => s.captionFontList)
    const editRatio = useEditStore(s => s.editRatio)
    const [activeText, setActiveText] = useState('')
    const frameBox = useFrameBox(videoRef, useCropFrame, fill)
    useEffect(() => {
      const video = videoRef.current
      if (!video) return
      const update = () => { const t = video.currentTime; setActiveText(subtitles.find(s => t >= s.startTime && t <= s.endTime)?.text ?? '') }
      update()
      video.addEventListener('timeupdate', update); video.addEventListener('seeked', update)
      return () => { video.removeEventListener('timeupdate', update); video.removeEventListener('seeked', update) }
    }, [videoRef, subtitles])
    if (!activeText || !frameBox || frameBox.width <= 0) return null
    const { fontIdx, fontSize, fontColor, fontStyle, fontLocationY, strokeWidth, strokeColor, shadowColor, shadowOpacity } = caption
    const ratioKey = editRatio || '9:16'
    const out = OUTPUT_SIZE[ratioKey]
    const posY = CAPTION_POSITION_Y_PX[ratioKey][['TOP', 'MIDDLE', 'BOTTOM'].includes(fontLocationY) ? fontLocationY : 'BOTTOM'] / out.height
    const scale = (frameBox.width / out.width) * BACKEND_DPI_SCALE
    return html`<div class="pointer-events-none absolute overflow-hidden" style=${{ left: frameBox.left, top: frameBox.top, width: frameBox.width, height: frameBox.height }}>
      <div class="absolute right-0 left-0 mx-auto w-fit max-w-[90%] px-2 text-center break-keep whitespace-pre-line select-none" style=${{
        top: `${posY * 100}%`, transform: 'translateY(-50%)', fontFamily: fontFamilyOf(captionFontList, fontIdx), fontSize: `${fontSize * scale}px`,
        fontWeight: fontStyle === 'BOLD' ? 'bold' : 'normal', color: fontColor, lineHeight: 1.3,
        ...(strokeWidth > 0 && { WebkitTextStroke: `${strokeWidth * scale}px #${strokeColor.replace('#', '')}`, paintOrder: 'stroke fill' }),
        ...(shadowOpacity > 0 && { textShadow: buildTextShadow(shadowOpacity, `#${shadowColor.replace('#', '')}`, 0, 0) }),
      }}>${activeText}</div>
    </div>`
  }

  /* =====================================================================
   * 리프레임(크롭) 오버레이 — useVideoCropOverlay 를 단순화해 옮김
   * ===================================================================== */
  function ReframeOverlay({ videoRef, containerRef }) {
    const isReframe = useEditStore(s => s.isReframe)
    const selectedScene = useEditStore(s => s.selectedScene)
    const editRatio = useEditStore(s => s.editRatio)
    const [natural, setNatural] = useState({ width: 0, height: 0 })
    const [layout, setLayout] = useState({ display: { width: 0, height: 0 }, offset: { xPos: 0, yPos: 0 } })
    const [cropBox, setCropBox] = useState({ xPos: 0, yPos: 0, width: 0, height: 0 })
    const [hasCropInteraction, setHasCropInteraction] = useState(false)
    const cropBoxRef = useRef(cropBox); cropBoxRef.current = cropBox
    const layoutRef = useRef(layout); layoutRef.current = layout
    const ratioRef = useRef(editRatio); ratioRef.current = editRatio
    const sceneId = selectedScene?.sceneId ?? null
    const c = selectedScene?.crop
    const saved = c && c.width > 0 && c.height > 0 ? c : null
    const { display, offset } = layout

    // 원본 해상도 + 컨테이너 크기 → 영상이 그려지는 영역(display)·레터박스 오프셋
    useEffect(() => {
      const video = videoRef.current, container = containerRef.current
      if (!video || !container) return
      const relayout = () => {
        if (!video.videoWidth) return
        setNatural(n => (n.width === video.videoWidth && n.height === video.videoHeight ? n : { width: video.videoWidth, height: video.videoHeight }))
        setLayout(calcVideoLayout(container.offsetWidth, container.offsetHeight, video.videoWidth, video.videoHeight))
      }
      video.addEventListener('loadedmetadata', relayout)
      relayout()
      const ro = new ResizeObserver(relayout)
      ro.observe(container)
      return () => { video.removeEventListener('loadedmetadata', relayout); ro.disconnect() }
    }, [])

    // shortcut: 원본은 저장 크롭이 없을 때 리사이즈 시 박스를 비례 스케일, 여기선 장면·비율·표시 크기가 바뀌면 다시 맞춘다
    useEffect(() => {
      if (!natural.width || !display.width) return
      if (saved) { setCropBox(displayCropFromNatural(saved, display, natural)); return }
      const rv = RATIO_VALUES[editRatio]
      if (!rv) return
      let width = Math.min(display.width, display.height * rv), height = width / rv
      if (height > display.height) { height = display.height; width = height * rv }
      setCropBox({ xPos: (display.width - width) / 2, yPos: (display.height - height) / 2, width, height })
    }, [sceneId, saved?.xPos, saved?.yPos, saved?.width, saved?.height, editRatio, natural.width, natural.height, display.width, display.height])

    useEffect(() => setHasCropInteraction(false), [sceneId])

    const actualCrop = natural.width > 0 && display.width > 0 ? getActualCrop(cropBox, display, natural) : null
    const actualCropRef = useRef(actualCrop); actualCropRef.current = actualCrop
    useEffect(() => {
      useEditStore.getState().setOverlayNaturalCropGetter(() => actualCropRef.current)
      return () => useEditStore.getState().setOverlayNaturalCropGetter(null)
    }, [sceneId])

    // 저장된 크롭 대비 변경 여부 → 장면 전환 dirty 가드용
    const isDirty = isReframe && (saved ? !isSameNaturalCrop(saved, actualCrop) : hasCropInteraction)
    useEffect(() => useEditStore.getState().setOverlayCropDirty(isDirty), [isDirty])

    const startInteraction = (e, handle) => {
      e.preventDefault(); e.stopPropagation()
      setHasCropInteraction(true)
      const snap = { ...cropBoxRef.current }, startX = e.clientX, startY = e.clientY
      const onMove = ev => {
        if (ev.buttons === 0) return onUp()
        const dx = ev.clientX - startX, dy = ev.clientY - startY
        const { width: dw, height: dh } = layoutRef.current.display
        if (!handle) { setCropBox({ ...snap, xPos: clamp(snap.xPos + dx, 0, dw - snap.width), yPos: clamp(snap.yPos + dy, 0, dh - snap.height) }); return }
        const rv = RATIO_VALUES[ratioRef.current]
        const anchorX = handle.includes('w') ? snap.xPos + snap.width : snap.xPos
        const anchorY = handle.includes('n') ? snap.yPos + snap.height : snap.yPos
        let width = Math.max(MIN_SIZE, handle.includes('w') ? snap.width - dx : snap.width + dx)
        const maxByX = handle.includes('w') ? anchorX : dw - anchorX, maxByY = handle.includes('n') ? anchorY : dh - anchorY
        width = clamp(width, MIN_SIZE, Math.min(maxByX, maxByY * rv)) // 비율 유지: 앵커 기준으로 경계 안 최대 너비
        const height = width / rv
        setCropBox({ xPos: handle.includes('w') ? anchorX - width : anchorX, yPos: handle.includes('n') ? anchorY - height : anchorY, width, height })
      }
      const onUp = () => { removeEventListener('mousemove', onMove); removeEventListener('mouseup', onUp) }
      addEventListener('mousemove', onMove); addEventListener('mouseup', onUp)
    }

    if (!isReframe || display.width <= 0) return null
    const overlayX = offset.xPos + cropBox.xPos, overlayY = offset.yPos + cropBox.yPos
    return html`<div class="pointer-events-none absolute inset-0 z-30">
      <${FrameDimOverlay} frameBox=${{ left: overlayX, top: overlayY, width: cropBox.width, height: cropBox.height }}>
        <div class="border-bd-default pointer-events-auto absolute cursor-move border-2" style=${{ left: overlayX, top: overlayY, width: cropBox.width, height: cropBox.height }}
          onMouseDown=${e => startInteraction(e)}>
          ${HANDLES.map(handle => {
            const pos = getHandlePos(cropBox, handle)
            return html`<div key=${handle} class="card absolute h-3 w-3 rounded-sm" style=${{ left: pos.xPos - 6, top: pos.yPos - 6, cursor: HANDLE_CURSOR[handle] }}
              onMouseDown=${e => startInteraction(e, handle)}></div>`
          })}
        </div>
      <//>
    </div>`
  }

  /* =====================================================================
   * 모달 — 화면비 선택 / 임시저장 이력
   * ===================================================================== */
  const RATIO_OPTIONS = [
    { ratio: '9:16', label: '세로형 숏폼, 스토리', imgIcon: ASSETS.iconArrowVertical, disabledType: [] },
    { ratio: '4:5', label: '세로형 피드', imgIcon: ASSETS.iconArrowVertical, disabledType: [] },
    { ratio: '1:1', label: '정사각형 피드', imgIcon: ASSETS.iconArrowAll, disabledType: [] },

  /** 단계 표시 목록 — 새로 나타난 단계만 한 번 fade-up */
  function StepList({ activeIndex, className, itemClassName = '' }) {
    const animated = useRef(new Set())
    return html`<ul class=${className}>
      ${STEPS.map((name, index) => {
        if (index > activeIndex) return null
        const isDone = index < activeIndex
        const shouldAnimate = !animated.current.has(index)
        if (shouldAnimate) animated.current.add(index)
        return html`<li key=${name} class=${cn('flex items-center gap-2', shouldAnimate && 'fx-fade-up', itemClassName)}>
          <${StepIcon} isDone=${isDone} /><span class=${cn('text-sm', !isDone && 'text-tx-caption')}>${name}</span></li>`
      })}
    </ul>`
  }

  /** A 시나리오 프롬프트 (분석 시나리오형 / 숏츠 제작 테마) */
  function ScenarioPrompt({ ctgList, onExtractScene }) {
    const analsList = useEditStore(s => s.analsList)
    const fixedList = useEditStore(s => s.fixedList)
    const playDuration = useEditStore(s => s.player.duration)
    const isGenerating = useEditStore(s => s.isGenerating)

    const [selectedPrompt, setSelectedPrompt] = useState({ id: '', name: '', type: '' })
    const [isAnalysOpen, setIsAnalysOpen] = useState(true)
    const [isTemplateOpen, setIsTemplateOpen] = useState(false)

    useEffect(() => { const cd = templateCategoryItems[0]?.stdioCtgCd; if (cd) setActiveCtgCd(prev => prev || cd) }, [templateCategoryItems.length])

    useEffect(() => { if (analsList.length > 0 && isAllDisabled) setIsTemplateOpen(true) }, [analsList, isAllDisabled])

    return html`<div class="flex min-h-0 flex-1 flex-col py-3 pr-1 pl-3">

                return item.actvYn === 'Y' && html`<div key=${`scenario_prompt_${item.scenarioId}`} onClick=${() => setSelectedPrompt({ id: item.scenarioId, name: item.scenarioNm, type: 'ANALS' })}
                  class=${cn('card cursor-pointer p-3', active ? 'border-bd-primary bg-bg-primary-subtle hover:border-bd-primary hover:bg-bg-primary-subtle' : 'border-bd-default hover:border-bd-normal hover:bg-bg-subtle')}>

        ${fixedList.length > 0 && html`

              <div class="mt-3.5 flex min-h-0 flex-1 flex-wrap content-start gap-2 pr-1">
                ${templateCategoryList.map(item => html`<label key=${`template_prompt_${item.scenarioId}`}
                  class=${cn(RadioVariants({ variant: 'round' }), roundButtonVariants({ checked: selectedPrompt.id === item.scenarioId }))}
                  onClick=${() => setSelectedPrompt({ id: item.scenarioId, name: item.scenarioNm, type: 'FIXED' })}>

  const ChipButton = ({ onClick, children }) => html`<${Button} variant="outline" size="sm" className="rounded-full" onClick=${onClick}>${children}<//>`

  /** contentList 개별 항목 — 단계 애니메이션과 완료 처리 */
  function SceneSection({ item, isLast, templateList, onSelectTemplate, onOpenProductList, onOpenSectionExtract }) {
    const isSceneListLoading = useEditStore(s => s.isSceneListLoading)
    const [activeIndex, setActiveIndex] = useState(item.isComplete ? STEPS.length - 1 : 0)
    useEffect(() => {
      if (item.isComplete) return
      const timers = STEPS.slice(1).map((_, i) => setTimeout(() => setActiveIndex(i + 1), (i + 1) * STEP_INTERVAL_MS))
      return () => timers.forEach(clearTimeout)

    useEffect(() => {

        <div class="flex flex-wrap content-start gap-2">${templateChips(templateList, onSelectTemplate, onOpenProductList, onOpenSectionExtract)}</div>

  /** 장면 Clip 탐색 > 프롬프트 입력 영역 */
  function PromptInput({ content, onContentChange, onSend }) {
    const textareaRef = useRef(null)
    const [isMultiRow, setIsMultiRow] = useState(false)
    const contentList = useEditStore(s => s.contentList)
    const duration = useEditStore(s => s.player.duration)
    const isGenerating = useEditStore(s => s.isGenerating)
    useEffect(() => {
      const el = textareaRef.current
      if (!el) return
      el.style.height = '0px'
      const sh = el.scrollHeight
      el.style.height = `${sh}px`
      const cs = getComputedStyle(el)
      const one = (parseFloat(cs.lineHeight) || 20) + (parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) || 0)
      setIsMultiRow(was => (was ? sh > one + 8 : sh > one + 20))
    }, [content])
    const onSendContent = () => { if (content.trim().length > 0) { onContentChange(''); onSend(content) } }
    return html`<div class="shrink-0 px-4 pt-3 pb-4">
      <div class="card flex items-center gap-2 rounded-2xl py-2.5 pr-2.5 pl-4 shadow-sm">

  /** 장면 Clip 탐색 > 수동 구간 추출 (바텀시트) */
  const ZERO_TIME = { hh: '00', mm: '00', ss: '00' }
  const TIME_FIELDS = ['hh', 'mm', 'ss']
  const timeToSec = t => parseInt(t.hh || '0', 10) * 3600 + parseInt(t.mm || '0', 10) * 60 + parseInt(t.ss || '0', 10)
  const clampField = (field, digits) => ((field === 'mm' || field === 'ss') && digits !== '' && parseInt(digits, 10) > 59 ? '59' : digits)
  function PromptSectionExtract({ duration, isOpen, onClose, onClickExtract }) {
    const [start, setStart] = useState(ZERO_TIME)
    const [end, setEnd] = useState(ZERO_TIME)
    const [touched, setTouched] = useState(false)
    const refs = useRef({ start: {}, end: {} })
    useEffect(() => { if (isOpen) { setStart(ZERO_TIME); setEnd(ZERO_TIME); setTouched(false) } }, [isOpen])
    const focusField = (type, field) => { const el = refs.current[type][field]; el?.focus(); el?.select() }
    const setter = type => (type === 'start' ? setStart : setEnd)
    const handleChange = (type, field, raw) => {
      const digits = clampField(field, raw.replace(/\D/g, '').slice(-2))
      setter(type)(prev => ({ ...prev, [field]: digits }))
      setTouched(true)
      if (digits.length === 2) { const next = TIME_FIELDS[TIME_FIELDS.indexOf(field) + 1]; if (next) focusField(type, next) }
    }
    const handleKeyDown = (e, type, field) => {
      const idx = TIME_FIELDS.indexOf(field)
      if ((e.key === 'Backspace' && e.currentTarget.value === '' && idx > 0) || (e.key === 'ArrowLeft' && idx > 0)) { e.preventDefault(); focusField(type, TIME_FIELDS[idx - 1]) }
      else if (e.key === 'ArrowRight' && idx < 2) { e.preventDefault(); focusField(type, TIME_FIELDS[idx + 1]) }
    }
    const handleSubmit = () => {
      const s = `${start.hh}:${start.mm}:${start.ss}`, e = `${end.hh}:${end.mm}:${end.ss}`
      onClickExtract('', '', '', { minInputSec: 0, maxInputSec: 0 }, '', { startTime: s, endTime: e, title: '이 장면은 직접 선택했어요', reason: `${s} ~ ${e} 구간을 장면으로 추가했어요.`, order: 1 })
      useEditStore.getState().addContent(`${s} ~ ${e} 구간을 추출해줘`)
    }
    const hasEmpty = t => TIME_FIELDS.some(f => t[f] === '')
    const isTimeEmpty = !touched || hasEmpty(start) || hasEmpty(end)
    const isInvalidRange = timeToSec(start) >= timeToSec(end)
    const maxSec = parseTimeToSeconds(duration)
    const isOverDuration = timeToSec(start) > maxSec || timeToSec(end) > maxSec
    const renderTimecode = (type, label) => {
      const value = type === 'start' ? start : end
      return html`<div class="flex flex-1 flex-col items-center gap-1">
        <span class="text-tx-caption text-center text-[11px] font-semibold select-none">${label}</span>
        <div class="flex items-center gap-0.5 sm:gap-1">
          ${TIME_FIELDS.map((field, i) => html`<div key=${field} class="flex items-center gap-0.5 sm:gap-1">
            <div class="border-bd-default bg-bg-subtle focus-within:border-tx-primary focus-within:ring-tx-primary/15 hover:border-tx-muted flex h-9 w-8 items-center justify-center rounded-lg border shadow-inner transition-all focus-within:ring-4 sm:h-11 sm:w-10">
              <input ref=${el => { refs.current[type][field] = el }} type="text" inputMode="numeric" placeholder="00" value=${value[field]}
                onInput=${e => handleChange(type, field, e.target.value)} onKeyDown=${e => handleKeyDown(e, type, field)} onFocus=${e => e.target.select()}
                onBlur=${() => setter(type)(prev => ({ ...prev, [field]: prev[field].padStart(2, '0') }))}
                class="text-tx-strong h-full w-full bg-transparent text-center font-mono text-sm font-semibold focus:outline-none sm:text-base" />
            </div>
            ${i < 2 && html`<span class="text-tx-muted text-xs font-semibold select-none sm:text-sm">:</span>`}
          </div>`)}
        </div>
      </div>`
    }
    return html`
      ${isOpen && html`<div class="absolute inset-0 z-10 bg-black/40" onClick=${onClose}></div>`}
      <div class=${cn('absolute inset-x-0 bottom-0 z-20 h-auto min-h-[220px]', 'transition duration-300 ease-in-out', !isOpen && 'translate-y-full')} inert=${isOpen ? undefined : true}>
        <div class="card bg-bg-white flex h-full flex-col overflow-hidden rounded-t-2xl shadow-2xl">
          <div class="border-bd-default flex items-center gap-1.5 border-b p-4 whitespace-pre-line">
            <div class="text-tx-strong text-lg font-bold tracking-tight">구간 추출</div>
            <div class="ml-auto"><${Button} variant="ghost" size="sm" leftIcon=${I.X} className="enabled:hover:bg-transparent" onClick=${onClose} /></div>
          </div>
          <div class="flex flex-col justify-between gap-4 p-5">
            <div class="flex flex-col gap-2">
              <div class="mx-auto flex w-full max-w-md items-center justify-center gap-2 sm:gap-4">
                ${renderTimecode('start', '시작 시간')}
                <div class="flex shrink-0 items-center justify-center pt-5"><${I.ArrowRight} className="text-tx-muted h-4 w-4" /></div>
                ${renderTimecode('end', '종료 시간')}
              </div>
            </div>
            <div class="mx-auto flex w-full max-w-md flex-col gap-1.5">
              ${!isTimeEmpty && isInvalidRange && html`<p class="text-center text-xs font-medium text-red-500">종료 시간은 시작 시간보다 이후여야 합니다.</p>`}
              ${!isTimeEmpty && !isInvalidRange && isOverDuration && html`<p class="text-center text-xs font-medium text-red-500">입력한 시간이 영상 전체 길이(${duration})를 초과했습니다.</p>`}
              <${Button} variant="primary" size="md" iconSize=${16} rightIcon=${I.SendHorizontal} className="w-full rounded-xl py-3 text-base font-semibold shadow-lg"
                onClick=${handleSubmit} disabled=${isTimeEmpty || isInvalidRange || isOverDuration}>추출<//>
            </div>
          </div>
        </div>
      </div>`
  }

      mq.addEventListener('change', apply)

    }, [])

    const isScenarioATab = tabValue === 'scenario_a'

        !isSidebarOpen && 'max-laptop:hidden')}>

          tabs=${scenarioTabItems} value=${tabValue} onChange=${id => { if (isSceneListLoading && id !== tabValue) return; onChangeScenario(id) }} />

        <${PromptSectionExtract} duration=${formatVideoTime(playDuration)} isOpen=${showSectionExtract} onClose=${() => setShowSectionExtract(false)} onClickExtract=${onExtractScene} />

  /* =====================================================================
   * 가운데 플레이어 영역
