  let detailToken = 0 // 상세: 팝업 닫힘/재조회 시 이전 응답 무시 (원본 AbortController)

  const useMyShortsStore = createStore((set, get) => ({
    /** 검색 조건 */
    searchInfo: { ...DEFAULT_SEARCH_VALUE },
    setSearchInfo: info => set({ searchInfo: info }),
    setStatus: status => set(s => ({ searchInfo: { ...s.searchInfo, status } })),
    clearSearch: () => set({ searchInfo: { ...DEFAULT_SEARCH_VALUE } }),
    resetSearchInfo: () => set({ searchInfo: { ...DEFAULT_SEARCH_VALUE } }),

    /** 목록 조회 */
    isLoading: true,
    myShortsData: { total: 0, list: [] },
    statusInfo: { all: 0, ready: 0, completed: 0 },
    getMyShortsList: async searchInfo => {
      const generation = ++fetchGeneration
      set({ isLoading: true, myShortsData: { total: 0, list: [] } })
      try {
        const res = await api.list({ ...searchInfo, status: searchInfo.status === 'all' ? '' : searchInfo.status })
        if (generation !== fetchGeneration) return
        const { list, total, status } = res
        set({ myShortsData: { total, list }, statusInfo: { ...status, all: status.completed + status.ready } })
      } finally {
        if (generation === fetchGeneration) set({ isLoading: false })
      }
    },
    refreshMyShortsList: () => get().getMyShortsList(get().searchInfo),
    resetMyShortsList: () => { fetchGeneration++; set({ isLoading: true, myShortsData: { total: 0, list: [] } }) },

    /** 등록 및 상세 조회 */
    detailInfo: DEFAULT_DETAIL_DATA,
    baseInfo: DEFAULT_BASE_INFO_DATA,
    scenes: [],
    codeInfo: DEFAULT_CODE_INFO_DATA,
    vasFormInfo: DEFAULT_VAS_FORM_INFO,
    isDetailLoading: false,
    setVasFormInfo: info => set({ vasFormInfo: info }),
    fetchMyShortsInitData: async (shortsId, isDetail = false) => {
      const token = ++detailToken
      set({ isDetailLoading: true })
      try {
        const convertOption = list => list.map(item => ({ label: item.codeNm, value: item.code }))
        // VAS 등록 모드에서만 공통 코드 조회 (상세 조회는 detailInfo 의 코드명 사용)
        if (!isDetail) {
          const codeData = await api.vasCode()
          if (token !== detailToken) return
          set({
            codeInfo: {
              deptNameList: convertOption(codeData.deptNameList),
              characterTypeList: convertOption(codeData.characterTypeList),
              timelineTypeList: convertOption(codeData.timelineTypeList),
            },
          })
        }
        const [detail, baseInfo, scenes] = await Promise.all([
          isDetail ? api.detail(shortsId) : Promise.resolve(null),
          api.baseInfo(shortsId),
          api.scenes(shortsId),
        ])
        if (token !== detailToken) return
        if (detail) set({ detailInfo: detail })
        set({ baseInfo, scenes: scenes.list })
        if (!isDetail) {
          const { codeInfo } = get()
          if (baseInfo.shortsId && codeInfo.timelineTypeList.length) set({ vasFormInfo: defaultBaseInfo(baseInfo, codeInfo) })
        }
      } finally {
        if (token === detailToken) set({ isDetailLoading: false })
      }
    },
    createVasUpload: data => api.vasUpload(data),
    resetMyShortsDetail: () => {
      detailToken++
      set({
        detailInfo: DEFAULT_DETAIL_DATA, baseInfo: DEFAULT_BASE_INFO_DATA, scenes: [], codeInfo: DEFAULT_CODE_INFO_DATA,
        vasFormInfo: DEFAULT_VAS_FORM_INFO, isDetailLoading: false,
      })
    },
  }))

  /* =====================================================================
   * common/DropdownBox
   * ===================================================================== */
  let dropdownSeq = 0
  const DropdownBox = ({ open, onOpenChange, anchorRef, title, description, titleId: titleIdProp, panelWidth = 220, className, zIndexClass = 'z-[200]', children }) => {
    const autoId = useMemo(() => `dropdown-${++dropdownSeq}-title`, [])
    const titleId = titleIdProp ?? autoId
    const panelRef = useRef(null)
    const [coords, setCoords] = useState({ top: 0, left: 0 })

    const updatePosition = () => {
      const el = anchorRef.current
      if (!el) return
      const r = el.getBoundingClientRect()
      const panelH = panelRef.current?.offsetHeight ?? 260
      const margin = 8
      const openUpward = innerHeight - r.bottom - margin < panelH && r.top - margin >= panelH
      const top = openUpward ? r.top - panelH - margin : r.bottom + margin
      const left = Math.max(margin, Math.min(r.right - panelWidth, innerWidth - panelWidth - margin))
      setCoords({ top, left })
    }

    useLayoutEffect(() => {
      if (!open) return
      updatePosition()
      addEventListener('resize', updatePosition)
      addEventListener('scroll', updatePosition, true)
      return () => { removeEventListener('resize', updatePosition); removeEventListener('scroll', updatePosition, true) }
    }, [open, panelWidth])

    useEffect(() => {
      if (!open) return
      const onKeyDown = e => { if (e.key !== 'Escape') return; e.preventDefault(); e.stopPropagation(); onOpenChange(false) }
      addEventListener('keydown', onKeyDown, true)
      return () => removeEventListener('keydown', onKeyDown, true)
    }, [open])

    useEffect(() => {
      if (!open) return
      const onPointerDown = e => {
        if (anchorRef.current?.contains(e.target) || panelRef.current?.contains(e.target)) return
        onOpenChange(false)
      }
      document.addEventListener('mousedown', onPointerDown)
      return () => document.removeEventListener('mousedown', onPointerDown)
    }, [open])

    if (!open) return null
    return html`<${Portal}>
      <div ref=${panelRef} class=${cn('card fixed rounded-xl p-4 shadow-lg', zIndexClass, className)}
        style=${{ top: `${coords.top}px`, left: `${coords.left}px`, width: `${panelWidth}px` }}
        onClick=${e => e.stopPropagation()} role="dialog" aria-modal="true" aria-labelledby=${titleId}>
        <div class="min-w-0">
          <div class="flex items-center justify-between gap-2">
            <h3 id=${titleId} class="text-tx-strong min-w-0 text-sm font-bold">${title}</h3>
            <${Button} className="shrink-0" variant="ghost" leftIcon=${I.X} size="xs" iconSize=${15} aria-label="닫기" onClick=${() => onOpenChange(false)} />
          </div>
          ${description ? html`<p class="text-tx-caption mt-0.5 text-xs leading-snug">${description}</p>` : null}
        </div>
        ${children}
      </div>
    <//>`
  }

  /* =====================================================================
   * my/ExportDropdown
   * ===================================================================== */
  /** 숏츠 보내기 드롭다운 공통 상태 — 파일 받기는 미리보기에서 막는다 */
  const useExportDropdown = () => {
    const wrapperRef = useRef(null)
    const [isExportOpen, setIsExportOpen] = useState(false)
    const onFileDownload = (event, fileUrl, fileName) => {
      event.stopPropagation()
      setIsExportOpen(false)
      notInPreview(`${fileName.split('.').pop().toUpperCase()} 보내기(파일 다운로드)`)
    }
    return { wrapperRef, isExportOpen, setIsExportOpen, onFileDownload }
  }

  const exportOptionClassName =
    'hover:bg-bg-primary-subtle hover:text-tx-primary text-tx-strong flex w-full cursor-pointer items-center gap-2 rounded-lg px-2 py-2.5 text-left text-xs font-medium transition'

  const ExportOptionList = ({ source, onFileDownload }) => {
    const fileBaseName = source.shortsNm || source.shortsId
    return html`<ul class="mt-4 space-y-0.5">
      <li>
        <button type="button" class=${exportOptionClassName} onClick=${e => onFileDownload(e, source.shortsUrl, `${fileBaseName}.mp4`)}>
          <${Icon} icon=${I.Film} color="gray" size="sm" className="text-tx-primary h-4 w-4" />
          MP4보내기
        </button>
      </li>
      <li>
        <button type="button" class=${exportOptionClassName} onClick=${e => onFileDownload(e, source.xmlUrl, `${fileBaseName}.xml`, source.vmOrgUrl, source.captnUrl)}>
          <${Icon} icon=${I.FileCode} color="gray" size="sm" className="text-tx-primary h-4 w-4" />
          XML보내기
        </button>
      </li>
    </ul>`
  }

  const ExportDropdown = ({ open, onOpenChange, anchorRef, source, onFileDownload, zIndexClass }) => html`
    <${DropdownBox} open=${open} onOpenChange=${onOpenChange} anchorRef=${anchorRef} title="보내기" description="보내기 방식을 선택하세요" panelWidth=${185} zIndexClass=${zIndexClass}>
      <${ExportOptionList} source=${source} onFileDownload=${onFileDownload} />
    <//>`

  /* =====================================================================
   * my/modal — 편성 상품 추가(ProductListModal) / 편성 상품 조회(ProductViewModal)
   * ===================================================================== */
  const PRODUCT_SEARCH_TYPE_OPTIONS = [
    { label: '상품명', value: 'itemNm' },
    { label: '상품 코드', value: 'itemCd' },
  ]
  const DEFAULT_PRODUCT_SEARCH = { type: 'itemNm', keyword: '' }

  // 두 모달이 똑같이 갖고 있던 검색 영역·필터링을 한곳에
  const useProductSearch = list => {
    const [tempSearchInfo, setTempSearchInfo] = useState({ ...DEFAULT_PRODUCT_SEARCH })
    const [productSearchInfo, setProductSearchInfo] = useState({ ...DEFAULT_PRODUCT_SEARCH })
    const filtered = useMemo(() => {
      const { type, keyword } = productSearchInfo
      if (!keyword) return list
      return list.filter(item => (type === 'itemCd' ? item.itemCd : item.itemNm).includes(keyword))
    }, [list, productSearchInfo])
    const onSearch = () => setProductSearchInfo(tempSearchInfo)
    const onClear = () => { setTempSearchInfo({ ...DEFAULT_PRODUCT_SEARCH }); setProductSearchInfo({ ...DEFAULT_PRODUCT_SEARCH }) }
    const renderSearchBar = () => html`
      <div class="mb-4 flex shrink-0 items-center gap-2">
        <${Selectbox} className="w-32" options=${PRODUCT_SEARCH_TYPE_OPTIONS} value=${tempSearchInfo.type} onChange=${value => setTempSearchInfo(prev => ({ ...prev, type: value }))} />
        <${Input} className="flex-1" id="keyword" value=${tempSearchInfo.keyword} placeholder="검색어를 입력하세요"
          onChange=${e => { const { value } = e.target; setTempSearchInfo(prev => ({ ...prev, keyword: value })) }}
          onKeyUp=${e => e.key === 'Enter' && onSearch()}
          onClear=${() => setTempSearchInfo(prev => ({ ...prev, keyword: '' }))} showSearchIcon />
        <${Button} size="md" iconSize=${16} variant="iconOnlyPrimary" leftIcon=${I.Search} aria-label="검색" onClick=${onSearch} />
        <${Button} size="md" variant="iconOnly" iconSize=${16} leftIcon=${I.RefreshCw} aria-label="초기화" onClick=${onClear} />
      </div>`
    return { filtered, renderSearchBar }
  }

  const productEmptyState = () => html`<${EmptyState} title="편성 상품 정보가 없습니다" description="검색어를 변경하거나 필터를 조정해 보세요." className="h-[298px]" />`

  const ProductListModal = ({ checkedList, isOpen, onClose }) => {
    const [isLoading, setIsLoading] = useState(false)
    const [productList, setProductList] = useState([])
    const checkedListRef = useRef(checkedList)
    checkedListRef.current = checkedList
    const baseInfo = useMyShortsStore(s => s.baseInfo)
    const vodId = baseInfo.bdTpVal ? vodKey(baseInfo) : ''
    const { filtered, renderSearchBar } = useProductSearch(productList)

    /** 편성 상품 목록 조회 */
    useEffect(() => {
      if (!vodId) return
      let cancelled = false
      setIsLoading(true)
      api.vodProducts(vodId)
        .then(res => { if (!cancelled) setProductList(res.bdItems.map(item => ({ ...item, checked: checkedListRef.current.includes(item.itemCd) }))) })
        .finally(() => { if (!cancelled) setIsLoading(false) })
      return () => { cancelled = true }
    }, [vodId])

    /** 전체 선택 */
    const allChecked = list => {
      const isAllChecked = list.every(item => item.checked)
      setProductList(prev => prev.map(item => (list.some(f => f.itemCd === item.itemCd) ? { ...item, checked: !isAllChecked } : item)))
    }
    /** 개별 선택 */
    const onChecked = value => setProductList(prev => prev.map(item => (item.itemCd === value ? { ...item, checked: !item.checked } : item)))

    const columns = [
      {
        key: 'checked',
        header: html`<${Checkbox} variant="default" checked=${!!filtered.length && filtered.every(item => item.checked)} onChange=${() => allChecked(filtered)} />`,
        align: 'center',
        render: row => html`<${Checkbox} checked=${row.checked} onChange=${() => onChecked(row.itemCd)} />`,
      },
      { key: 'itemCd', header: '상품 코드', align: 'center' },
      { key: 'itemNm', header: '상품명', align: 'center' },
    ]
    const checked = productList.filter(item => item.checked)

    return html`<${Modal} size="md" title="편성 상품 추가" isOpen=${isOpen} onClose=${onClose} className="overflow-hidden">
      ${renderSearchBar()}
      <div class="relative mb-4 flex max-h-105 min-h-75 w-full">
        ${isLoading
          ? html`<div class="z-loading absolute inset-0 flex h-full items-center justify-center"><${LoadingSpinner} /></div>`
          : html`<${Table} columns=${columns} colGroup=${[{ width: '10%' }, { width: '30%' }]} data=${filtered}
              onRowClick=${row => onChecked(row.itemCd)} getRowClassName=${row => (row.checked ? 'bg-bg-primary-surface' : undefined)}
              isScroll emptyState=${productEmptyState()} className="w-full" />`}
      </div>
      <${Button} variant="primary" className="w-full" onClick=${() => onClose(checked)}>${`선택 완료 (${checked.length})`}<//>
    <//>`
  }

  const ProductViewModal = ({ itemDtoList, isOpen, onClose }) => {
    const { filtered, renderSearchBar } = useProductSearch(itemDtoList)
    return html`<${Modal} size="md" title="편성 상품" isOpen=${isOpen} onClose=${onClose} className="overflow-hidden">
      ${renderSearchBar()}
      <${Table} columns=${[{ key: 'itemCd', header: '상품 코드', align: 'center' }, { key: 'itemNm', header: '상품명', align: 'center' }]}
        colGroup=${[{ width: '10%' }, { width: '30%' }]} data=${filtered} getRowClassName=${() => 'bg-bg-primary-surface'}
        isScroll emptyState=${productEmptyState()} />
    <//>`
  }

  /* =====================================================================
   * my/modal — VAS 등록 팝업의 탭 섹션들
   * ===================================================================== */
  const toDateOrNull = dtm => (dtm instanceof Date && !Number.isNaN(dtm.getTime()) ? dtm : null)
  const scheInfoOf = ({ bdTpVal, pgmNm, bdScheStrDtm }) => (bdTpVal && pgmNm && bdScheStrDtm ? [bdTpVal, formatDate(bdScheStrDtm), pgmNm].join(' ') : '')

  /** VAS 등록 탭 */
  const VasCreateSection = ({ status, isSaving, strTimeText, setStrTimeText, endTimeText, setEndTimeText }) => {
    const [isModalOpen, setIsModalOpen] = useState(false)
    const [strDateText, setStrDateText] = useState('')
    const [endDateText, setEndDateText] = useState('')
    const [strTimeError, setStrTimeError] = useState(false)
    const [endTimeError, setEndTimeError] = useState(false)
    const codeInfo = useMyShortsStore(s => s.codeInfo)
    const baseInfo = useMyShortsStore(s => s.baseInfo)
    const vasFormInfo = useMyShortsStore(s => s.vasFormInfo)
    const setVasFormInfo = useMyShortsStore(s => s.setVasFormInfo)

    const isProcessing = status === 'processing'
    const form = vasFormInfo.shortsBasicForm
    const { dpStrDtm, dpEndDtm } = form

    /** 두 일시가 모두 유효할 때 종료일시 < 시작일시면 에러 */
    const isEndBeforeStart = isValidDatetime(dpStrDtm) && isValidDatetime(dpEndDtm) && dpEndDtm.getTime() < dpStrDtm.getTime()

    /** store 일시가 바뀌면 화면의 일자와 시간 입력값도 동기화 */
    useEffect(() => {
      if (isValidDatetime(dpStrDtm)) { setStrDateText(formatDate(dpStrDtm, 'date')); setStrTimeText(formatDate(dpStrDtm, 'time')) }
      if (isValidDatetime(dpEndDtm)) { setEndDateText(formatDate(dpEndDtm, 'date')); setEndTimeText(formatDate(dpEndDtm, 'time')) }
    }, [dpStrDtm, dpEndDtm])

    const onChangeForm = (key, value) => {
      const cur = useMyShortsStore.getState().vasFormInfo
      setVasFormInfo({ ...cur, shortsBasicForm: { ...cur.shortsBasicForm, [key]: value } })
    }
    const onChangeInput = e => onChangeForm(e.target.id, e.target.value)

    /** 편성 상품 추가 */
    const onAddProduct = checkedList => {
      if (checkedList) {
        setVasFormInfo({ ...vasFormInfo, shortsItemFormList: checkedList.map(item => ({ itemCd: item.itemCd, dispSeq: 0, repItemYn: 'N' })) })
      }
      setIsModalOpen(false)
    }

    /** 일자 + 시간을 Date 로 */
    const buildDate = (dateStr, timeStr) => {
      if (!dateStr) return null
      const combined = `${dateStr} ${timeStr || '00:00:00'}`
      return isValidDatetime(combined) ? new Date(combined) : null
    }

    const makeDateChangeHandler = (setDateText, timeText, formKey) => date => {
      if (!date) { setDateText(''); onChangeForm(formKey, ''); return }
      const dateStr = formatDate(date, 'date')
      setDateText(dateStr)
      onChangeForm(formKey, buildDate(dateStr, timeText) ?? '')
    }

    /** 시작·종료 시간 입력 (hhmmss → hh:mm:ss) */
    const makeTimeChangeHandler = (type, setTimeText, setTimeError) => e => {
      const digits = e.target.value.replace(/\D/g, '').slice(0, 6)
      setTimeError(false)
      if (digits.length < 6) { setTimeText(digits); return }
      const hh = parseInt(digits.slice(0, 2), 10), mm = parseInt(digits.slice(2, 4), 10), ss = parseInt(digits.slice(4, 6), 10)
      if (hh <= 23 && mm <= 59 && ss <= 59) {
        const formatted = formatVideoTime(hh * 3600 + mm * 60 + ss)
        setTimeText(formatted)
        const date = buildDate(type === 'str' ? strDateText : endDateText, formatted)
        onChangeForm(type === 'str' ? 'dpStrDtm' : 'dpEndDtm', date ?? '')
      } else {
        setTimeText(digits)
        setTimeError(true)
      }
    }

    return html`<div class="flex flex-col gap-5 px-2">
      <${Input} id="shortsNm" label="동영상명" value=${form.shortsNm} placeholder="동영상명을 입력하세요" required
        error=${isSaving && !form.shortsNm} errorText="동영상명을 입력해주세요." onChange=${onChangeInput} disabled=${isProcessing} />
      <div class="comp-container">
        <${FormLabel} title="시작일시" required />
        <div class="flex items-start gap-2">
          <${DateTimepicker} className="min-w-0 flex-1" date=${toDateOrNull(dpStrDtm)} onChange=${makeDateChangeHandler(setStrDateText, strTimeText, 'dpStrDtm')}
            disabled=${isProcessing} required error=${isSaving && !strDateText} errorText="시작일자를 입력해주세요." />
          <${Input} id="dpStrTime" className="min-w-0 flex-1" value=${strTimeText} onChange=${makeTimeChangeHandler('str', setStrTimeText, setStrTimeError)}
            error=${strTimeError || (isSaving && !isValidTimeText(strTimeText))}
            errorText=${strTimeError ? '잘못된 시간 값입니다.' : '시작시간을 입력해주세요.'} placeholder="hhmmss" disabled=${isProcessing} />
        </div>
      </div>
      <div class="comp-container">
        <${FormLabel} title="종료일시" required />
        <div class="flex items-start gap-2">
          <${DateTimepicker} className="min-w-0 flex-1" date=${toDateOrNull(dpEndDtm)} onChange=${makeDateChangeHandler(setEndDateText, endTimeText, 'dpEndDtm')}
            disabled=${isProcessing} required error=${(isSaving && !endDateText) || isEndBeforeStart}
            errorText=${isEndBeforeStart ? '종료일시는 시작일시 이후로 설정해주세요.' : '종료일자를 입력해주세요.'} />
          <${Input} id="dpEndTime" className="min-w-0 flex-1" value=${endTimeText} onChange=${makeTimeChangeHandler('end', setEndTimeText, setEndTimeError)}
            error=${isEndBeforeStart || endTimeError || (isSaving && !isValidTimeText(endTimeText))}
            errorText=${isEndBeforeStart || endTimeError ? '잘못된 시간 값입니다.' : '종료시간을 입력해주세요.'} placeholder="hhmmss" disabled=${isProcessing} />
        </div>
      </div>
      <div class="flex gap-2">
        <${Selectbox} label="등장인물 유형" className="flex-1" value=${form.contentsType2} required error=${isSaving && !form.contentsType2}
          errorText="등장인물 유형을 선택해주세요." onChange=${value => onChangeForm('contentsType2', value)} options=${codeInfo.characterTypeList} disabled=${isProcessing} />
        <${Selectbox} label="타임라인" className="flex-1" value=${form.contentsType3} required error=${isSaving && !form.contentsType3}
          errorText="타임라인을 선택해주세요." onChange=${value => onChangeForm('contentsType3', value)} options=${codeInfo.timelineTypeList} disabled=${isProcessing} />
      </div>
      <${Selectbox} label="제작 부서" className="flex-1" value=${form.mkChnCd} required error=${isSaving && !form.mkChnCd}
        errorText="제작 부서를 선택해주세요." onChange=${value => onChangeForm('mkChnCd', value)} options=${codeInfo.deptNameList} disabled=${isProcessing} />
      <div class="flex items-end">
        <${Input} id="shortsItemFormList" label="편성 상품 추가" value=${`총 ${vasFormInfo.shortsItemFormList.length}개 상품 추가됨`} className="w-full flex-1" disabled />
        <${Button} variant="primary" className="w-16 border-none" leftIcon=${I.Plus} onClick=${() => setIsModalOpen(true)} disabled=${isProcessing}>추가<//>
      </div>
      <${Input} id="searchTagText" label="검색 태그" value=${form.searchTagText} required placeholder="검색 태그를 입력하세요"
        error=${isSaving && !form.searchTagText} errorText="검색 태그를 입력해주세요." onChange=${onChangeInput} disabled=${isProcessing} />
      <${Input} id="scheInfo" label="방송편성 정보" value=${scheInfoOf(baseInfo)} disabled />
      <${ProductListModal} checkedList=${vasFormInfo.shortsItemFormList.map(item => item.itemCd)} isOpen=${isModalOpen} onClose=${onAddProduct} />
    </div>`
  }

  /** 기본 정보 탭 */
  const VasInfoSection = () => {
    const baseInfo = useMyShortsStore(s => s.baseInfo)
    const handleCopy = url => navigator.clipboard?.writeText(url).catch(() => {})
    const rows = [
      ['배포 채널', RATIO_CHANNEL[baseInfo.scrnRt]],
      ['화면 비율', baseInfo.scrnRt],
      ['영상 길이', formatTimelineLabel(baseInfo.shortsDurTm)],
      ['생성 일시', formatDate(baseInfo.insDtm, 'dotFull')],
    ]
    return html`<div class="flex flex-col gap-6 px-2">
      <div>
        <h3 class="text-tx-caption text-13 mb-2 px-1 font-semibold tracking-wide uppercase">원본 영상</h3>
        <div class="bg-bg-subtle flex items-center gap-2 rounded-lg p-4 text-xs">
          <${I.Link} className="h-4 w-4" />
          ${baseInfo.vmOrgUrl && html`<${Button} variant="ghost" size="xs" rightIcon=${I.Copy}
            className="text-tx-caption min-w-0 flex-1 overflow-hidden bg-transparent px-0 enabled:hover:bg-transparent" iconSize=${12}
            title=${baseInfo.vmOrgUrl} onClick=${() => handleCopy(baseInfo.vmOrgUrl)}>
            <span class="min-w-0 truncate">${baseInfo.vmOrgUrl}</span>
          <//>`}
        </div>
      </div>
      <div>
        <h3 class="text-tx-caption text-13 mb-2 px-1 font-semibold tracking-wide uppercase">영상 형식</h3>
        <ul class="bg-bg-subtle flex flex-col gap-4 rounded-lg p-4 text-xs">
          ${rows.map(([label, value]) => html`<li key=${label} class="flex items-start gap-4">
            <strong class="text-tx-caption w-24 shrink-0 text-xs font-normal">${label}</strong>
            <span class="text-tx-normal flex-1 text-right text-xs [word-break:break-word]">${value}</span>
          </li>`)}
        </ul>
      </div>
    </div>`
  }

  /** VAS 등록 완료 건의 상세 탭 */
  const VasDetailSection = () => {
    const [isModalOpen, setIsModalOpen] = useState(false)
    const detailInfo = useMyShortsStore(s => s.detailInfo)
    const baseInfo = useMyShortsStore(s => s.baseInfo)
    const sections = [
      [{ id: 'shortsId', label: '동영상 코드', value: detailInfo.shortsId }],
      [
        { id: 'shortsNm', label: '동영상명', value: detailInfo.shortsNm },
        { id: 'dpStrDtm', label: '시작일시', value: detailInfo.dpStrDtm },
        { id: 'dpEndDtm', label: '종료일시', value: detailInfo.dpEndDtm },
      ],
      [
        { id: 'contentsType2Nm', label: '등장인물 유형', value: detailInfo.contentsType2Nm },
        { id: 'contentsType3Nm', label: '타임라인', value: detailInfo.contentsType3Nm },
        { id: 'contentsType1Nm', label: '연출 유형', value: detailInfo.contentsType1Nm },
        { id: 'contentsType4Nm', label: '제작 유형', value: detailInfo.contentsType4Nm },
        { id: 'mkChnNm', label: '제작 부서', value: detailInfo.mkChnNm },
      ],
      [
        { id: 'shortsRelationItemDtoList', label: '편성 상품', value: `총 ${detailInfo.shortsRelationItemDtoList.length}개 상품` },
        { id: 'searchTagText', label: '검색 태그', value: detailInfo.searchTagText },
        { id: 'scheInfo', label: '방송편성 정보', value: scheInfoOf(baseInfo) },
        { id: 'shortsDir', label: '폴더 경로', value: detailInfo.shortsDir },
      ],
    ]
    return html`<div class="flex flex-col">
      ${sections.map((items, sIdx) => html`<ul key=${sIdx} class="border-bd-default flex flex-col gap-1.5 border-b py-2.5">
        ${items.map(item => html`<li key=${`${sIdx}_${item.id}`} class="flex gap-4 py-1">
          <strong class="text-tx-caption leading-base min-w-20 shrink-0 font-bold">${item.label}</strong>
          ${item.id === 'shortsRelationItemDtoList'
            ? html`<div class="flex flex-1 justify-between">
                <p class="leading-base break-all">${item.value}</p>
                <${Button} variant="primary" className="mr-2 w-16 border-none" size="xs" leftIcon=${I.Search} iconSize=${12} onClick=${() => setIsModalOpen(true)}>조회<//>
              </div>`
            : html`<p class=${cn('leading-base break-all', { 'text-tx-strong font-bold': item.id === 'shortsId', 'text-tx-subtle': item.id === 'dpEndDtm' })}>${item.value}</p>`}
        </li>`)}
      </ul>`)}
      <${ProductViewModal} itemDtoList=${detailInfo.shortsRelationItemDtoList} isOpen=${isModalOpen} onClose=${() => setIsModalOpen(false)} />
    </div>`
  }

  /** 사용된 장면 목록 탭 */
  const VasListSection = () => {
    const scenes = useMyShortsStore(s => s.scenes)
    const sceneList = scenes.reduce((acc, item) => {
      const duration = parseTimeToSeconds(item.orgVmPlayngEndTm) - parseTimeToSeconds(item.orgVmPlayngStrTm)
      const start = acc.at(-1)?.end ?? 0
      return [...acc, { ...item, start, end: start + duration, duration }]
    }, [])
    return html`<div class="flex h-full flex-col px-2">
      <ul class="flex flex-1 flex-col gap-2 overflow-y-auto">
        ${sceneList.map(({ clipSeq, clipId, clipNm, clipTnailUrl, start, end, duration }) => html`
          <li key=${`${clipId}_${clipSeq}`} class="card flex items-center gap-3 rounded-xl p-3 shadow-sm">
            <div class="h-[52px] w-[88px] shrink-0">
              <${ImageBox} wrapperClassName="h-full w-full rounded-lg bg-bg-black" src=${clipTnailUrl} alt=${clipNm} />
            </div>
            <div class="flex min-w-0 flex-col gap-1">
              <span class="text-tx-primary-bright truncate" title=${clipNm}>${clipNm}</span>
              <span class="text-tx-caption text-xs">${formatVideoTime(start)} ~ ${formatVideoTime(end)}</span>
              <span class="text-tx-caption text-xs">재생 길이: ${formatVideoTime(duration)}</span>
            </div>
          </li>`)}
      </ul>
    </div>`
  }

  /* =====================================================================
   * my/modal/VasCreateModal — 상세 정보 팝업
   * ===================================================================== */
  const VasCreateModal = ({ shortsId, status, closeModal }) => {
    const [tabValue, setTabValue] = useState('regist')
    const { wrapperRef, isExportOpen, setIsExportOpen, onFileDownload } = useExportDropdown()
    const { open: openConfirm, close: closeConfirm, alertProps } = useAlert()
    const [isSaving, setIsSaving] = useState(false) // 유효성 검증 여부
    const [isSubmitting, setIsSubmitting] = useState(false) // 등록 중 (로딩바)
    const [strTimeText, setStrTimeText] = useState('')
    const [endTimeText, setEndTimeText] = useState('')

    const baseInfo = useMyShortsStore(s => s.baseInfo)
    const vasFormInfo = useMyShortsStore(s => s.vasFormInfo)
    const isDetailLoading = useMyShortsStore(s => s.isDetailLoading)

    const isProcessing = status === 'processing'
    const isCompleted = status === 'completed'
    const exportSource = { shortsId, shortsUrl: baseInfo.shortsUrl, xmlUrl: baseInfo.xmlUrl, shortsNm: baseInfo.shortsNm, vmOrgUrl: baseInfo.vmOrgUrl, captnUrl: baseInfo.captnUrl }

    /** 상세 정보 조회 */
    useEffect(() => {
      const { fetchMyShortsInitData, resetMyShortsDetail } = useMyShortsStore.getState()
      fetchMyShortsInitData(shortsId, isCompleted).catch(error => {
        openConfirm({
          variant: 'error', title: '데이터 조회 실패', description: error instanceof Error ? error.message : String(error),
          buttons: [{ label: '확인', variant: 'outline', onClick: closeConfirm }],
        })
      })
      return () => resetMyShortsDetail()
    }, [shortsId, status])

    const tabItems = [
      {
        id: 'regist',
        label: 'VAS 등록',
        content: isCompleted
          ? html`<${VasDetailSection} />`
          : html`<${VasCreateSection} status=${status} isSaving=${isSaving} strTimeText=${strTimeText} setStrTimeText=${setStrTimeText}
              endTimeText=${endTimeText} setEndTimeText=${setEndTimeText} />`,
      },
      { id: 'info', label: '기본 정보', content: html`<${VasInfoSection} />` },
      { id: 'list', label: '사용된 장면 목록', content: html`<${VasListSection} />` },
    ]

    /** VAS 등록 */
    const onCreateVas = async () => {
      const { shortsBasicForm, ...restForm } = useMyShortsStore.getState().vasFormInfo
      const resultForm = {
        ...restForm,
        shortsBasicForm: { ...shortsBasicForm, dpStrDtm: toLocalISO(shortsBasicForm.dpStrDtm), dpEndDtm: toLocalISO(shortsBasicForm.dpEndDtm) },
        contents: shortsBasicForm.shortsNm,
        sessionReferId: DEMO_USER.userNm,
      }
      closeConfirm()
      setIsSubmitting(true)
      try {
        await useMyShortsStore.getState().createVasUpload(resultForm)
        openConfirm({
          variant: 'success', title: 'VAS 등록 요청이 완료되었습니다.', description: ' ',
          buttons: [{ label: '확인', variant: 'primary', onClick: () => { closeModal(); useMyShortsStore.getState().refreshMyShortsList() } }],
        })
      } catch (error) {
        openConfirm({
          variant: 'error', title: 'VAS 등록 실패', description: error instanceof Error ? error.message : String(error),
          buttons: [{ label: '확인', variant: 'outline', onClick: closeConfirm }],
        })
      } finally {
        setIsSubmitting(false)
        setIsSaving(false)
      }
    }

    /** VAS 등록 유효성 검증 */
    const onConfirmValidate = () => {
      setIsSaving(true)
      const { shortsBasicForm, shortsItemFormList } = vasFormInfo
      if (!validateVasForm(shortsBasicForm, strTimeText, endTimeText)) return
      const isDtoItem = !!shortsItemFormList.length
      const message = isDtoItem
        ? html`<p><span class="text-tx-primary font-bold">VAS 등록</span>하시겠습니까?</p>`
        : html`<p class="text-tx-red font-bold">추가된 편성 상품이 존재하지 않습니다</p>
            <p><span class="text-tx-primary font-bold">VAS 등록</span>하시겠습니까?</p>`
      openConfirm({
        variant: isDtoItem ? 'info' : 'warning', title: 'VAS 등록', description: message, contentClassName: 'whitespace-pre-line',
        buttons: [
          { label: '취소', variant: 'outline', onClick: closeConfirm },
          { label: '확인', variant: 'primary', onClick: onCreateVas },
        ],
      })
    }

    const exportDropdown = () => html`<${ExportDropdown} open=${isExportOpen} onOpenChange=${setIsExportOpen} anchorRef=${wrapperRef}
      source=${exportSource} onFileDownload=${onFileDownload} zIndexClass="z-modal" />`

    return html`<${Modal} isOpen onClose=${closeModal} size="lg" title="상세 정보" closeOnBackdropClick=${false}
      panelClassName="h-[75vh]" contentClassName="flex flex-1 overflow-hidden gap-5">
      <div class="relative min-h-0 flex-1 overflow-hidden rounded-md">
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="relative h-full w-full overflow-hidden rounded-md">
            <${Video} key=${`vas_${shortsId}_${status}`} src=${baseInfo.shortsUrl} poster=${baseInfo.tnailUrl} timeText=${baseInfo.shortsDurTm}
              onLoadedMetadata=${e => { e.currentTarget.currentTime = baseInfo.previewStart || 0 }}
              className="bg-bg-black h-full w-full [&_img]:object-contain [&_video]:mx-auto [&_video]:aspect-9/16 [&_video]:w-auto [&_video]:object-cover" />
          </div>
        </div>
      </div>
      <div class="flex flex-1 flex-col gap-4 overflow-hidden">
        <${Tabs} variant="underline" className="flex min-h-0 flex-1 flex-col gap-4" buttonClassName="flex-1 justify-center text-sm"
          panelClassName="flex-1 overflow-y-auto pt-0" tabs=${tabItems} value=${tabValue} onChange=${setTabValue} />
        ${tabValue === 'regist' && (isCompleted
          ? html`<div ref=${wrapperRef} class="bg-bg-primary-light/50 mx-2 flex">
              <${Button} variant="secondary" className="flex-1" leftIcon=${I.Check} iconSize=${16} disabled>VAS 등록 완료<//>
              <span class="bg-bg-default my-2 w-px self-stretch" />
              <${Button} variant="secondary" iconSize=${16} className="enabled:hover:bg-bg-primary-light/50 shrink-0" leftIcon=${I.ChevronDown}
                isRotate=${isExportOpen} aria-label="보내기 메뉴 열기" onClick=${() => setIsExportOpen(prev => !prev)} />
              ${exportDropdown()}
            </div>`
          : html`<div ref=${wrapperRef} class="bg-bg-primary-bright mx-2 flex">
              <${Button} variant="primary" className="flex-1" disabled=${isSubmitting || isProcessing} onClick=${e => { e.stopPropagation(); onConfirmValidate() }}>VAS 등록<//>
              <span class="bg-bg-default my-2 w-px self-stretch" />
              <${Button} variant="primary" iconSize=${16} className="enabled:hover:text-tx-white shrink-0" leftIcon=${I.ChevronDown}
                isRotate=${isExportOpen} aria-label="보내기 메뉴 열기" onClick=${() => setIsExportOpen(prev => !prev)} disabled=${isSubmitting || isProcessing} />
              ${exportDropdown()}
            </div>`)}
      </div>
      <${Alert} ...${alertProps} />
      ${(isDetailLoading || isSubmitting) && html`<div class="z-loading bg-bg-muted/80 absolute top-0 left-0 flex h-full w-full items-center justify-center"><${LoadingSpinner} /></div>`}
    <//>`
  }

  /* =====================================================================
   * my/MyShortsCardPanel — 카드 목록
   * ===================================================================== */
  /** 카드별 보내기 드롭다운 (카드마다 open 상태가 따로) */
  const MyShortsExportActions = ({ data, setVasModal, isCompleted = false }) => {
    const status = data.vasRegStat.toLowerCase()
    const { wrapperRef, isExportOpen, setIsExportOpen, onFileDownload } = useExportDropdown()
    const variant = isCompleted ? 'secondary' : 'primary'
    return html`<div ref=${wrapperRef} class=${cn('card flex w-full min-w-0 items-center overflow-hidden', isCompleted ? 'bg-bg-primary-light/50' : 'bg-bg-primary-bright')}>
      <${Button} variant=${variant} size="sm" className="min-w-0 flex-1" leftIcon=${isCompleted ? I.Check : undefined} iconSize=${isCompleted ? 14 : undefined}
        onClick=${e => { e.stopPropagation(); setVasModal({ shortsId: data.shortsId, status }) }}>${isCompleted ? 'VAS 등록 완료' : 'VAS 등록'}<//>
      <span class="bg-bg-default my-2 w-px self-stretch" />
      <${Button} variant=${variant} size="sm" iconSize=${14} leftIcon=${I.ChevronDown} isRotate=${isExportOpen} aria-label="보내기 메뉴 열기"
        onClick=${e => { e.stopPropagation(); setIsExportOpen(prev => !prev) }} />
      <${ExportDropdown} open=${isExportOpen} onOpenChange=${setIsExportOpen} anchorRef=${wrapperRef}
        source=${{ shortsUrl: data.shortsUrl, xmlUrl: data.xmlUrl, shortsNm: data.shortsNm, shortsId: data.shortsId, vmOrgUrl: data.vmOrgUrl, captnUrl: data.captnUrl }}
        onFileDownload=${onFileDownload} />
    </div>`
  }

  /** 상태에 따른 버튼 영역 */
  const MyShortsStatusButton = ({ data, setVasModal }) => {
    const status = data.vasRegStat.toLowerCase()
    if (status === 'processing') {
      return html`<button type="button" class=${cn(buttonVariants({ variant: 'ghost', size: 'sm' }), 'bg-bg-primary-subtle w-full min-w-0 overflow-hidden')}
        onClick=${e => { e.stopPropagation(); setVasModal({ shortsId: data.shortsId, status }) }}>
        <span class="truncate bg-gradient-to-r from-[#36bcff] to-[#f541ff] bg-clip-text font-semibold text-transparent">VAS 등록 중</span>
      </button>`
    }
    return html`<${MyShortsExportActions} data=${data} setVasModal=${setVasModal} isCompleted=${status === 'completed'} />`
  }

  /** 숏츠 카드 — 썸네일에 마우스를 올리면 원본 방송의 해당 구간을 미리 본다 */
  const MyShortsCardItem = ({ data, setVasModal }) => {
    const { shortsId, shortsNm, tnailUrl, vasRegStat } = data
    const videoRef = useRef(null)
    return html`<div class="card flex min-w-0 cursor-pointer flex-col overflow-hidden select-none" onClick=${() => setVasModal({ shortsId, status: vasRegStat.toLowerCase() })}>
      <div class="aspect-9/16 shrink-0 overflow-hidden rounded-t-md">
        ${tnailUrl && html`<${Video} mode="preview" src=${data.shortsUrl} poster=${tnailUrl} videoRef=${videoRef}
          onPreviewPeekStart=${() => { if (videoRef.current) videoRef.current.currentTime = data.previewStart }}
          className="bg-bg-black h-full w-full rounded-none [&_video]:rounded-none [&_video]:object-cover" />`}
      </div>
      <div class="flex min-w-0 shrink-0 flex-col gap-2 p-3">
        <div class="flex h-[40px] min-w-0 items-start">
          <strong class=${videoTitleVariants()}>${shortsNm || shortsId}</strong>
        </div>
        <div class="min-w-0 shrink-0">
          <${MyShortsStatusButton} data=${data} setVasModal=${setVasModal} />
        </div>
      </div>
    </div>`
  }

  const renderMyShortsCardSkeleton = key => html`<div key=${key} class="card flex min-w-0 flex-col overflow-hidden" aria-hidden="true">
    <${Skeleton} className="aspect-9/16 shrink-0 rounded-t-md" />
    <div class="flex min-w-0 shrink-0 flex-col gap-2 p-3">
      <div class="flex h-[40px] min-w-0 flex-col gap-1">
        <${Skeleton} variant="text" className="h-3.5 w-full shrink-0 rounded-xs" />
        <${Skeleton} variant="text" className="h-3.5 w-[92%] shrink-0 rounded-xs" />
      </div>
      <${Skeleton} className="h-8 shrink-0" />
    </div>
  </div>`

  const MyShortsCardPanel = () => {
    const [vasModal, setVasModal] = useState({ shortsId: '', status: '' })
    const searchInfo = useMyShortsStore(s => s.searchInfo)
    const myShortsData = useMyShortsStore(s => s.myShortsData)
    const isLoading = useMyShortsStore(s => s.isLoading)
    const scrollContainerRef = useRef(null)

    // 마운트 및 상태 탭 변경 시 목록 조회
    useEffect(() => {
      getScrollableAncestor(scrollContainerRef.current)?.scrollTo({ top: 0 })
      useMyShortsStore.getState().getMyShortsList(searchInfo)
    }, [searchInfo.status])

    // 무한 스크롤: 현재 노출 중인 카드 수
    const [visibleCount, setVisibleCount] = useState(PAGE_SIZE.MEDIUM)
    const visibleItems = myShortsData.list.slice(0, visibleCount)
    const { loadMoreRef } = useInfiniteScroll({
      onLoadMore: () => setVisibleCount(prev => prev + PAGE_SIZE.MEDIUM),
      hasMore: visibleCount < myShortsData.list.length,
      isLoading: false,
    })

    if (isLoading) {
      return html`<div ref=${scrollContainerRef} class="grid grid-cols-[repeat(auto-fill,minmax(166px,1fr))] gap-x-2 gap-y-5 pr-2">
        ${Array.from({ length: 10 }, (_, i) => renderMyShortsCardSkeleton(`skeleton_${i}`))}
      </div>`
    }

    return html`
      <div ref=${scrollContainerRef} class="pr-2">
        ${myShortsData.list.length
          ? html`<div class="grid grid-cols-[repeat(auto-fill,minmax(166px,1fr))] gap-x-2 gap-y-5">
                ${visibleItems.map(item => html`<${MyShortsCardItem} key=${item.shortsId} data=${item} setVasModal=${setVasModal} />`)}
              </div>
              <div ref=${loadMoreRef} class="h-px" aria-hidden="true" />`
          : html`<${EmptyState} title="표시할 데이터가 없습니다" description="조건을 바꾸거나 새로고침해 보세요." className="h-[298px]" />`}
      </div>
      ${vasModal.status && html`<${VasCreateModal} shortsId=${vasModal.shortsId} status=${vasModal.status} closeModal=${() => setVasModal({ shortsId: '', status: '' })} />`}`
  }

  /* =====================================================================
   * my/MyShortsSearch · MyShortsCardList · page
   * ===================================================================== */
  const MyShortsSearch = () => {
    const [tempInfo, setTempInfo] = useState(() => ({ ...useMyShortsStore.getState().searchInfo }))
    const { getMyShortsList, setSearchInfo, clearSearch } = useMyShortsStore.getState()

    /** 입력 값 초기화 후 목록 재조회 */
    const onClear = () => {
      setTempInfo({ ...DEFAULT_SEARCH_VALUE })
      getMyShortsList({ ...DEFAULT_SEARCH_VALUE })
      clearSearch()
    }
    /** 검색 실행 > 현재 선택된 상태 탭은 유지 */
    const onSearch = () => {
      const { status } = useMyShortsStore.getState().searchInfo
      setSearchInfo({ ...tempInfo, status })
      getMyShortsList({ ...tempInfo, status })
    }

    return html`<div class="flex flex-wrap items-end gap-2">
      <${Selectbox} className="w-32" label="검색 유형" options=${MY_SEARCH_TYPE_OPTIONS} value=${tempInfo.type} onChange=${value => setTempInfo(prev => ({ ...prev, type: value }))} />
      <${Input} className="w-59.5" id="keyword" value=${tempInfo.keyword} placeholder="검색어를 입력하세요"
        onChange=${e => { const { value } = e.target; setTempInfo(prev => ({ ...prev, keyword: value })) }}
        onKeyUp=${e => e.key === 'Enter' && onSearch()}
        onClear=${() => setTempInfo(prev => ({ ...prev, keyword: '' }))} showSearchIcon />
      <${Button} size="md" iconSize=${16} variant="iconOnlyPrimary" leftIcon=${I.Search} aria-label="검색" onClick=${onSearch} />
      <${Button} size="md" variant="iconOnly" iconSize=${16} leftIcon=${I.RefreshCw} aria-label="초기화" onClick=${onClear} />
    </div>`
  }

  const MyShortsCardList = () => {
    const searchInfo = useMyShortsStore(s => s.searchInfo)
    const statusInfo = useMyShortsStore(s => s.statusInfo)
    const tabs = STATUS_TAB_ITEMS.map(item => ({
      id: item.id,
      label: `${item.label} (${formatNumber(statusInfo[item.id])})`,
      content: html`<${MyShortsCardPanel} />`,
    }))
    return html`<${Tabs} variant="underline" tabs=${tabs} value=${searchInfo.status} onChange=${useMyShortsStore.getState().setStatus}
      stickyClassName="bg-bg-white sticky [top:var(--search-h)] z-20" className="pb-5" />`
  }

  /** 내가 만든 숏츠 화면 */
  const HighlightMyPage = () => {
    const searchRef = useRef(null)
    const [searchH, setSearchH] = useState(0)

    useEffect(() => {
      const el = searchRef.current
      if (!el) return
      const ro = new ResizeObserver(() => setSearchH(el.offsetHeight))
      ro.observe(el)
      return () => ro.disconnect()
    }, [])

    // 화면 이탈 시 검색 및 목록 상태 초기화
    useEffect(() => () => {
      useMyShortsStore.getState().resetMyShortsList()
      useMyShortsStore.getState().resetSearchInfo()
    }, [])

    return html`<div class="flex h-full flex-col px-10" style=${{ '--search-h': `${searchH + 54}px` }}>
      <div ref=${searchRef} class="bg-bg-white sticky top-[54px] z-30 py-3">
        <${MyShortsSearch} />
      </div>
      <${MyShortsCardList} />
    </div>`
  }

  PAGES.MyShorts = HighlightMyPage
})()

;

  const HANGUL_START = 0xac00
  const HANGUL_END = 0xd7a3
  const escapeRegExp = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')

  const makeKoreanRegexString = search => [...search].map(char => {
    const code = char.charCodeAt(0)
    if (CHOSUNG.includes(char)) {
      const startCode = HANGUL_START + CHOSUNG.indexOf(char) * 588
      return `[${char}${String.fromCharCode(startCode)}-${String.fromCharCode(startCode + 587)}]`
    }
    if (code >= HANGUL_START && code <= HANGUL_END && (code - HANGUL_START) % 28 === 0) {
      return `[${char}-${String.fromCharCode(code + 27)}]`
    }
    return escapeRegExp(char)
  }).join('')

  const matchKoreanKeyword = (keyword, ...texts) => {
    const q = keyword.trim()
    if (!q) return true
    const regex = new RegExp(makeKoreanRegexString(q), 'i')
    return texts.some(text => !!text && regex.test(text))
  }

  const matchExactKeyword = (keyword, ...texts) => {
    const q = keyword.trim().toLowerCase()
    if (!q) return true
    return texts.some(text => !!text && text.trim().toLowerCase() === q)
  }

  const highlightKoreanKeyword = (text, keyword, className = 'bg-bg-primary-light text-tx-primary font-bold') => {
    const q = keyword.trim()
    if (!q) return text
    const src = makeKoreanRegexString(q)
    const matchRegex = new RegExp(`^${src}$`, 'i')
    return text.split(new RegExp(`(${src})`, 'gi')).map((part, i) =>
      matchRegex.test(part) && part !== '' ? html`<strong key=${i} class=${className}>${part}</strong>` : part)
  }

  /* ---------- 원본 components/common/InlineAlert.tsx (셸에 없음) ---------- */
  const INLINE_ALERT_ICON = { info: I.CircleAlert, success: I.CircleCheckBig, warning: I.TriangleAlert, error: I.Ban }
  const InlineAlert = ({ variant, icon = true, title, description, className, textCenter = false }) => {
    const AlertIcon = INLINE_ALERT_ICON[variant]
    return html`<div class="bg-bg-white w-full rounded-xs">
      <div class=${cn(inlineAlertVariants({ variant }), className)}>
        ${icon && html`<${AlertIcon} size=${14} className=${inlineAlertIconVariants({ variant })} />`}
        <div class=${cn(inlineAlertContentVariants({ variant }), textCenter && 'text-center')}>
          <strong class="text-13 font-bold whitespace-pre-line">${title}</strong>
          ${description && html`<p class="text-xs text-current">${description}</p>`}
        </div>
      </div>
    </div>`
  }

  /* ---------- 더미 데이터: 편성 PGM 원장(retrieveBdPgm) + 분석 대상 목록(retrievePlanningPgmList) ---------- */
  const EXTRA_PGMS = [
    { code: 'PG1009', name: '리빙 핫딜 타임' }, { code: 'PG1010', name: '데일리 뷰티 클래스' }, { code: 'PG1011', name: '골프 앤 아웃도어' },
    { code: 'PG1012', name: '프리미엄 주얼리 쇼' }, { code: 'PG1013', name: '굿모닝 푸드마켓' }, { code: 'PG1014', name: '스마트 가전 리뷰' },
    { code: 'PG1015', name: '심야 특가 스페셜' }, { code: 'PG1016', name: '반려생활 연구소' }, { code: 'PG1017', name: '시니어 건강 상담소' },
    { code: 'PG1018', name: '신상 패션 위크' }, { code: 'PG1019', name: '주방 살림 노하우' }, { code: 'PG1020', name: '모바일 라이브 특가' },
    { code: 'PG1021', name: '홈캉스 인테리어' }, { code: 'PG1022', name: '키즈 뷰티 타임' },
  ]
  const BD_TPS = ['MLC', 'TV', 'TVPLUS', 'TV', 'MLC']
  const BD_PGMS = [...DEMO.pgms, ...EXTRA_PGMS].map((p, i) => ({ pgmCd: p.code, pgmNm: p.name, bdTp: BD_TPS[i % BD_TPS.length] }))
  const MOD_IDS = ['demo01', 'demo02', 'demo03', 'demo04']
  const MY_ID = MOD_IDS[0]
  const nowStr = () => formatDate(new Date(), 'datetime')
  // 앞 16개만 분석 대상에 등록돼 있고, 편성에서 자동 추가된 신규 프로그램(뒤쪽 몇 개)은 미사용(N)
  const INITIAL_ROWS = BD_PGMS.slice(0, 16).map((p, i) => ({
    ...p,
    modDtm: formatDate(daysAgo(i * 3 + 1, 9 + (i % 8), (i * 17) % 60), 'datetime'),
    modId: MOD_IDS[i % MOD_IDS.length],
    useYn: i >= 13 || i === 6 ? 'N' : 'Y',
  }))

  // 원본 lib/data/pgm-api.ts 의 server action 들 → 메모리 반영 (revalidateTag 대신 스토어 갱신)
  const usePgmStore = createStore(set => ({
    rows: INITIAL_ROWS,
    editPgmUseYn: async list => {
      await sleep(300)
      const next = new Map(list.map(p => [p.pgmCd, p.useYn]))
      set(s => ({ rows: s.rows.map(r => (next.has(r.pgmCd) ? { ...r, useYn: next.get(r.pgmCd), modDtm: nowStr(), modId: MY_ID } : r)) }))
    },
    createPgm: async p => {
      await sleep(300)
      set(s => ({ rows: [{ ...p, modDtm: nowStr(), modId: MY_ID }, ...s.rows] }))
    },
    deletePgm: async list => {
      await sleep(300)
      const codes = new Set(list.map(p => p.pgmCd))
      set(s => ({ rows: s.rows.filter(r => !codes.has(r.pgmCd)) }))
    },
  }))
  const doneToast = title => toast({ color: 'green', icon: I.CircleCheckBig, title })
  const USE_YN_LABEL = { Y: '사용', N: '미사용' }

  /* ---------- 공통 상수 (원본 PgmPageClient / ModalPgmCodeSearch) ---------- */
  const USE_YN_BADGE_CONFIG = { Y: { variant: 'green', label: '사용' }, N: { variant: 'gray', label: '미사용' } }
  const CHANNEL_BADGE_CONFIG = { MLC: { variant: 'purple', label: 'MLC' }, TV: { variant: 'yellow', label: 'TV' }, TVPLUS: { variant: 'green', label: 'TVPLUS' } }
  const StateBadge = ({ useYn }) => html`<${Badge} variant=${USE_YN_BADGE_CONFIG[useYn].variant} shape="rounded">${USE_YN_BADGE_CONFIG[useYn].label}<//>`
  const ChannelBadge = ({ type, size }) => html`<${Badge} variant=${CHANNEL_BADGE_CONFIG[type].variant} shape="square" size=${size}>${CHANNEL_BADGE_CONFIG[type].label}<//>`
  const pgmChannelOptions = [
    { label: '전체', value: '' }, { label: 'MLC', value: 'MLC' }, { label: 'TV', value: 'TV' }, { label: 'TVPLUS', value: 'TVPLUS' },
  ]
  const useYnOptions = [{ label: '사용', value: 'Y' }, { label: '미사용', value: 'N' }]
  const colGroup = [
    { width: '48px' }, { width: '20%', minWidth: '195px' }, { width: 'calc(100% - 358px)', minWidth: '120px' }, { width: '10%', minWidth: '90px' },
    { width: '10%', minWidth: '90px' }, { width: '8%', minWidth: '80px' }, { width: '14%', minWidth: '120px' }, { width: '8%', minWidth: '80px' },
  ]
  const modalColGroup = [{ width: '72px', minWidth: '72px' }, { width: '10%', minWidth: '90px' }, { width: '10%', minWidth: '110px' }, { minWidth: '120px' }]
  const dash = () => html`<span class="text-tx-muted">-</span>`

  /* ---------- ModalPgmDelete ---------- */
  const ModalPgmDelete = ({ isOpen, onDelPgm, onClose }) => html`
    <${Modal} isOpen=${isOpen} onClose=${onClose} size="sm" contentPadding=${false} title="프로그램 삭제"
      buttons=${[{ label: '취소', variant: 'outline', onClick: onClose }, { label: '삭제', variant: 'danger', onClick: () => { onDelPgm(); onClose() } }]}>
      <div class="flex flex-col gap-4 px-5.5">
        <p class="text-sm">선택한 프로그램을 목록에서 삭제합니다.<br />삭제 후 해당 프로그램은 롱투숏 분석 대상에서 제외됩니다.</p>
        <${InlineAlert} variant="warning" title=${html`<span class="font-normal">삭제된 프로그램은 복구할 수 없습니다. <br />삭제 대신 <em class="font-bold">미사용</em>으로 변경하는 것을 권장합니다.</span>`} />
      </div>
    <//>`

  /* ---------- ModalPgmCodeSearch ---------- */
  function ModalPgmCodeSearch({ existingCodes, isOpen, onClose }) {
    const [pgmChannel, setPgmChannel] = useState('')
    const [pgmCode, setPgmCode] = useState('')
    const [pgmName, setPgmName] = useState('')
    const [selected, setSelected] = useState(null)
    const [rows, setRows] = useState([])
    const [dataLoaded, setDataLoaded] = useState(false)
    const [pgmValid, setPgmValid] = useState(false)
    const alreadyAddedCodes = useMemo(() => new Set(existingCodes ?? []), [existingCodes])

    const initPgm = () => {
      setPgmChannel(''); setPgmCode(''); setPgmName(''); setSelected(null); setRows([]); setDataLoaded(false); setPgmValid(false)
    }
    // close 시 초기화
    useEffect(() => { if (!isOpen) initPgm() }, [isOpen])

    const handleCreatePgm = () => {
      const { pgmCd, pgmNm, bdTp } = selected
      usePgmStore.getState().createPgm({ pgmCd, pgmNm, bdTp, useYn: 'Y' }).then(() => doneToast(`'${pgmNm}' 프로그램이 추가되었습니다.`))
      onClose()
    }

    // pgm 조회 (retrieveBdPgm → 더미 원장 필터)
    const fetchPgm = async () => {
      if (!pgmChannel) { setPgmValid(true); return }
      await sleep(300)
      setRows(BD_PGMS.filter(p => p.bdTp === pgmChannel && (!pgmCode || p.pgmCd.toLowerCase().includes(pgmCode.trim().toLowerCase())) && (!pgmName || p.pgmNm.includes(pgmName.trim())))
        .map(p => ({ ...p, id: p.pgmCd })))
      setDataLoaded(true)
    }

    const columns = [
      {
        key: 'id', header: '선택', headerAlign: 'center', align: 'center',
        render: row => alreadyAddedCodes.has(row.pgmCd)
          ? html`<span class="text-tx-muted">추가됨</span>`
          : html`<${Radio} name="pgm-code-search" value=${row.pgmCd} checked=${selected?.pgmCd === row.pgmCd} onChange=${() => setSelected(row)} />`,
      },
      { key: 'bdTp', header: 'PGM 채널', headerAlign: 'center', align: 'center', render: row => html`<${ChannelBadge} type=${row.bdTp} size="sm" />` },
      {
        key: 'pgmCd', header: '프로그램 코드', headerAlign: 'left', align: 'left',
        render: row => alreadyAddedCodes.has(row.pgmCd)
          ? html`<span class="text-tx-muted">${row.pgmCd}</span>`
          : html`<strong class="text-tx-primary font-semibold">${row.pgmCd}</strong>`,
      },
      { key: 'pgmNm', header: '프로그램 명', headerAlign: 'left', align: 'left', render: row => row.pgmNm },
    ]

    return html`
      <${Modal} isOpen=${isOpen} onClose=${onClose} size="md" contentPadding=${false} title="PGM 코드 검색"
        buttons=${[{ label: '취소', variant: 'outline', onClick: onClose }, { label: '추가', variant: 'primary', onClick: handleCreatePgm, disabled: !selected }]}>
        <div class="flex flex-col gap-4 px-5.5">
          <div class="bg-bg-primary-subtle border-bd-primary-light flex flex-col gap-2 rounded-sm border p-4">
            <div class="flex items-center gap-2">
              <${FormLabel} title="PGM 채널" className="w-20" />
              <${Selectbox} size="sm" value=${pgmChannel} className="w-full min-w-0 flex-1" options=${pgmChannelOptions} onChange=${setPgmChannel} />
            </div>
            <div class="flex w-full min-w-0 gap-5">
              <div class="flex min-w-0 flex-1 basis-0 items-center gap-2">
                <${FormLabel} id="pgm-code-input" title="프로그램 코드" className="w-20" />
                <${Input} id="pgm-code-input" size="sm" value=${pgmCode} className="min-w-0 flex-1 shrink!" placeholder="프로그램 코드 입력" onChange=${e => setPgmCode(e.target.value)} />
              </div>
              <div class="flex min-w-0 flex-1 basis-0 items-center gap-2">
                <${FormLabel} id="pgm-name-input" title="프로그램 명" className="w-20" />
                <${Input} id="pgm-name-input" size="sm" value=${pgmName} className="min-w-0 flex-1 shrink!" placeholder="프로그램 명 입력" onChange=${e => setPgmName(e.target.value)} />
              </div>
            </div>
            <div class="flex justify-center gap-2">
              <${Button} size="sm" variant="outline" leftIcon=${I.RotateCcw} iconSize=${12} onClick=${initPgm}>초기화<//>
              <${Button} size="sm" variant="primary" leftIcon=${I.Search} iconSize=${12} onClick=${fetchPgm}>조회<//>
            </div>
          </div>

          ${selected && html`<${InlineAlert} variant="success"
            title=${html`<span class="font-normal"><em class="font-bold">${selected.pgmNm}</em> (${selected.pgmCd}) 선택됨. 하단 [추가] 버튼을 클릭하세요.</span>`} />`}

          <${Table} columns=${columns} data=${rows} colGroup=${modalColGroup} isRowHover isScroll className="max-h-[298px]"
            getRowClassName=${row => alreadyAddedCodes.has(row.pgmCd) ? 'bg-bg-subtle opacity-50 hover:bg-bg-subtle'
              : selected?.pgmCd === row.pgmCd ? 'bg-bg-primary-subtle hover:bg-bg-primary-subtle' : undefined}
            emptyState=${dataLoaded
              ? html`<${EmptyState} title="검색 결과가 없습니다" description="조건에 해당하는 프로그램이 없습니다." height="h-[209px]" />`
              : html`<${EmptyState} title="검색 조건 입력 후 [조회] 해주세요." height="h-[209px]" />`} />
        </div>
      <//>
      <${Alert} variant="info" isOpen=${pgmValid} title="PGM 채널을 선택해주세요."
        buttons=${[{ label: '확인', variant: 'primary', onClick: () => setPgmValid(false) }]} />`
  }

  /* ---------- PgmPageClient ---------- */
  function PgmPage() {
    const initialRows = usePgmStore(s => s.rows)
    const [rows, setRows] = useState(() => initialRows.map(item => ({ ...item, id: item.pgmCd, status: item.useYn })))
    // 새로운 데이터로 동기화 (원본: revalidateTag 후 initialRows 변경 → 추가 중이던 행은 사라진다)
    useEffect(() => { setRows(initialRows.map(item => ({ ...item, id: item.pgmCd, status: item.useYn }))) }, [initialRows])

    const [useYnValue, setUseYnValue] = useState('')
    const [isPgmDeleteOpen, setIsPgmDeleteOpen] = useState(false)
    const [isPgmCodeSearchOpen, setIsPgmCodeSearchOpen] = useState(false)
    const [useYnValid, setUseYnValid] = useState(false)
    const [selectedIds, setSelectedIds] = useState(() => new Set())
    const [sortState, setSortState] = useState({ key: null, direction: 'asc' })
    const [pgmChannel, setPgmChannel] = useState('')
    const [searchPgm, setSearchPgm] = useState('')

    // 검색 매칭된 행만 노출
    const filterResults = useMemo(() => {
      const c = pgmChannel.trim()
      const i = searchPgm.trim()
      if (c === '' && !i) return rows
      return rows.filter(row => (c === '' || matchExactKeyword(c, row.bdTp)) && (!i || matchKoreanKeyword(i, row.pgmCd, row.pgmNm)))
    }, [rows, searchPgm, pgmChannel])

    // sortState 기준으로 정렬 (null 은 항상 뒤로)
    const sortedPgmRows = useMemo(() => {
      const { key, direction } = sortState
      if (!key) return filterResults
      const dir = direction === 'asc' ? 1 : -1
      return [...filterResults].sort((a, b) => {
        const aVal = a[key], bVal = b[key]
        if (aVal == null && bVal == null) return 0
        if (aVal == null) return 1
        if (bVal == null) return -1
        return String(aVal).localeCompare(String(bVal), 'ko', { numeric: true }) * dir
      })
    }, [filterResults, sortState])

    const initPgm = () => { setPgmChannel(''); setSearchPgm('') }

    // 컬럼 클릭 정렬 토글: asc → desc → 해제
    const handleSort = key => setSortState(prev =>
      prev.key !== key ? { key, direction: 'asc' } : prev.direction === 'asc' ? { key, direction: 'desc' } : { key: null, direction: 'asc' })

    const selectableRows = rows.filter(row => !row.isDraft)
    const allSelected = selectableRows.length > 0 && selectedIds.size === selectableRows.length
    const toggleSelectAll = checked => setSelectedIds(checked ? new Set(selectableRows.map(r => r.id)) : new Set())
    const toggleRow = (id, checked) => setSelectedIds(prev => {
      const next = new Set(prev)
      if (checked) next.add(id)
      else next.delete(id)
      return next
    })

    const handleRowUseYnChange = (row, value) => {
      if ((value !== 'Y' && value !== 'N') || value === row.useYn) return
      usePgmStore.getState().editPgmUseYn([{ pgmCd: row.pgmCd, useYn: value }])
        .then(() => doneToast(`'${row.pgmNm}' 사용여부가 '${USE_YN_LABEL[value]}'(으)로 변경되었습니다.`))
      setSelectedIds(new Set())
    }

    const handleUseYnAllChange = () => {
      if (!useYnValue) { setUseYnValid(true); return }
      const count = selectedIds.size
      usePgmStore.getState().editPgmUseYn([...selectedIds].map(pgm => ({ pgmCd: pgm, useYn: useYnValue })))
        .then(() => doneToast(`${count}건의 사용여부가 '${USE_YN_LABEL[useYnValue]}'(으)로 변경되었습니다.`))
      setSelectedIds(new Set())
    }

    const handlePgmDelete = () => {
      const count = selectedIds.size
      usePgmStore.getState().deletePgm([...selectedIds].map(pgm => ({ pgmCd: pgm })))
        .then(() => doneToast(`${count}건의 프로그램이 삭제되었습니다.`))
      setSelectedIds(new Set())
    }

    // 원본에서 주석 처리된 '행 추가'(git 기록의 handleAddRow) — 추가 흐름(PGM 코드 검색 모달)을 보여 주려고 살렸다
    const handleAddRow = () => setRows(prev => [
      { id: `pgm-draft-${Date.now()}`, pgmCd: '', pgmNm: '', bdTp: 'MLC', modDtm: '', modId: '', useYn: 'Y', status: 'Y', isDraft: true },
      ...prev,
    ])
    const handleRemoveDraftRow = id => setRows(prev => prev.filter(row => row.id !== id))

    const sortHeader = (key, label) => html`<${SortingButton} label=${label} isActive=${sortState.key === key} direction=${sortState.direction} onClick=${() => handleSort(key)} />`

    const columns = [
      {
        key: 'id', header: '', headerAlign: 'center', align: 'center',
        renderHeader: () => html`<${Checkbox} checked=${allSelected} onChange=${e => toggleSelectAll(e.target.checked)} />`,
        render: row => row.isDraft
          ? html`<${Checkbox} checked=${false} disabled onChange=${() => {}} />`
          : html`<${Checkbox} checked=${selectedIds.has(row.id)} onChange=${e => toggleRow(row.id, e.target.checked)} />`,
      },
      {
        key: 'pgmCd', header: sortHeader('pgmCd', '프로그램 코드'), headerAlign: 'left', align: 'left',
        render: row => row.isDraft
          ? html`<${Button} size="sm" variant="outline" rightIcon=${I.Search} iconSize=${14} className="w-full justify-between" onClick=${() => setIsPgmCodeSearchOpen(true)}>코드 또는 프로그램 명 검색<//>`
          : html`<strong class="text-tx-primary font-semibold">${highlightKoreanKeyword(row.pgmCd, searchPgm)}</strong>`,
      },
      { key: 'pgmNm', header: sortHeader('pgmNm', '프로그램 이름'), headerAlign: 'left', align: 'left', render: row => (row.isDraft ? dash() : highlightKoreanKeyword(row.pgmNm, searchPgm)) },
      { key: 'bdTp', header: sortHeader('bdTp', 'PGM 채널'), headerAlign: 'left', align: 'left', render: row => (row.isDraft ? dash() : html`<${ChannelBadge} type=${row.bdTp} />`) },
      { key: 'modDtm', header: sortHeader('modDtm', '수정일'), headerAlign: 'center', align: 'center', render: row => (row.isDraft ? dash() : formatDate(row.modDtm.replace(' ', 'T'), 'date')) },
      { key: 'modId', header: sortHeader('modId', '사번'), headerAlign: 'center', align: 'center', render: row => (row.isDraft ? dash() : row.modId) },
      {
        key: 'useYn', header: '사용여부', headerAlign: 'center', align: 'center',
        render: row => html`<${Selectbox} size="sm" value=${row.useYn} className="w-24" options=${useYnOptions} disabled=${row.isDraft} onChange=${value => handleRowUseYnChange(row, value)} />`,
      },
      {
        key: 'status', header: '처리', headerAlign: 'center', align: 'center',
        render: row => row.isDraft
          ? html`<${Button} size="sm" variant="iconOnly" leftIcon=${I.X} iconSize=${14} aria-label="추가 행 삭제" onClick=${() => handleRemoveDraftRow(row.id)} />`
          : html`<${StateBadge} useYn=${row.useYn} />`,
      },
    ]

    return html`<div class="sub-page-container sub-page-padding gap-2">
      <div class="bg-bg-surface flex w-full min-w-0 items-center gap-2 px-2 py-3 max-lg:flex-wrap">
        <div class="flex shrink-0 items-center gap-1">
          <${FormLabel} title="PGM 채널" className="text-tx-medium w-16 font-semibold" />
          <${Selectbox} size="sm" value=${pgmChannel} className="w-[100px]" options=${pgmChannelOptions} onChange=${setPgmChannel} />
        </div>
        <div class="flex min-w-0 flex-1 items-center gap-2 max-lg:w-full">
          <${Input} id="input-search" size="sm" className="w-2xs min-w-0 shrink max-lg:w-full max-lg:flex-1" value=${searchPgm}
            placeholder="프로그램코드 또는 프로그램명 검색" showSearchIcon buttonVariant="primary" onChange=${e => setSearchPgm(e.target.value)} />
          <${Button} size="sm" variant="primary" onClick=${initPgm}>초기화<//>

    { ctg: 'LIVING', cd: 'SCENE_RULE', vers: 1, days: 6,

    { ctg: 'FASHION', cd: 'SCENE_RULE', vers: 2, days: 9,
      cnts: '전신 착용 컷, 움직임에서 핏이 드러나는 장면, 소재 클로즈업을 고르게 섞어 선택한다. 같은 색상 장면이 연속되지 않도록 컬러별로 1개 장면을 우선한다.' },
    { ctg: 'TRAVEL', cd: 'CONTEXT', vers: 1, days: 21,
      cnts: '방송 정보와 함께 상품별 출발일, 일정(박/일), 포함·불포함 사항이 주어진다. 요금은 1인 기준이며, 일정표 그래픽이 나오는 시각을 별도 필드로 제공한다.' },
  ]

  // 분석형 섹션 (분석형 시나리오별)
  const ANALS_SEED = {
    SC0011: [
      { cd: 'SIGNAL', nm: '주문 지표 정의', hder: '## ORDER_SIGNAL', vers: 2, days: 2,
        cnts: '분 단위 주문 건수와 직전 5분 평균 대비 증가율이 주어진다. 증가율이 150% 이상인 분을 주문 급증 구간으로 본다. 방송 시작 후 3분 이내 구간은 초기 유입으로 보고 제외한다.' },
      { cd: 'PEAK_MAP', nm: '급증 원인 장면 매핑', hder: '## PEAK_TO_SCENE', vers: 3, days: 4,
        cnts: '주문 급증 구간이 시작되기 직전 60초의 STT·OCR 을 확인해 급증의 원인이 된 멘트나 화면(혜택가 공개, 사은품 추가, 매진 임박 안내 등)을 찾는다. 원인 장면을 시작점으로 10~15초 길이의 하이라이트 후보를 만든다.' },
      { cd: 'SCORE', nm: '후보 점수 산정', hder: '## SCORING', vers: 1, days: 11,
        cnts: '후보마다 주문 증가율(50%), 상품 실물 노출 여부(30%), 멘트 완결성(20%)을 반영해 100점 만점 점수를 매긴다. 70점 미만 후보는 결과에서 제외한다.' },
      { cd: 'OUTPUT', nm: '출력 형식', hder: '## OUTPUT_FORMAT', vers: 1, days: 11,
        cnts: '점수가 높은 순서로 최대 5개 후보를 JSON 배열로 출력한다. 각 원소는 start, end, score, trigger(원인 유형), reason 필드를 가진다.' },
    ],
    SC0012: [
      { cd: 'SIGNAL', nm: '채팅 지표 정의', hder: '## CHAT_SIGNAL', vers: 1, days: 7,
        cnts: '10초 단위 채팅 수와 감정 분류 결과(긍정·질문·부정)가 주어진다. 긍정 채팅 비율이 60% 이상이면서 채팅 수가 방송 평균의 2배 이상인 구간을 반응 피크로 본다.' },
      { cd: 'QNA', nm: '질문 응답 장면', hder: '## QNA_SCENE', vers: 2, days: 7,
        cnts: '사이즈·색상·배송 같은 질문 채팅이 몰린 직후 쇼호스트가 답변하는 구간을 찾는다. 답변이 끝나는 지점까지 포함해 장면을 자른다.' },
      { cd: 'EXCLUDE', nm: '제외 규칙', hder: '## EXCLUSION', vers: 1, days: 13, actvYn: 'N',
        cnts: '이벤트 참여용 반복 채팅(같은 문구 연속 입력)이 대부분인 구간은 피크로 보지 않는다.' },
      { cd: 'OUTPUT', nm: '출력 형식', hder: '## OUTPUT_FORMAT', vers: 1, days: 13,
        cnts: '반응 피크 장면을 시간순으로 최대 6개 출력한다. 각 원소는 start, end, chatCount, positiveRatio, reason 필드를 가진다.' },
    ],
    SC0013: [
      { cd: 'SIGNAL', nm: '시청 지표 정의', hder: '## RETENTION_SIGNAL', vers: 1, days: 15,
        cnts: '분 단위 동시 시청자 수가 주어진다. 직전 구간 대비 시청자 수가 유지되거나 늘어난 연속 구간 중 2분 이상 이어진 구간을 시청 유지 구간으로 본다.' },
      { cd: 'KEY_SCENE', nm: '대표 장면 선택', hder: '## KEY_SCENE', vers: 1, days: 15,
        cnts: '시청 유지 구간마다 상품 시연이나 혜택 설명이 가장 선명한 장면 1개를 고른다.' },
      { cd: 'OUTPUT', nm: '출력 형식', hder: '## OUTPUT_FORMAT', vers: 1, days: 15,
        cnts: '시청 유지 구간별 대표 장면을 JSON 배열로 출력한다. 각 원소는 start, end, viewerDelta, reason 필드를 가진다.' },
    ],
  }

  const db = {
    scenarios: SCENARIO_SEED.map(s => ({
      scenarioId: s.id, scenarioTpVal: s.tp, stdioCtgCd: s.ctg, actvYn: s.actvYn ?? 'Y',
      versions: makeVersions(s.vers, s.days, { scenarioNm: s.nm }, { introContent: s.intro ?? '', bodyContent: s.body ?? '', contrContent: s.contr ?? '', examCnts: s.exam ?? '' }),
    })),
    fixed: { COMMON: Object.fromEntries(FIXED_SECTIONS.map(s => [s.sectionCd, { actvYn: 'Y', versions: makeVersions(s.vers, s.days, {}, { sectionCnts: s.cnts }) }])) },
    anals: Object.fromEntries(Object.entries(ANALS_SEED).map(([id, list]) => [id, list.map((s, i) => ({
      sectionSeq: i + 1, sectionCd: s.cd, sectionNm: s.nm, sectionHderVal: s.hder, actvYn: s.actvYn ?? 'Y',
      versions: makeVersions(s.vers, s.days, {}, { sectionCnts: s.cnts }),
    }))])),
  }
  FIXED_OVERRIDES.forEach(o => {
    (db.fixed[o.ctg] ||= {})[o.cd] = { actvYn: o.actvYn ?? 'Y', versions: makeVersions(o.vers, o.days, {}, { sectionCnts: o.cnts }) }
  })
  const findScenario = id => db.scenarios.find(r => r.scenarioId === id)
  const pushVersion = (rec, data) => { rec.versions.push({ ver: (latest(rec)?.ver ?? 0) + 1, modDtm: Date.now(), ...data }); rec.actvYn = 'Y' }

  /* ---------- stores/highlight/pmpt (scenario·fixed·anals 슬라이스를 한 스토어로) ---------- */
  const usePmptStore = createStore((set, get) => ({
    /** 시나리오 관리 */
    scenarioList: [],
    scenarioDetail: { ...DEFAULT_SCENARIO_DETAIL },
    isLoading: true,
    isLoadingDetail: false,
    getScenarioList: async searchInfo => {
      set({ isLoading: true })
      await sleep(500)
      const keyword = searchInfo.keyword.trim()
      const actvYn = searchInfo.actvYn === 'all' ? '' : searchInfo.actvYn
      const list = db.scenarios
        .filter(r => (!actvYn || r.actvYn === actvYn) && (!keyword || latest(r).scenarioNm.includes(keyword)))
        .map(r => {
          const v = latest(r)
          return { scenarioId: r.scenarioId, scenarioNm: v.scenarioNm, stdioCtgCd: r.stdioCtgCd, stdioCtgNm: ctgNm(r.stdioCtgCd), scenarioTpVal: r.scenarioTpVal,
            actvYn: r.actvYn, verIndexNo: v.ver, versionList: verList(r), modDtm: v.modDtm }
        })
        .sort((a, b) => b.modDtm - a.modDtm)
      set({ scenarioList: list, isLoading: false })
    },
    getScenarioDetail: async (scenarioId, verIndexNo) => {
      if (!scenarioId) return set({ scenarioDetail: { ...DEFAULT_SCENARIO_DETAIL } })
      set({ isLoadingDetail: true })
      await sleep(350)
      const r = findScenario(scenarioId)
      const v = r.versions.find(x => x.ver === verIndexNo) ?? latest(r)
      set({
        scenarioDetail: { scenarioId, scenarioNm: v.scenarioNm, scenarioTpVal: r.scenarioTpVal, stdioCtgCd: r.stdioCtgCd, stdioCtgNm: ctgNm(r.stdioCtgCd),
          introContent: v.introContent, bodyContent: v.bodyContent, contrContent: v.contrContent, examCnts: v.examCnts,
          actvYn: v === latest(r) ? r.actvYn : 'N', verIndexNo: v.ver },
        isLoadingDetail: false,
      })
    },
    setScenarioDetail: detail => set({ scenarioDetail: { ...get().scenarioDetail, ...detail } }),
    createScenario: async data => {
      await sleep(600)
      let r = data.scenarioId && findScenario(data.scenarioId)
      if (!r) {
        const nextNo = Math.max(...db.scenarios.map(x => Number(x.scenarioId.slice(2)))) + 1
        // 탐색형은 서버에서 COMMON 으로 고정된다
        r = { scenarioId: `SC${String(nextNo).padStart(4, '0')}`, scenarioTpVal: data.scenarioTpVal, stdioCtgCd: data.scenarioTpVal === 'EXPLOR' ? 'COMMON' : data.stdioCtgCd, versions: [] }
        db.scenarios.push(r)
      }
      const { scenarioNm, introContent, bodyContent, contrContent, examCnts } = data
      pushVersion(r, { scenarioNm: scenarioNm.trim(), introContent, bodyContent, contrContent, examCnts })
      return true
    },
    disableScenario: async (scenarioId, actvYn) => {
      if (!scenarioId) return false
      await sleep(500)
      findScenario(scenarioId).actvYn = actvYn
      return true
    },

    /** 템플릿형 섹션 관리 */
    categoryList: [],
    fixedList: [],
    fixedDetail: { ...DEFAULT_FIXED_DETAIL },
    isLoadingFixed: true,
    getCategoryList: async () => {
      set({ isLoadingFixed: true })
      await sleep(250)
      const categories = CATEGORIES.map(c => ({ ...c }))
      set({ categoryList: categories })
      return categories
    },
    getFixedList: async stdioCtgCd => {
      if (!stdioCtgCd) return set({ fixedList: [], isLoadingFixed: false })
      await sleep(400)
      const list = FIXED_SECTIONS.map(({ sectionSeq, sectionCd, sectionNm, sectionHderVal }) => {
        const rec = db.fixed[stdioCtgCd]?.[sectionCd]
        return { sectionSeq, sectionCd, sectionNm, sectionHderVal, stdioCtgCd, stdioCtgNm: ctgNm(stdioCtgCd),
          actvYn: rec?.actvYn ?? 'N', verIndexNo: rec ? latest(rec).ver : 0, versionList: rec ? verList(rec) : [], modDtm: rec ? latest(rec).modDtm : 0 }
      })
      set({ fixedList: list, isLoadingFixed: false })
    },
    getFixedDetail: async ({ stdioCtgCd, sectionCd, verIndexNo }) => {
      if (!stdioCtgCd || !sectionCd) return set({ fixedDetail: { ...DEFAULT_FIXED_DETAIL } })
      set({ isLoadingDetail: true })
      await sleep(350)
      const meta = FIXED_SECTIONS.find(s => s.sectionCd === sectionCd)
      const rec = db.fixed[stdioCtgCd]?.[sectionCd]
      const v = rec?.versions.find(x => x.ver === verIndexNo)
      set({
        fixedDetail: { sectionSeq: meta.sectionSeq, sectionCd, sectionNm: meta.sectionNm, stdioCtgCd, stdioCtgNm: ctgNm(stdioCtgCd),
          sectionCnts: v?.sectionCnts || '', actvYn: v && v === latest(rec) ? rec.actvYn : 'N', verIndexNo: v?.ver || 0 },
        isLoadingDetail: false,
      })
    },
    setFixedDetail: detail => set({ fixedDetail: { ...get().fixedDetail, ...detail } }),
    updatedFixed: async ({ sectionCd, stdioCtgCd, sectionCnts }) => {
      await sleep(600)
      const recs = (db.fixed[stdioCtgCd] ||= {})
      pushVersion((recs[sectionCd] ||= { actvYn: 'Y', versions: [] }), { sectionCnts })
      return true
    },
    disabledFixed: async ({ stdioCtgCd, sectionCd, verIndexNo, actvYn }) => {
      if (!stdioCtgCd || !sectionCd || !verIndexNo || !actvYn) return false
      await sleep(500)
      db.fixed[stdioCtgCd][sectionCd].actvYn = actvYn
      return true
    },

    /** 분석형 섹션 관리 */
    analsScenarioList: [],
    analsList: [],
    analsDetail: { ...DEFAULT_ANALS_DETAIL },
    isLoadingAnals: true,
    getAnalsScenarioList: async () => {
      await sleep(250)
      const scenarios = db.scenarios.filter(r => r.scenarioTpVal === 'ANALS').map(r => ({ scenarioId: r.scenarioId, scenarioNm: latest(r).scenarioNm }))
      set({ analsScenarioList: scenarios })
      return scenarios
    },
    getAnalsList: async scenarioId => {
      if (!scenarioId) return set({ analsList: [] })
      set({ isLoadingAnals: true })
      await sleep(400)
      const scenarioNm = latest(findScenario(scenarioId)).scenarioNm
      const list = (db.anals[scenarioId] ?? []).map(s => ({ sectionSeq: s.sectionSeq, sectionCd: s.sectionCd, sectionNm: s.sectionNm, scenarioId, scenarioNm,
        sectionHderVal: s.sectionHderVal, actvYn: s.actvYn, verIndexNo: latest(s).ver, versionList: verList(s), modDtm: latest(s).modDtm }))
      set({ analsList: list, isLoadingAnals: false })
    },
    getAnalsDetail: async ({ scenarioId, sectionCd, verIndexNo }) => {
      if (!sectionCd) return set({ analsDetail: { ...DEFAULT_ANALS_DETAIL } })
      set({ isLoadingDetail: true })
      await sleep(350)
      const s = db.anals[scenarioId].find(x => x.sectionCd === sectionCd)
      const v = s.versions.find(x => x.ver === verIndexNo) ?? latest(s)
      set({
        analsDetail: { sectionCd, sectionSeq: s.sectionSeq, sectionNm: s.sectionNm, scenarioId, scenarioNm: latest(findScenario(scenarioId)).scenarioNm,
          sectionCnts: v.sectionCnts, actvYn: v === latest(s) ? s.actvYn : 'N', verIndexNo: v.ver },
        isLoadingDetail: false,
      })
    },
    setAnalsDetail: detail => set({ analsDetail: { ...get().analsDetail, ...detail } }),
    updatedAnals: async ({ scenarioId, sectionCd, sectionCnts }) => {
      await sleep(600)
      pushVersion(db.anals[scenarioId].find(x => x.sectionCd === sectionCd), { sectionCnts })
      return true
    },
    disabledAnals: async ({ scenarioId, sectionCd, verIndexNo, actvYn }) => {
      if (!scenarioId || !sectionCd || !verIndexNo || !actvYn) return false
      await sleep(500)
      db.anals[scenarioId].find(x => x.sectionCd === sectionCd).actvYn = actvYn
      return true
    },
  }))

  /* ---------- 공통 조각 ---------- */
  // table 스켈레톤 (세 섹션이 셀 폭만 다르다)
  const TableSkeleton = ({ widths }) => html`
    <tr className="bg-bg-white border-bd-subtle animate-pulse border-b text-sm">
      ${widths.map((w, i) => html`<td key=${i} className=${i === 0 ? 'flex px-2.5 py-2 text-center' : 'px-2.5 py-2 text-center'}>
        <${Skeleton} variant="text" className=${`mx-auto h-4.5 ${w} rounded`} />
      </td>`)}
    </tr>`
  const skeletonRows = widths => Array.from({ length: 10 }, (_, idx) => html`<${TableSkeleton} key=${`skeleton-${idx}`} widths=${widths} />`)
  const emptyState = () => html`<${EmptyState} icon=${I.Search} title="조건에 맞는 데이터가 없습니다" height="h-[310px]" />`
  const SECTION_COL_GROUP = [{ width: '10%' }, { width: '15%' }, { width: '25%' }, { width: '25%' }, { width: '10%' }, { width: '15%' }, { width: '10%' }]
  const SECTION_SKELETON = ['w-10', 'w-15', 'w-25', 'w-25', 'w-10', 'w-15', 'w-10']

  const SAVE_CONFIRM_DESC = () => html`저장 시 <span className="text-tx-primary">운영 환경에 즉시 반영</span>됩니다.<br />신규 버전이 생성되고 직전 버전은 비활성 처리됩니다.<br />진행하시겠습니까?`
  const toastSaved = description => toast({ color: 'green', icon: I.CircleCheckBig, title: '저장 완료', description })
  const toastSaveFail = () => toast({ color: 'red', icon: I.Ban, title: '저장 실패', description: '저장 중 오류가 발생했습니다. 다시 시도해주세요.' })
  const toastDisableFail = () => toast({ color: 'red', icon: I.Ban, title: '비활성화 실패', description: '비활성화 처리 중 오류가 발생했습니다. 다시 시도해주세요.' })

  const InfoField = ({ title, width = 'w-20', bold = true, children }) => html`
    <div className=${cn('flex flex-col gap-1', width)}>
      <${FormLabel} title=${title} />
      <div className="flex h-8 items-center"><p className=${cn('text-13 text-tx-strong', bold && 'font-bold')}>${children}</p></div>
    </div>`
  const ActiveField = ({ actvYn }) => html`
    <div className="flex w-20 flex-col gap-1">
      <${FormLabel} title="활성 여부" />
      <div className="flex h-8 items-center">
        <${Badge} variant=${actvYn === 'Y' ? 'green' : 'gray'} shape="rounded">${actvYn === 'Y' ? '활성' : '비활성'}<//>
      </div>
    </div>`
  const DetailLoading = () => html`
    <div className="z-loading bg-bg-muted/80 absolute inset-0 flex h-full items-center justify-center"><${LoadingSpinner} /></div>`
  const versionLabel = (item, selectedItem) => `v${item} ${selectedItem.verIndexNo === item && selectedItem.actvYn === 'Y' ? '(활성)' : ''}`

  /* ---------- modal/ScenarioModal.tsx ---------- */
  function ScenarioModal({ type, selectedItem, isOpen, onClose, onSuccess }) {
    const categoryList = usePmptStore(s => s.categoryList)
    const scenarioDetail = usePmptStore(s => s.scenarioDetail)
    const isLoadingDetail = usePmptStore(s => s.isLoadingDetail)
    const { setScenarioDetail, getScenarioDetail, createScenario, disableScenario } = usePmptStore.getState()

    const [isValidate, setIsValidate] = useState(false)
    const [isSubmitting, setIsSubmitting] = useState(false)
    const [ctgValue, setCtgValue] = useState(categoryList[0]?.stdioCtgCd || '')
    const { open: openConfirm, close: closeConfirm, alertProps } = useAlert()

    useEffect(() => {
      if (selectedItem?.scenarioId) {
        getScenarioDetail(selectedItem.scenarioId, selectedItem.verIndexNo) // 시나리오 상세 조회
        setCtgValue(selectedItem.stdioCtgCd) // 카테고리 선택
      }
      return () => setScenarioDetail({ ...DEFAULT_SCENARIO_DETAIL })
    }, [selectedItem])

    /** 시나리오 유형 */
    const scenarioType = (scenarioDetail.scenarioTpVal || selectedItem?.scenarioTpVal || type).toUpperCase()
    const isFixed = scenarioType === 'FIXED'
    const versionOptions = selectedItem?.versionList.map(item => ({ label: versionLabel(item, selectedItem), value: item }))
    const categoryOptions = categoryList.map(item => ({ label: `${item.stdioCtgCd}·${item.stdioCtgNm}`, value: item.stdioCtgCd }))

    /** 시나리오 프롬프트 버전 생성 */
    const onPromptSave = async () => {
      const selectedCategory = categoryList.find(item => item.stdioCtgCd === ctgValue)
      const { scenarioId, scenarioNm, introContent, bodyContent, contrContent, examCnts } = scenarioDetail
      setIsSubmitting(true)
      try {
        const isSuccess = await createScenario({
          scenarioId, scenarioNm, scenarioTpVal: scenarioType,
          stdioCtgCd: isFixed ? (selectedCategory?.stdioCtgCd ?? ctgValue) : ctgValue,
          stdioCtgNm: isFixed ? (selectedCategory?.stdioCtgNm ?? '') : '',
          introContent: introContent ? introContent.trim() : '',
          bodyContent: bodyContent ? bodyContent.trim() : '',
          contrContent: contrContent ? contrContent.trim() : '',
          examCnts: examCnts ? examCnts.trim() : '',
        })
        if (isSuccess) {
          toastSaved(scenarioId ? '신규 버전이 생성되어 운영 환경에 반영되었습니다.' : '신규 시나리오가 등록되어 운영 환경에 반영되었습니다.')
          onSuccess()
        }
      } catch {
        toastSaveFail()
      } finally {
        closeConfirm()
        setIsSubmitting(false)
      }
    }

    const onSaveConfirm = () => {
      const { scenarioNm, introContent, bodyContent, contrContent, examCnts } = scenarioDetail
      // 원본은 scenarioDetail.scenarioTpVal 로 검사해 신규 등록 때(값이 비어 있음) 본문 검증이 빠진다 → 화면 유형으로 검사
      if (!scenarioNm.trim()
        || (scenarioType === 'FIXED' && (!introContent.trim() || !bodyContent.trim() || !contrContent.trim()))
        || (scenarioType === 'EXPLOR' && !examCnts.trim())) {
        setIsValidate(true)
        return
      }
      openConfirm({
        variant: 'info',
        title: '운영 환경 반영 확인',
        description: SAVE_CONFIRM_DESC(),
        buttons: [
          { label: '취소', variant: 'outline', onClick: closeConfirm },
          { label: '저장', variant: 'primary', onClick: onPromptSave },

      })
    }

    /** 시나리오 비활성화 */
    const onScenarioDisabled = async () => {
      setIsSubmitting(true)
      try {
        const isSuccess = await disableScenario(scenarioDetail.scenarioId, scenarioDetail.actvYn === 'Y' ? 'N' : 'Y')
        if (isSuccess) {
          toast({ color: 'green', icon: I.CircleCheckBig, title: '비활성화 완료', description: '비활성화되어 운영 환경에서 제외되었습니다.' })

        }
      } catch {
        toastDisableFail()
      } finally {
        closeConfirm()
        setIsSubmitting(false)
      }
    }

    /** 시나리오 비활성화 확인 창 */
    const onDisabledConfirm = () => openConfirm({
      variant: 'info',
      title: '운영 환경 반영 확인',
      description: html`비활성화 시 <span className="text-tx-primary">운영 환경에 즉시 반영</span>됩니다.<br />이 시나리오의 프롬프트가 운영에서 제외됩니다.<br />진행하시겠습니까?`,
      buttons: [
