<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라이브 시청 화면 미리보기</title>
<!--
  포트폴리오용 정적 미리보기 (더미 데이터).
  - 이 파일 하나로 동작한다. Tailwind(Play CDN)·글꼴(Noto Sans KR)·아이콘(Phosphor)만 CDN 에서 받는다.
  - 서비스명·로고·도메인은 쓰지 않았다. 채팅·참여자 수·공지는 전부 가상 데이터다.
  - 쿼리스트링 darkmode 값이 true 면 다크 모드로 시작한다.
  - 샘플 영상: Big Buck Bunny (c) Blender Foundation, CC BY 3.0 — https://peach.blender.org
  - 아이콘: Phosphor Icons (MIT License)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script>
  // 다크 모드 선적용 — 쿼리스트링 darkmode 값이 true 면 그리기 전에 dark 클래스를 붙인다.
  try { if (new URLSearchParams(location.search).get('darkmode') === 'true') document.documentElement.classList.add('dark') } catch (e) {}
</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          ink: '#121212',
          line: '#DDDDDD',
          pale: '#EDEDED',
          'icon-muted': '#919191',
          dim: '#2F2F2F',
          'live-red': '#ff101f',
          'chat-hide-text': '#28180B',
          'chat-tab-text': '#666666',
          'chat-tab-active': '#F20000',
          'blue-pin': '#3f7bff',
          'dark-bg': '#181b2d',
          'dark-surface': '#2b3049',
          'dark-track': '#3c4160',
        },
        fontSize: {
          'chat-xs': ['0.6rem', '0.8rem'],
          'chat-sm': ['0.7rem', '1rem'],
          'chat-base': ['0.8rem', '1.2rem'],
          'chat-lg': ['0.9rem', '1.4rem'],
        },
        boxShadow: {
          'emoji-panel': '0 -2px 10px rgba(0,0,0,.08)',
        },
      },
    },
  }
</script>
<style>
  html, body { height: 100%; }
  html { background-color: #ffffff; }
  html.dark { background-color: #181b2d; }
  .h-screen-dyn { height: 100vh; height: 100dvh; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background-color: rgba(140, 140, 150, .5); border-radius: 9999px; }
  * { scrollbar-color: rgba(140, 140, 150, .5) transparent; }
  body { margin: 0; font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }

  /* 좋아요 하트 — 버튼 위에서 퍼지며 떠올라 사라진다. */
  @keyframes heart-float-up {
    0% { opacity: 0; transform: translateY(0) translateX(var(--dx)) scale(1); }
    8% { opacity: .8; }
    60% { opacity: .4; }
    100% { opacity: 0; transform: translateY(-120px) translateX(calc(var(--dx) * 1.5)) scale(.4); }
  }
  .heart-float {
    position: absolute; bottom: 100%; left: 50%; z-index: 50; pointer-events: none; line-height: 1;
    animation: heart-float-up var(--duration, 1.2s) ease-out both; will-change: transform, opacity;
  }
  /* 플레이어 아이콘 — SVG 를 마스크로 깔고 글자색(currentColor)으로 칠한다. */
  .mask-icon { display: block; background: currentColor; -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
</style>
</head>
<body>

<!-- 화면 루트 — 데스크톱은 가로 [플레이어 | 채팅], 모바일은 세로 [플레이어 / 채팅]. -->
<div class="relative flex h-screen-dyn flex-col bg-white dark:bg-dark-bg lg:flex-row">

  <!-- ===== 플레이어 컬럼 ===== -->
  <div class="relative flex min-w-0 flex-col bg-[#f6f6f6] p-3 pb-8 dark:bg-dark-bg max-lg:shrink-0 lg:flex-1 lg:px-5 lg:py-4">
    <div class="overflow-hidden lg:grid lg:min-h-0 lg:flex-1 lg:grid-rows-[minmax(0,1fr)] lg:place-items-center">
      <div class="flex w-full min-w-0 flex-col gap-3 lg:h-full lg:max-w-[1190px] lg:gap-4">

        <!-- 헤더바 — 과목 · 학년 · 제목 / 우측 LIVE 패널 + 하단 레드 라인 -->
        <div id="liveHeader" class="mt-5 flex max-w-[calc(100%-24px)] shrink-0 items-center gap-2.5 border-b-[3px] border-live-red pb-2 tracking-tighter [@media(max-height:500px)]:hidden">
          <i class="ph-fill ph-book-open-text shrink-0 text-[18px] text-live-red lg:text-[28px]"></i>
          <span class="shrink-0 text-lg font-extrabold text-[#f3000c] lg:text-[28px]">수학</span>
          <span class="mx-1 h-5 w-[3px] shrink-0 rounded-sm bg-[#b5b5b5] dark:bg-gray-600"></span>
          <span class="shrink-0 text-base font-bold text-[#656565] dark:text-gray-400 lg:text-2xl">중2학년</span>
          <span class="mx-1 h-5 w-[3px] shrink-0 rounded-sm bg-[#b5b5b5] dark:bg-gray-600"></span>
          <span class="truncate text-base font-extrabold text-[#080808] dark:text-white lg:text-2xl">일차함수와 그래프 완전 정복</span>

          <div class="-mb-[11px] ml-auto mr-[-22px] flex shrink-0 self-stretch pl-20 max-lg:hidden">
            <div class="relative flex items-center gap-2.5 whitespace-nowrap rounded-r-full bg-live-red pl-14 pr-5 text-lg tracking-normal text-white">
              <span aria-hidden="true" class="absolute inset-y-0 -left-[54px] h-[calc(100%-3px)] w-[50px] origin-bottom -skew-x-[43deg] bg-[#ffc7c9]"></span>
              <span aria-hidden="true" class="absolute inset-y-0 -left-[17px] h-[calc(100%-3px)] w-[42px] origin-bottom -skew-x-[43deg] bg-[#ff777d]"></span>
              <span class="relative flex items-center gap-1.5 pl-5 font-extrabold">
                <span class="size-2.5 rounded-full bg-white"></span>LIVE
              </span>
              <span class="relative h-4 w-[3px] bg-white/55"></span>
              <span class="relative flex items-center gap-1.5 font-bold">
                <i class="ph-fill ph-user text-[0.85em]"></i>
                <span data-count>0</span><span class="text-[0.63em]">명</span>
              </span>
            </div>
          </div>
        </div>

        <!-- 영상 — 모바일은 폭 기준 16:9, 데스크톱은 남은 높이 기준 16:9 -->
        <div class="flex items-center justify-center lg:min-h-0 lg:flex-1">
          <div class="relative aspect-[16/9] w-full max-w-full overflow-hidden rounded-2xl bg-black lg:h-full lg:w-auto">
            <video id="video" class="absolute inset-0 h-full w-full object-contain" autoplay muted loop playsinline preload="auto"
              src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
            <!-- 영상 로드 실패 시 대체 화면 -->
            <div id="videoFallback" class="absolute inset-0 hidden place-items-center bg-gradient-to-br from-[#2b2f42] to-[#181b2d] text-center text-white">
              <div><i class="ph-fill ph-play-circle text-5xl opacity-70"></i><p class="mt-2 text-sm opacity-70">샘플 영상</p></div>
            </div>
            <span class="pointer-events-none absolute bottom-1.5 right-2.5 text-[10px] text-white/50">Big Buck Bunny © Blender Foundation · CC BY</span>
          </div>
        </div>

        <!-- 커스텀 컨트롤 — 모바일·저높이 시 숨김(모바일은 영상 기본 컨트롤) -->
        <div class="max-lg:hidden [@media(max-height:500px)]:hidden">
          <div id="controls" class="mb-[30px] mt-[-20px] shrink-0 px-1 pt-4">
            <!-- 진행바 — 라이브는 끝(100%) 고정 -->
            <div class="relative h-2 w-full">
              <div class="absolute inset-0 overflow-hidden rounded-full bg-[#e9e9e9] dark:bg-dark-track">
                <div class="h-full w-full rounded-full bg-live-red"></div>
              </div>
            </div>

            <div class="mt-4 flex items-center gap-3 text-[#111] dark:text-gray-100">
              <button id="playBtn" type="button" aria-label="일시정지" class="grid h-14 w-14 place-items-center rounded-full bg-white shadow-sm dark:bg-dark-surface">
                <span data-icon="pause" class="mask-icon h-full w-full"></span>
              </button>

              <!-- 볼륨 — 원형 버튼이 hover 시 알약으로 늘어난다 -->
              <div class="group flex h-14 w-14 shrink-0 items-center overflow-hidden rounded-full bg-[#efefef] shadow-sm transition-[width] duration-200 ease-out hover:w-44 dark:bg-dark-track">
                <button id="muteBtn" type="button" aria-label="음소거 해제" class="grid h-14 w-14 shrink-0 place-items-center rounded-full bg-white shadow-sm dark:bg-dark-surface">
                  <span data-icon="volume-mute" class="mask-icon h-full w-full"></span>
                </button>
                <div class="flex flex-1 items-center pl-3 pr-5 opacity-0 transition-opacity duration-150 group-hover:opacity-100">
                  <div class="relative h-2.5 w-full">
                    <div class="absolute inset-x-0 top-1/2 h-1.5 -translate-y-1/2 rounded-full bg-[#cdcdcd] dark:bg-white/25"></div>
                    <input id="volume" type="range" min="0" max="1" step="0.01" value="0" aria-label="볼륨"
                      class="absolute inset-0 h-full w-full cursor-pointer appearance-none bg-transparent [&::-moz-range-thumb]:h-4 [&::-moz-range-thumb]:w-4 [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:border-0 [&::-moz-range-thumb]:bg-white [&::-moz-range-thumb]:shadow-[0_1px_3px_rgba(0,0,0,0.35)] [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-white [&::-webkit-slider-thumb]:shadow-[0_1px_3px_rgba(0,0,0,0.35)]">
                  </div>
                </div>
              </div>

              <!-- 방송 경과 시간 -->
              <div class="flex items-center gap-2 rounded-full bg-white px-5 py-3 shadow-sm dark:bg-dark-surface">
                <span data-icon="clock" class="mask-icon h-7 w-7 text-[#242c40] dark:text-gray-100"></span>
                <span id="elapsed" class="text-lg font-medium tabular-nums">00:00:00</span>
              </div>

              <!-- 다크/라이트 토글 -->
              <button id="themeBtn" type="button" aria-label="다크 모드로 전환" class="ml-auto grid h-14 w-14 place-items-center rounded-full bg-white shadow-sm dark:bg-dark-surface">
                <span data-icon="moon" class="mask-icon h-full w-full text-[#242c40] dark:text-gray-100"></span>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ===== 채팅 컬럼 — 접으면 폭이 0 으로 줄어든다 ===== -->
  <div id="chatCol" class="overflow-hidden bg-white pb-8 dark:bg-[#242c40] max-lg:min-h-0 max-lg:w-full max-lg:flex-1 lg:shrink-0 lg:transition-[width] lg:duration-300 lg:ease-in-out w-[320px] min-w-[320px] xl:w-[380px] xl:min-w-[380px] 2xl:w-[clamp(360px,24vw,400px)] 2xl:min-w-[360px] 2xl:max-w-[400px]">
    <div class="h-full w-full w-[320px] min-w-[320px] max-lg:w-full max-lg:min-w-0 xl:w-[380px] xl:min-w-[380px] 2xl:w-[clamp(360px,24vw,400px)] 2xl:min-w-[360px] 2xl:max-w-[400px]">
      <aside class="relative flex h-full w-full flex-col overflow-hidden">

        <!-- 채팅 헤더 — 데스크톱 2줄 / 모바일 1줄 -->
        <div class="shrink-0 px-6 pb-3 pt-4">
          <div class="flex items-center gap-2">
            <span class="whitespace-nowrap rounded-full bg-white px-2.5 py-1 text-chat-xs font-medium text-gray-900 dark:bg-dark-surface dark:text-gray-100 lg:hidden">
              <span class="mr-1 text-green-300">●</span><span data-count>0</span>명 참여
            </span>
            <div class="ml-auto flex items-center">
              <button id="leaveBtn" type="button" class="flex shrink-0 items-center gap-1 whitespace-nowrap rounded-full border border-line bg-white px-2 py-1.5 text-xs font-medium leading-none text-ink dark:border-white/10 dark:bg-dark-surface dark:text-gray-100 max-lg:hidden">
                라이브 나가기 <i class="ph-bold ph-x text-[11px]" aria-hidden="true"></i>
              </button>
              <div class="lg:hidden" data-tabs></div>
            </div>
          </div>
          <div class="mt-4 flex items-center gap-2 max-lg:hidden">
            <div data-tabs></div>
            <button id="hideChatBtn" type="button" class="ml-auto shrink-0 whitespace-nowrap text-xs font-medium text-chat-hide-text underline underline-offset-2 dark:text-white">채팅 숨기기</button>
          </div>
        </div>

        <!-- 채팅 본문 — 공지 + 메시지 목록 + 하트 -->
        <div class="relative flex min-h-0 flex-1 flex-col">
          <!-- 공지 카드 — 펼친 채로 시작해 5초 뒤 한 줄로 접힌다 -->
          <div id="notice" class="mx-6 mb-1 shrink-0 cursor-pointer overflow-hidden rounded-2xl bg-[rgb(251,43,44)] p-4 text-white [@media(max-height:500px)]:hidden">
            <div class="flex items-center gap-2">
              <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white text-lg text-live-red"><i class="ph-fill ph-chalkboard-teacher"></i></span>
              <span id="noticeName" class="max-w-[60%] shrink-0 overflow-hidden whitespace-nowrap rounded-md bg-white/20 px-2 py-0.5 text-chat-sm font-bold text-white opacity-100 transition-all duration-200 lg:text-chat-base">하늘 선생님</span>
              <p id="noticeLine" class="line-clamp-1 max-w-0 flex-none whitespace-normal text-chat-sm font-medium opacity-0 transition-all duration-200 lg:text-chat-base"></p>
              <button id="noticeClose" type="button" aria-label="공지 닫기" class="ml-auto shrink-0 text-white"><i class="ph-bold ph-x text-[13px]"></i></button>
            </div>
            <div id="noticeBody" class="mt-2 grid grid-rows-[1fr] opacity-100 transition-all duration-200">
              <p id="noticeText" class="overflow-hidden whitespace-pre-line pl-10 text-chat-sm font-medium leading-relaxed lg:text-chat-base"></p>
            </div>
          </div>

          <div class="relative min-h-0 flex-1 pb-2">
            <div id="list" class="h-full overflow-y-auto [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-[#cdcdcd] [&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar]:w-[5px] [&::-webkit-scrollbar]:bg-transparent"></div>
            <button id="unreadToast" type="button" class="absolute bottom-3 left-1/2 z-10 hidden -translate-x-1/2 whitespace-nowrap rounded-full bg-[#292929]/90 px-4 py-2 text-[12px] font-bold text-white shadow-[0_2px_8px_rgba(0,0,0,0.25)] dark:bg-dark-track [@media(max-height:500px)]:!hidden">새 메시지 보기 ↓</button>
            <div id="likeWrap" class="absolute bottom-6 right-5 [@media(max-height:500px)]:hidden">
              <button id="likeBtn" type="button" aria-label="좋아요" class="grid h-10 w-10 place-items-center rounded-full bg-[#f0f0f0]/45 text-[#1a1a1a] transition-transform active:scale-90 dark:bg-dark-surface/45 dark:text-white">
                <i class="ph-bold ph-heart text-2xl"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- 입력창 -->
        <div class="relative shrink-0 border-t border-[#e5e5e5] bg-white p-3 dark:border-white/10 dark:bg-[#242c40] lg:px-[21px] lg:py-5">
          <!-- 이모티콘 선택창 — 입력창 위, 채팅 영역 전체 폭. 한 번 탭은 미리보기, 더블탭은 바로 전송 -->
          <div id="emojiPicker" data-emoji-keep class="absolute inset-x-0 bottom-full z-20 hidden">
            <div class="flex h-[306px] w-full flex-col overflow-hidden rounded-t-[25px] border-b border-line bg-white pt-3 shadow-emoji-panel dark:border-white/10 dark:bg-dark-surface">
              <div class="flex h-[22px] shrink-0 items-center justify-between px-[30px]">
                <h3 class="text-[15px] font-bold leading-[22px] text-ink dark:text-gray-100">이모티콘</h3>
                <button id="emojiClose" type="button" aria-label="이모티콘 닫기" tabindex="-1" class="-m-1 p-1 text-icon-muted dark:text-gray-400"><i class="ph ph-x text-xl"></i></button>
              </div>
              <div id="emojiTabs" tabindex="-1" class="flex shrink-0 gap-2.5 overflow-x-auto border-b border-line px-[30px] py-2 [scrollbar-width:none] dark:border-white/10 [&::-webkit-scrollbar]:hidden"></div>
              <div id="emojiGrid" tabindex="-1" class="grid min-h-0 flex-1 overflow-y-auto px-[30px]"
                style="grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: calc((100% + 20px - 9px) / 2.5); gap: 6px; padding-top: 20px; padding-bottom: 20px;"></div>
            </div>
          </div>
          <!-- 이모티콘 미리보기 — 입력창 위 가운데, X 로만 닫힌다 -->
          <div id="emojiPreview" class="absolute bottom-full left-1/2 z-20 mb-[10px] hidden -translate-x-1/2">
            <div class="relative h-[146px] w-[202px] rounded-3xl bg-dim/80 p-4 backdrop-blur-sm dark:bg-dark-track/90">
              <button id="emojiPreviewClose" type="button" aria-label="미리보기 닫기" tabindex="-1" class="absolute right-2 top-2 grid h-8 w-8 place-items-center text-pale"><i class="ph-bold ph-x text-[21px]"></i></button>
              <span id="emojiPreviewChar" class="pointer-events-none grid h-full place-items-center text-[80px] leading-none"></span>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="flex min-w-0 flex-1 items-center gap-2 rounded-full bg-[#f0f0f0] px-4 py-2.5 dark:bg-dark-surface lg:px-5 lg:py-[11px]">
              <textarea id="input" data-emoji-keep rows="1" maxlength="100" placeholder="내용을 입력해주세요."
                class="block min-w-0 flex-1 resize-none bg-transparent text-[12px] leading-[18px] text-gray-800 outline-none [scrollbar-width:none] placeholder:text-[#a8a8a8] disabled:opacity-60 dark:text-gray-100 lg:text-[14px] lg:leading-[20px] [&::-webkit-scrollbar]:hidden"></textarea>
              <button id="emojiBtn" data-emoji-keep type="button" aria-label="이모티콘" tabindex="-1" class="shrink-0 text-[#a8a8a8] disabled:opacity-50">
                <i class="ph ph-smiley text-[22px]"></i>
              </button>
            </div>
            <button id="sendBtn" type="button" aria-label="보내기" disabled class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-live-red text-white disabled:opacity-50">
              <i class="ph-fill ph-paper-plane-right text-xl"></i>
            </button>
          </div>
        </div>

      </aside>
    </div>
  </div>

  <!-- 채팅 펼치기 — 채팅이 접혔을 때 데스크톱에서만 -->
  <button id="expandBtn" type="button" aria-label="채팅 펼치기" class="absolute right-0 top-1/2 z-[10000] hidden -translate-y-1/2 flex-col items-center gap-1 rounded-l-2xl bg-white px-3 py-3 text-gray-800 shadow-lg dark:bg-dark-surface dark:text-gray-100 max-lg:!hidden">
    <span aria-hidden="true" class="absolute right-full top-1/2 h-0 w-0 -translate-y-1/2 border-y-8 border-r-8 border-y-transparent border-r-live-red"></span>
    <svg class="h-6 w-auto dark:invert" viewBox="0 0 96 80" fill="none" aria-hidden="true">
      <path d="M51 32H82C87 32 90 35 90 40V60C90 65 87 68 82 68H78V75L68 68H51C46 68 43 65 43 60V40C43 35 46 32 51 32Z" fill="#1F1F1F"/>
      <path d="M22 16H65C70 16 73 19.5 73 24V50C73 54.5 70 58 65 58H41L29 67V58H22C17 58 14 54.5 14 50V24C14 19.5 17 16 22 16Z" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="3.5" stroke-linejoin="round"/>
    </svg>
    <span class="text-sm font-bold">채팅열기</span>
  </button>

  <!-- 종료 화면 — 창을 닫을 수 없을 때 화면 전체를 덮는다 -->
  <div id="closedScreen" class="absolute inset-0 z-[10001] hidden place-items-center bg-white text-center dark:bg-dark-bg">
    <div>
      <p class="text-xl font-bold text-gray-900 dark:text-gray-100">학습이 종료되었습니다.</p>
      <p class="mt-2 text-gray-500 dark:text-gray-400">창을 닫아 주세요.</p>
      <button id="reenterBtn" type="button" class="mt-6 rounded-full bg-live-red px-5 py-2 text-sm font-bold text-white">다시 입장하기</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id)

  // ───────── 플레이어 아이콘(마스크용 SVG) ─────────
  const ICONS = {
    play: `<svg xmlns='http://www.w3.org/2000/svg' viewBox='117 50 50 50'><path d='M152.575 73.643C153.221 74.0316 153.221 74.9683 152.575 75.3569L137.515 84.4139C136.849 84.8147 136 84.3347 136 83.5569L136 65.443C136 64.6652 136.849 64.1852 137.515 64.586L152.575 73.643Z'/></svg>`,
    pause: `<svg xmlns='http://www.w3.org/2000/svg' viewBox='347 50 50 50'><path d='M367.979 64.2655H365.455C364.393 64.2655 363.531 65.1269 363.531 66.1894V83.811C363.531 84.8736 364.393 85.7349 365.455 85.7349H367.979C369.041 85.7349 369.902 84.8736 369.902 83.811V66.1894C369.902 65.1269 369.041 64.2655 367.979 64.2655Z'/><path d='M378.545 64.2655H376.021C374.959 64.2655 374.098 65.1269 374.098 66.1894V83.811C374.098 84.8736 374.959 85.7349 376.021 85.7349H378.545C379.607 85.7349 380.469 84.8736 380.469 83.811V66.1894C380.469 65.1269 379.607 64.2655 378.545 64.2655Z'/></svg>`,
    'volume-high': `<svg xmlns='http://www.w3.org/2000/svg' viewBox='177 50 50 50'><path d='M205.74 63.0455C205.74 62.1376 204.655 61.6632 203.982 62.2751L197.869 67.8377V67.7372H191.049C190.469 67.7372 190 68.204 190 68.7808V81.2182C190 81.7951 190.469 82.2618 191.049 82.2618H197.87V82.1613L203.983 87.7239C204.656 88.3368 205.741 87.8615 205.741 86.9535L205.74 63.0455Z'/><path d='M210.188 80.8093C209.878 80.8093 209.569 80.6897 209.335 80.4525C208.875 79.9839 208.883 79.2334 209.354 78.7751C210.53 77.6328 211.151 76.3273 211.151 75C211.151 73.6727 210.53 72.3681 209.354 71.2248C208.883 70.7666 208.876 70.0161 209.335 69.5474C209.796 69.0787 210.551 69.0711 211.022 69.5284C212.667 71.1271 213.536 73.019 213.536 74.999C213.536 76.9791 212.667 78.871 211.022 80.4696C210.79 80.6954 210.489 80.8074 210.188 80.8074V80.8093Z'/><path d='M213.498 82.9231C213.164 82.9231 212.831 82.7837 212.594 82.5114C212.165 82.0152 212.22 81.2666 212.719 80.8387C214.586 79.2391 215.614 77.166 215.614 75C215.614 72.834 214.586 70.7609 212.719 69.1613C212.22 68.7343 212.164 67.9848 212.594 67.4886C213.024 66.9924 213.777 66.9364 214.276 67.3643C216.677 69.4212 217.999 72.1328 217.999 75C217.999 77.8672 216.677 80.5787 214.276 82.6357C214.051 82.8283 213.774 82.9231 213.498 82.9231Z'/></svg>`,
    'volume-mute': `<svg xmlns='http://www.w3.org/2000/svg' viewBox='407 50 50 50'><path d='M435.74 63.0455C435.74 62.1376 434.655 61.6632 433.982 62.2751L427.869 67.8377V67.7372H421.049C420.469 67.7372 420 68.204 420 68.7808V81.2182C420 81.7951 420.469 82.2618 421.049 82.2618H427.87V82.1613L433.983 87.7239C434.656 88.3368 435.741 87.8615 435.741 86.9535L435.74 63.0455Z'/><path d='M442.424 74.1952L444.838 71.7809C445.06 71.5588 445.42 71.5588 445.642 71.7809C445.865 72.0031 445.865 72.3633 445.642 72.5855L443.228 74.9998L445.642 77.414C445.865 77.6362 445.865 77.9964 445.642 78.2186C445.42 78.4407 445.06 78.4407 444.838 78.2186L442.424 75.8043L440.009 78.2186C439.787 78.4407 439.427 78.4407 439.205 78.2186C438.983 77.9964 438.983 77.6362 439.205 77.414L441.619 74.9998L439.205 72.5855C438.983 72.3633 438.983 72.0031 439.205 71.7809C439.427 71.5588 439.787 71.5588 440.009 71.7809L442.424 74.1952Z' stroke='black'/></svg>`,
    clock: `<svg xmlns='http://www.w3.org/2000/svg' viewBox='480 60 30 30'><circle cx='495' cy='75' r='13' fill='none' stroke='black' stroke-width='2'/><path d='M495 68C495 71.1242 495 76 495 76H501' stroke='black' stroke-width='2' stroke-linecap='round' fill='none'/></svg>`,
    moon: `<svg xmlns='http://www.w3.org/2000/svg' viewBox='982 55 50 50'><path d='M1018 83.3378C1016.17 87.2712 1012.17 90 1007.53 90C1001.16 89.9987 996 84.8516 996 78.5011C996 73.8216 998.805 69.7949 1002.83 68C1002.83 68 1001.17 83.8296 1018 83.3378Z'/></svg>`,
    sun: `<svg xmlns='http://www.w3.org/2000/svg' viewBox='913 57 50 50' stroke='black' stroke-width='1.55625' stroke-linecap='round'><path stroke='none' d='M938 89.7812C942.298 89.7812 945.781 86.2974 945.781 82C945.781 77.7025 942.298 74.2188 938 74.2188C933.703 74.2188 930.219 77.7025 930.219 82C930.219 86.2974 933.703 89.7812 938 89.7812Z'/><path d='M938 70.6269V68.7781M929.957 73.9573L928.65 72.65M926.627 82H924.778M929.957 90.0427L928.65 91.35M938 93.373V95.2219M946.042 90.0427L947.35 91.35M949.373 82H951.222M946.042 73.9573L947.35 72.65'/></svg>`,
  }
  /** 마스크 아이콘 요소에 아이콘을 입힌다. */
  const setIcon = (el, name) => {
    el.dataset.icon = name
    el.style.setProperty('--icon', `url("data:image/svg+xml,${encodeURIComponent(ICONS[name])}")`)
  }
  document.querySelectorAll('[data-icon]').forEach((el) => setIcon(el, el.dataset.icon))

  // ───────── 플레이어 ─────────
  const video = $('video')
  const playIcon = $('playBtn').querySelector('[data-icon]')
  const muteIcon = $('muteBtn').querySelector('[data-icon]')
  const syncPlay = () => {
    setIcon(playIcon, video.paused ? 'play' : 'pause')
    $('playBtn').setAttribute('aria-label', video.paused ? '재생' : '일시정지')
  }
  const syncVolume = () => {
    const off = video.muted || video.volume === 0
    setIcon(muteIcon, off ? 'volume-mute' : 'volume-high')
    $('muteBtn').setAttribute('aria-label', video.muted ? '음소거 해제' : '음소거')
    $('volume').value = video.muted ? 0 : video.volume
  }
  video.addEventListener('play', syncPlay)
  video.addEventListener('pause', syncPlay)
  video.addEventListener('volumechange', syncVolume)
  video.addEventListener('error', () => $('videoFallback').classList.replace('hidden', 'grid'))
  $('playBtn').onclick = () => (video.paused ? video.play() : video.pause())
  $('muteBtn').onclick = () => {
    video.muted = !video.muted
    if (!video.muted && video.volume === 0) video.volume = 0.5
  }
  $('volume').oninput = (e) => {
    video.volume = Number(e.target.value)
    video.muted = video.volume === 0
  }
  // 모바일(1024px 미만) — 커스텀 컨트롤 대신 영상 기본 컨트롤을 보인다.
  const mobileMq = matchMedia('(max-width: 1023.98px)')
  const syncControls = () => (video.controls = mobileMq.matches)
  mobileMq.addEventListener('change', syncControls)
  syncControls()
  syncPlay()
  syncVolume()

  // 방송 경과 시간 — 37분 전에 시작한 것으로 친다.
  const LIVE_STARTED_AT = Date.now() - (37 * 60 + 12) * 1000
  const pad = (n) => String(n).padStart(2, '0')
  const tickElapsed = () => {
    const s = Math.floor((Date.now() - LIVE_STARTED_AT) / 1000)
    $('elapsed').textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`
  }
  setInterval(tickElapsed, 1000)
  tickElapsed()

  // 참여자 수 — 5초마다 조금씩 오르내린다.
  let count = 1284
  const renderCount = () => document.querySelectorAll('[data-count]').forEach((el) => (el.textContent = count.toLocaleString()))
  setInterval(() => { count += Math.round((Math.random() - 0.4) * 8); renderCount() }, 5000)
  renderCount()

  // 다크/라이트 토글
  const themeIcon = $('themeBtn').querySelector('[data-icon]')
  const syncTheme = () => {
    const dark = document.documentElement.classList.contains('dark')
    setIcon(themeIcon, dark ? 'sun' : 'moon')
    $('themeBtn').setAttribute('aria-label', dark ? '라이트 모드로 전환' : '다크 모드로 전환')
  }
  $('themeBtn').onclick = () => { document.documentElement.classList.toggle('dark'); syncTheme() }
  syncTheme()

  // ───────── 채팅 접기/펼치기 ─────────
  const CHAT_W = 'w-[320px] min-w-[320px] xl:w-[380px] xl:min-w-[380px] 2xl:w-[clamp(360px,24vw,400px)] 2xl:min-w-[360px] 2xl:max-w-[400px]'.split(' ')
  const setChatActive = (on) => {
    CHAT_W.forEach((c) => $('chatCol').classList.toggle(c, on))
    $('chatCol').classList.toggle('lg:w-0', !on)
    $('liveHeader').classList.toggle('mt-5', on)
    $('controls').classList.toggle('mt-[-20px]', on)
    $('controls').classList.toggle('mb-[30px]', on)
    $('expandBtn').classList.toggle('hidden', on)
    $('expandBtn').classList.toggle('flex', !on)
  }
  $('hideChatBtn').onclick = () => setChatActive(false)
  $('expandBtn').onclick = () => setChatActive(true)
  // 라이브 나가기 — 확인 후 창을 닫는다. 닫을 수 없는 창(직접 연 탭·iframe)이면 종료 화면으로 덮는다.
  $('leaveBtn').onclick = () => {
    if (!confirm('학습을 종료하시겠습니까?')) return
    video.pause()
    window.close()
    setTimeout(() => $('closedScreen').classList.replace('hidden', 'grid'), 100)
  }
  $('reenterBtn').onclick = () => location.reload()

  // ───────── 공지 카드 ─────────
  const NOTICE_TEXT = '안녕하세요 여러분~ 오늘은 일차함수의 그래프를 함께 그려볼 거예요!\n궁금한 점은 언제든 채팅으로 물어보세요 :)'
  $('noticeLine').textContent = NOTICE_TEXT
  $('noticeText').textContent = NOTICE_TEXT
  /** 클래스 묶음을 켜고 끈다 — on 이면 onCls, 아니면 offCls. */
  const swap = (el, onCls, offCls, on) => {
    onCls.split(' ').forEach((c) => el.classList.toggle(c, on))
    offCls.split(' ').forEach((c) => el.classList.toggle(c, !on))
  }
  let noticeExpanded = true
  const setNoticeExpanded = (on) => {
    noticeExpanded = on
    swap($('noticeName'), 'max-w-[60%] px-2 py-0.5 opacity-100', 'max-w-0 px-0 py-0 opacity-0', on)
    swap($('noticeLine'), 'max-w-0 flex-none opacity-0', 'min-w-0 flex-1 opacity-100', on)
    swap($('noticeBody'), 'mt-2 grid-rows-[1fr] opacity-100', 'grid-rows-[0fr] opacity-0', on)
    $('noticeClose').classList.toggle('hidden', !on)
  }
  let noticeTimer = setTimeout(() => setNoticeExpanded(false), 5000)
  $('notice').onclick = () => { clearTimeout(noticeTimer); setNoticeExpanded(!noticeExpanded) }
  $('noticeClose').onclick = (e) => { e.stopPropagation(); $('notice').remove() }

  // ───────── 채팅 데이터(가상) ─────────
  const TEACHER = '하늘 선생님'
  const ME = '하랑'
  const NICKS = ['수학천재', '민트초코', '새벽공부', '도토리', '열공중', '구름빵', '포카칩', '별헤는밤', '코코아', '해바라기', '공부요정', '라떼한잔', '초록연필', '고양이발']
  const LINES = [
    '선생님 목소리 잘 들려요!', '기울기가 2면 x가 1 늘 때 y는 2 늘어나는 거죠?', 'y절편이 아직 헷갈려요 ㅠㅠ',
    '오늘 수업 진짜 재밌어요', '필기 다 했어요!', '그래프 그리는 거 이제 이해됐어요', '방금 문제 답 3번 맞나요?',
    'ㅋㅋㅋㅋㅋ', '와 이제 알겠다', '평행이동은 언제 배워요?', '선생님 최고 👍', '집중 모드 ON', '화질 너무 좋아요',
    '잠깐 놓쳤는데 한 번만 더 설명해주세요!', '1번 맞아요!', '기울기 = y의 증가량 ÷ x의 증가량', '오 그렇구나',
    '숙제 범위가 어디까지예요?', '저 방금 들어왔어요!', '그래프가 원점을 지나면 y절편이 0이죠?',
  ]
  const TEACHER_LINES = [
    '좋아요! 그럼 다음 문제로 넘어갈게요.', '질문 남겨준 친구들 고마워요~ 하나씩 답해줄게요.',
    '여기서 기울기는 y의 증가량 ÷ x의 증가량이에요.', '헷갈리는 친구들은 그래프를 직접 한 번 그려보세요!',
    '맞아요, 원점을 지나면 y절편은 0이에요 👏',
  ]
  let seq = 0
  const msg = (nick, text, opt = {}) => ({ id: ++seq, nick, text, ...opt })
  const messages = [
    msg('', '수업이 곧 시작됩니다. 필기도구를 준비해 주세요.', { system: true }),
    msg('도토리', '선생님 안녕하세요!'),
    msg('민트초코', '오늘 일차함수 하는 날이다 ㅎㅎ'),
    msg(TEACHER, '다들 반가워요~ 소리 잘 들리면 채팅으로 알려주세요!', { host: true }),
    msg('새벽공부', '소리 잘 들려요!'),
    msg('열공중', '잘 들려요 👍'),
    msg('구름빵', '기울기가 음수면 그래프가 오른쪽 아래로 내려가는 거 맞죠?', {
      replies: [msg(TEACHER, '맞아요! 오른쪽으로 갈수록 내려가요.', { host: true }), msg('포카칩', '저도 그거 궁금했어요')],
    }),
    msg('포카칩', '필기 다 했어요'),
    msg(TEACHER, '이제 y절편을 찾아볼게요. y = 2x + 3 에서 y절편은 몇일까요?', { host: true }),
    msg('수학천재', '3이요!'),
    msg('해바라기', '3!!'),
    msg('코코아', '(0, 3) 이요'),
    msg(ME, '3입니다~', { mine: true }),
    msg(TEACHER, '정답! 다들 잘하고 있어요 👏', { host: true }),
  ]
  const MAX_MESSAGES = 200

  // ───────── 메시지 행 렌더 ─────────
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
  const AVATAR_BOX = 'grid h-[18px] w-[18px] place-items-center rounded-full lg:h-[26px] lg:w-[26px]'
  const avatarHtml = (m) => m.host
    ? `<span class="${AVATAR_BOX} bg-[#ffe3e5] text-[11px] text-live-red lg:text-[16px]"><i class="ph-fill ph-chalkboard-teacher"></i></span>`
    : `<span class="${AVATAR_BOX} bg-gray-200 text-[10px] text-gray-400 dark:bg-dark-surface dark:text-gray-500 lg:text-[18px]"><i class="ph-fill ph-user"></i></span>`
  const crownHtml = '<span aria-label="방장" class="absolute -bottom-1 -right-1 grid h-3.5 w-3.5 place-items-center rounded-full bg-[#2b2f3a] text-yellow-500 ring-2 ring-white dark:ring-[#242c40] lg:h-[18px] lg:w-[18px]"><i class="ph-fill ph-crown-simple text-[8px] lg:text-[10px]"></i></span>'
  const textCls = (m) => m.host ? 'font-bold text-yellow-600 dark:text-yellow-300' : 'text-gray-900 dark:text-gray-100'

  const rowHtml = (m) => {
    if (m.system)
      return `<div class="flex justify-center px-6 py-1"><span class="max-w-full truncate rounded-full bg-gray-100 px-3 py-1 text-center text-chat-xs text-gray-500 dark:bg-dark-track dark:text-gray-400">${esc(m.text)}</span></div>`
    const replies = m.replies || []
    const badge = replies.length
      ? `<button type="button" data-toggle aria-expanded="false" class="mt-1 flex shrink-0 items-center gap-0.5 self-start rounded-full px-1.5 py-0.5 text-chat-sm font-medium text-blue-pin hover:bg-blue-pin/10 lg:mt-1.5"><i class="ph-bold ph-caret-right text-[11px]"></i>댓글 ${replies.length}</button>`
      : ''
    const replyRows = replies.map((r) =>
      `<div class="mx-3 flex items-start gap-1.5 bg-gray-500/10 py-[12px] pl-8 pr-6">
        <span aria-hidden="true" class="shrink-0 select-none text-[9px] font-bold leading-snug text-gray-400 dark:text-gray-500 lg:text-chat-sm">ㄴ</span>
        <p class="min-w-0 text-[9px] leading-snug lg:text-chat-sm ${textCls(r)}"><span class="font-bold">${esc(r.nick)}</span> <span class="[overflow-wrap:anywhere]">${esc(r.text)}</span></p>
      </div>`).join('')
    return `<div class="flex items-start gap-3 px-6 py-[12px]">
        <div class="flex h-[1.375em] shrink-0 items-center text-[10.4px] lg:text-chat-lg">
          <div class="relative">${avatarHtml(m)}${m.host ? crownHtml : ''}</div>
        </div>
        <p class="min-w-0 text-[10.4px] leading-snug lg:text-chat-lg ${textCls(m)}"><span class="font-bold">${esc(m.nick)}</span> ${m.emoji
          ? `<span class="pointer-events-none mt-1 grid h-14 w-14 place-items-center text-[44px] leading-none lg:h-20 lg:w-20 lg:text-[60px]">${esc(m.emoji)}</span>`
          : `<span class="[overflow-wrap:anywhere]">${esc(m.text)}</span>`}</p>
        ${badge}
      </div>${replies.length ? `<div data-replies class="hidden">${replyRows}</div>` : ''}`
  }

  // ───────── 목록 · 스크롤 ─────────
  const list = $('list')
  let tab = 'normal' // 'normal'(전체) · 'slow'(일부) · 'mine'(내 채팅)
  let atBottom = true
  const visible = (m) => tab !== 'mine' || m.mine
  const toBottom = () => (list.scrollTop = list.scrollHeight)
  const nodeOf = (m) => {
    const wrap = document.createElement('div')
    wrap.innerHTML = rowHtml(m)
    return wrap
  }
  const renderList = () => {
    list.replaceChildren(...messages.filter(visible).map(nodeOf))
    if (!list.children.length)
      list.innerHTML = '<p class="grid h-full place-items-center text-chat-sm text-gray-500 dark:text-gray-400">내가 보낸 채팅이 여기에 모여요.</p>'
    toBottom()
  }
  const append = (m) => {
    messages.push(m)
    if (messages.length > MAX_MESSAGES) messages.shift()
    if (!visible(m)) return
    if (tab === 'mine' && list.querySelector('p.grid')) list.replaceChildren()
    list.appendChild(nodeOf(m))
    if (list.children.length > MAX_MESSAGES) list.firstElementChild.remove()
    if (atBottom || m.mine) toBottom()
    else $('unreadToast').classList.remove('hidden')
  }
  list.addEventListener('scroll', () => {
    atBottom = list.scrollHeight - list.scrollTop - list.clientHeight <= 80
    if (atBottom) $('unreadToast').classList.add('hidden')
  })
  $('unreadToast').onclick = () => { toBottom(); $('unreadToast').classList.add('hidden') }
  // (댓글 N) 배지 — 답글 펼침/접힘
  list.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-toggle]')
    if (!btn) return
    const replies = btn.parentElement.nextElementSibling
    const open = replies.classList.toggle('hidden') === false
    btn.setAttribute('aria-expanded', open)
    btn.querySelector('i').className = `ph-bold ${open ? 'ph-caret-down' : 'ph-caret-right'} text-[11px]`
  })

  // ───────── '채팅 보기' 탭 ─────────
  const TABS = [{ id: 'normal', label: '전체' }, { id: 'slow', label: '일부' }, { id: 'mine', label: '내 채팅' }]
  const renderTabs = () => document.querySelectorAll('[data-tabs]').forEach((box) => {
    box.innerHTML = `<div class="flex shrink-0 items-center gap-1">
      <span class="whitespace-nowrap text-base font-medium text-black dark:text-white">채팅 보기</span>
      <div role="tablist" aria-label="채팅 보기" class="flex items-center rounded-full bg-pale px-[5px] py-[3px] dark:bg-dark-track">
        ${TABS.map((t) => `<button type="button" role="tab" data-tab="${t.id}" aria-selected="${t.id === tab}" class="whitespace-nowrap rounded-full px-2 py-0.5 text-xs font-medium ${t.id === tab ? 'bg-white text-chat-tab-active dark:bg-dark-bg' : 'text-chat-tab-text dark:text-gray-300'}">${t.label}</button>`).join('')}
      </div></div>`
  })
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-tab]')
    if (!btn || btn.dataset.tab === tab) return
    const wasMine = tab === 'mine'
    tab = btn.dataset.tab
    renderTabs()
    syncInput()
    if (wasMine || tab === 'mine') renderList()
  })

  // ───────── 입력창 ─────────
  const input = $('input')
  const MAX_LINES = 3
  const fitInput = () => {
    input.style.height = 'auto'
    const cs = getComputedStyle(input)
    const max = parseFloat(cs.lineHeight) * MAX_LINES + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom)
    input.style.height = `${Math.min(input.scrollHeight, max)}px`
    input.style.overflowY = input.scrollHeight > max ? 'auto' : 'hidden'
  }
  const syncInput = () => {
    const mine = tab === 'mine'
    input.disabled = mine
    input.placeholder = mine ? '내 채팅 보기 중에는 입력할 수 없습니다' : '내용을 입력해주세요.'
    $('emojiBtn').classList.toggle('hidden', mine)
    $('sendBtn').classList.toggle('hidden', mine)
    $('sendBtn').classList.toggle('grid', !mine)
    if (mine) { setPicker(false); setPreview(null) }
    $('sendBtn').disabled = !input.value.trim() && !previewEmoji
  }
  const send = () => {
    if (input.disabled) return
    // 미리보기 이모티콘이 있으면 먼저 보내고, 입력한 글도 이어서 보낸다.
    if (previewEmoji) { append(msg(ME, '', { mine: true, emoji: previewEmoji })); setPreview(null) }
    const text = input.value.trim()
    if (!text) return syncInput()
    append(msg(ME, text, { mine: true }))
    input.value = ''
    fitInput()
    syncInput()
    // 가끔 선생님이 답해준다.
    if (Math.random() < 0.35) setTimeout(() => append(msg(TEACHER, `${ME} 학생 좋아요! 계속 같이 가봐요 😊`, { host: true })), 1800)
  }
  input.addEventListener('input', () => { fitInput(); syncInput() })
  input.addEventListener('focus', () => setPicker(false))
  input.addEventListener('keydown', (e) => {
    if (e.isComposing) return
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() }
  })
  $('sendBtn').onclick = send
  // ───────── 이모티콘 선택창 · 미리보기 ─────────
  // 이모티콘 카테고리 — 미리보기에서는 이미지 대신 이모지 문자를 쓴다.
  const EMOJI_SETS = [
    { id: 'face', label: '표정', items: ['😀', '😆', '🥰', '😎', '🤔', '😮', '😭', '😴', '🤩', '😇', '🥳', '😅'] },
    { id: 'cheer', label: '응원', items: ['👍', '👏', '🙌', '💪', '🔥', '💯', '🎉', '❤️', '✨', '🌟', '🙏', '💖'] },
    { id: 'study', label: '공부', items: ['📚', '✏️', '📝', '💡', '🧠', '📐', '📏', '🧮', '⏰', '✅', '❓', '🙋'] },
  ]
  const ALL_EMOJIS = EMOJI_SETS.flatMap((s) => s.items)
  const DOUBLE_TAP_MS = 250 // 이 안에 같은 이모티콘을 또 누르면 바로 전송
  let emojiTab = null // 선택된 카테고리 id — null 이면 전체
  let pickerOpen = false
  let previewEmoji = null
  let pending = null // 더블탭 판정 대기 { emoji, timer }

  const renderEmojiTabs = () => {
    const tabs = [{ id: null, label: '전체' }, ...EMOJI_SETS]
    $('emojiTabs').innerHTML = tabs.map((t) => `<button type="button" data-emoji-tab="${t.id ?? ''}" aria-pressed="${t.id === emojiTab}" tabindex="-1" class="shrink-0">
      <span class="grid h-[40px] place-items-center px-3 text-chat-sm ${t.id === emojiTab ? 'font-bold text-chat-tab-active' : 'font-medium text-gray-500'}">${t.label}</span></button>`).join('')
  }
  const renderEmojiGrid = () => {
    const items = emojiTab ? EMOJI_SETS.find((s) => s.id === emojiTab).items : ALL_EMOJIS
    $('emojiGrid').innerHTML = items.map((e) => `<button type="button" data-emoji="${e}" tabindex="-1" class="grid h-full w-full place-items-center overflow-hidden rounded-lg text-[44px] leading-none transition-colors [@media(hover:hover)]:hover:bg-gray-100 dark:[@media(hover:hover)]:hover:bg-white/10">${e}</button>`).join('')
    $('emojiGrid').scrollTop = 0
  }
  const clearPending = () => { if (pending) clearTimeout(pending.timer); pending = null }
  function setPicker(open) {
    pickerOpen = open
    if (!open) clearPending()
    $('emojiPicker').classList.toggle('hidden', !open)
    $('emojiBtn').querySelector('i').className = `ph ${open ? 'ph-keyboard' : 'ph-smiley'} text-[22px]`
    $('emojiBtn').setAttribute('aria-label', open ? '키보드' : '이모티콘')
  }
  function setPreview(emoji) {
    previewEmoji = emoji
    $('emojiPreviewChar').textContent = emoji ?? ''
    $('emojiPreview').classList.toggle('hidden', !emoji)
    $('sendBtn').disabled = !input.value.trim() && !emoji
  }

  $('emojiBtn').onclick = () => {
    // 키보드 아이콘 — 선택창을 닫고 입력창으로 돌아간다.
    if (pickerOpen) { setPicker(false); input.focus(); return }
    setPreview(null)
    input.blur()
    setPicker(true)
  }
  $('emojiClose').onclick = () => setPicker(false)
  $('emojiPreviewClose').onclick = () => setPreview(null)
  $('emojiTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-emoji-tab]')
    if (!btn) return
    emojiTab = btn.dataset.emojiTab || null
    clearPending()
    renderEmojiTabs()
    renderEmojiGrid()
  })
  $('emojiGrid').addEventListener('click', (e) => {
    const emoji = e.target.closest('[data-emoji]')?.dataset.emoji
    if (!emoji) return
    // 같은 이모티콘을 연달아 누르면(더블탭) 미리보기 없이 바로 보낸다.
    if (pending?.emoji === emoji) {
      clearPending()
      setPreview(null)
      setPicker(false)
      append(msg(ME, '', { mine: true, emoji }))
      return
    }
    clearPending()
    // 한 번 탭 — 선택창을 닫고 전송 전 미리보기를 띄운다.
    pending = { emoji, timer: setTimeout(() => { pending = null; setPreview(emoji); setPicker(false) }, DOUBLE_TAP_MS) }
  })
  // 선택창 바깥을 누르면 닫는다.
  document.addEventListener('pointerdown', (e) => {
    if (pickerOpen && !e.target.closest('[data-emoji-keep]')) setPicker(false)
  }, true)
  renderEmojiTabs()
  renderEmojiGrid()

  // ───────── 좋아요 하트 ─────────
  $('likeBtn').onclick = () => {
    for (let i = 0; i < 6; i++) {
      const size = 10 + Math.floor(Math.random() * 12)
      const h = document.createElement('span')
      h.className = 'heart-float text-live-red'
      h.innerHTML = '<i class="ph-fill ph-heart"></i>'
      h.style.setProperty('--dx', `${Math.round((Math.random() - 0.5) * 60)}px`)
      h.style.setProperty('--duration', `${0.9 + Math.random() * 0.6}s`)
      h.style.animationDelay = `${i * 0.08}s`
      h.style.fontSize = `${size}px`
      h.style.marginLeft = `-${size / 2}px`
      h.addEventListener('animationend', () => h.remove())
      $('likeWrap').prepend(h)
    }
  }

  // ───────── 가상 실시간 채팅 ─────────
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)]
  const scheduleNext = () => setTimeout(() => {
    // '일부' 탭 — 남의 채팅을 절반 정도만 보여준다.
    if (tab !== 'slow' || Math.random() < 0.5)
    {
      const r = Math.random()
      append(r < 0.1 ? msg(TEACHER, pick(TEACHER_LINES), { host: true })
        : r < 0.18 ? msg(pick(NICKS), '', { emoji: pick(ALL_EMOJIS) })
        : msg(pick(NICKS), pick(LINES)))
    }
    scheduleNext()
  }, 900 + Math.random() * 2200)

  renderTabs()
  syncInput()
  renderList()
  scheduleNext()
})()
</script>
</body>
</html>
