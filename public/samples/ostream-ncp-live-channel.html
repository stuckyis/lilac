<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라이브 채널 관리 미리보기</title>
<!--
  포트폴리오용 정적 미리보기 (더미 데이터).
  - 이 파일 하나로 동작한다. 글꼴(Pretendard)만 CDN에서 받고, 실패하면 시스템 글꼴로 보인다.
  - 서비스명·로고는 가상의 이름(Stream Console)이고, 주소는 예시 전용 도메인(example.com 계열)만 쓴다.
  - 아이콘: Phosphor Icons (MIT License)
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root {
    --primary: #5d87ff; --red: #fc4646; --error: #ff4171; --navy: #2f3760; --green: #2ce09f; --yellow: #ff9142;
    --g1: #202123; --g2: #313133; --g3: #58595b; --g4: #b0b1ba; --g5: #cbccd2; --g6: #e2e2e9; --g7: #f1f1f4; --g8: #f6f6f8;
    --side: #111727; --bg-blue: rgba(93, 135, 255, 0.07);
}
* { padding: 0; margin: 0; box-sizing: border-box; }
li { list-style: none; }
html { font-size: 10px; background: var(--g7); }
html, body { height: 100%; overflow: hidden; }
body {
    font-size: 1.3rem; color: var(--g2); -webkit-font-smoothing: antialiased;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Malgun Gothic', sans-serif;
}
button, input, textarea, select { font-family: inherit; }
input, textarea, select { outline: none; font-size: 1.3rem; color: var(--g2); }
input::placeholder, textarea::placeholder { color: var(--g4); font-size: 1.2rem; }
.ic { width: 1em; height: 1em; fill: currentColor; flex-shrink: 0; }
.scroll::-webkit-scrollbar { width: .8rem; height: .8rem; }
.scroll::-webkit-scrollbar-track { background: var(--g8); border-radius: 10rem; }
.scroll::-webkit-scrollbar-thumb { background: var(--g5); border-radius: 1rem; }

/* ================= 셸 ================= */
#mainWrapper { display: flex; background: #fff; width: 100%; height: 5rem; }

#headerInfo {
    position: fixed; top: 0; right: 0; z-index: 200; height: 5rem; width: calc(100% - 24rem);
    padding: 0 3rem; background: #fff; display: flex; justify-content: space-between; align-items: center;
}
#headerInfo .btn-wrap button { min-width: 0; width: auto; padding: .4rem .6rem; }
#headerInfo .user-guide { font-size: 1.1rem; border: 1px solid var(--g6); border-radius: .4rem; color: var(--g4); min-height: 2.4rem; }
#headerInfo .user-guide svg { font-size: 1.4rem; }
#headerInfo .mobile-menu-btn { color: var(--g2); display: none; }
#headerInfo .mobile-menu-btn svg { font-size: 2rem; }
.info-wrapper { height: 100%; display: flex; align-items: center; }
.info-box { border-left: 1px solid var(--g6); padding-left: 2rem; display: flex; align-items: center; cursor: pointer; transition: color .1s; }
.info-box:hover { color: var(--primary); }
.info-box svg { font-size: 2rem; }
.info-box p { margin-left: .8rem; }
.preview-chip { margin-right: 2rem; padding: .3rem .8rem; border-radius: 10rem; background: var(--bg-blue); color: var(--primary); font-size: 1.1rem; font-weight: 600; }

#sideMenu {
    position: relative; width: 24rem; min-width: 24rem; height: 100vh; background: var(--side);
    display: flex; flex-flow: column; padding: 0 .4rem 0 1.4rem; z-index: 200;
}
#sideMenu .fold-btn {
    position: absolute; right: -1.275rem; top: .813rem; width: 2.63rem; height: 2.63rem; border-radius: 50%;
    background: #fff; box-shadow: 0 0 5px rgba(0,0,0,.2); cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 1;
}
#sideMenu .fold-btn::after {
    content: ''; position: absolute; left: 1.1rem; width: .513rem; height: .513rem;
    border-top: 2px solid #797979; border-right: 2px solid #797979; transform: rotate(-135deg); transition: transform .3s;
}
#sideMenu .fold-btn:hover { background: var(--primary); }
#sideMenu .fold-btn:hover::after { border-color: #fff; }
.logo-box { width: 100%; height: 6.4rem; padding: 1.8rem; border-bottom: 1px solid var(--g2); margin-bottom: 1rem; display: flex; align-items: center; }
.logo { display: flex; align-items: center; gap: .8rem; color: #fff; font-weight: 800; font-size: 1.5rem; letter-spacing: -.02em; white-space: nowrap; }
.logo-mark { width: 2.6rem; height: 2.6rem; border-radius: .8rem; background: linear-gradient(135deg, #5d87ff, #8548ff); display: grid; place-items: center; flex-shrink: 0; }
.logo-mark svg { font-size: 1.4rem; color: #fff; }
.menu-box { color: var(--g4); font-size: 1.3rem; overflow-y: auto; padding: 0 1rem 2rem 0; scrollbar-width: none; }
.menu-box::-webkit-scrollbar { display: none; }
.menu-list { cursor: pointer; }
.menu-group { padding: .5rem 0; }
.menu-group-title { position: relative; padding: .8rem .6rem; border-radius: .4rem; display: flex; align-items: center; }
.menu-group-title > svg:first-child { font-size: 2rem; }
.menu-group-name { margin-left: 1rem; font-size: 1.4rem; font-weight: 500; color: var(--g5); }
.menu-group-title .icon { position: absolute; right: .6rem; font-size: 1.6rem; transition: transform .2s; }
.menu-group-title.expanded .icon { transform: rotate(180deg); }
.menu-group-title.active { color: #fff; background: rgba(93,135,255,.1); }
.menu-group-title.active .menu-group-name { color: #fff; }
.menu-group-title:hover { background: rgba(93,135,255,.1); }
.menu-link { position: relative; padding: .85rem .625rem; border-radius: .188rem; }
.menu-link:hover { color: #fff; }
.menu-link::before { content: ''; width: .1rem; height: 100%; background: var(--g2); position: absolute; left: 1.4rem; top: 0; }
.menu-link::after { content: ''; position: absolute; top: 1.54rem; left: 1.5rem; width: .75rem; border-bottom: 1px solid var(--g2); }
.menu-link:last-child::before { height: 50%; }
.menu-link.active::before { background: var(--primary); }
.menu-link.active::after { border-bottom-color: var(--primary); }
.menu-link.active .menu-name { color: var(--primary); opacity: 1; }
.menu-name { margin-left: 2.8rem; opacity: .8; }

/* LNB 접힘 */
#sideMenu.fold { width: 8rem; min-width: 8rem; padding: 0; }
#sideMenu.fold .fold-btn::after { left: .875rem; transform: rotate(45deg); }
#sideMenu.fold .logo-box { justify-content: center; padding: 1.8rem 0; }
#sideMenu.fold .logo-text { display: none; }
#sideMenu.fold .menu-box { overflow: visible; padding: 1rem 0; }
#sideMenu.fold .menu-group { position: relative; padding: 1rem; }
#sideMenu.fold .menu-group-title { flex-direction: column; justify-content: center; }
#sideMenu.fold .menu-group-title > svg:first-child { font-size: 1.6rem; }
#sideMenu.fold .menu-group-title .icon { display: none; }
#sideMenu.fold .menu-group-name { margin: .4rem 0 0; font-size: 1.2rem; text-align: center; }
#sideMenu.fold .menu-sub {
    display: none; position: absolute; z-index: 10000; transform: translateX(100%); top: 0; right: 0; background: #fff;
    padding: 1rem 0; border-top: .3rem solid var(--side); width: 16rem; box-shadow: 0 0 5px 3px rgba(32,33,35,.1);
}
#sideMenu.fold .menu-group:hover .menu-sub { display: block; }
#sideMenu.fold .menu-link { color: var(--g2); padding: .5rem 1rem; }
#sideMenu.fold .menu-link::before, #sideMenu.fold .menu-link::after { display: none; }
#sideMenu.fold .menu-name { margin: 0; padding: .6rem 1rem; border-radius: .5rem; opacity: 1; }
#sideMenu.fold .menu-name:hover { color: var(--primary); background: rgba(93,135,255,.1); }
#mainWrapper.lnb-fold #headerInfo { width: calc(100% - 8rem); }
#mainWrapper.lnb-fold .main { width: calc(100% - 8rem); }

.main { position: relative; margin-top: 5rem; width: calc(100% - 24rem); }
#tabMenu { width: 100%; background: var(--g8); border-bottom: 1px solid var(--g6); }
.tab-handler { border-bottom: 1px solid var(--g6); height: 2.4rem; padding: 0 1.4rem; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
.tab-counter { display: flex; align-items: center; }
.tab-counter svg { margin-right: .4rem; font-size: 1.2rem; }
.tab-counter p { margin-left: .4rem; font-weight: 700; color: #2079ff; }
.tab-close-btn { display: flex; align-items: center; }
.tab-close-btn div { position: relative; cursor: pointer; font-weight: 600; }
.tab-close-btn div:first-child { margin-right: 2rem; }
.tab-close-btn div:first-child::after { content: ''; background: var(--g6); height: 100%; width: .1rem; position: absolute; margin-left: 1rem; }
.tab-close-btn div:hover { color: var(--red); }
.tab-wrapper { width: 100%; height: 2.6rem; padding: 0 .4rem; overflow: auto hidden; display: flex; align-items: flex-start; scrollbar-width: none; }
.tab-box {
    min-width: 10rem; width: 18rem; height: 2.6rem; position: relative; padding: 0 .8rem; border-left: 1px solid var(--g6);
    font-size: 1.1rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; overflow: hidden; white-space: nowrap; flex-shrink: 0;
}
.tab-box:first-child { border-left-color: transparent; }
.tab-box:last-child { border-right: 1px solid var(--g6); }
.tab-box::after { content: ''; height: 2.6rem; width: 4rem; position: absolute; right: 0; background: linear-gradient(90deg, rgba(0,0,0,0) 0%, var(--g8) 48%); }
.tab-box > svg:first-child { font-size: 1.5rem; }
.tab-box > .close { height: 100%; position: absolute; right: 0; color: var(--g2); padding-right: .4rem; z-index: 1; display: flex; align-items: center; font-size: 1.3rem; }
.tab-box > .close:hover { color: var(--red); }
.tab-box .tab-name { display: flex; align-items: center; overflow: hidden; text-overflow: ellipsis; }
.tab-box .tab-name::before { content: ''; width: .1rem; height: 1.2rem; background: var(--g4); margin: 0 .5rem; flex-shrink: 0; }
.tab-box.active { background: #fff; border-right: 1px solid var(--g6); border-left: 1px solid var(--g6); height: 2.7rem; }
.tab-box.active + .tab-box { border-left-color: transparent; }
.tab-box.active::after { background: linear-gradient(90deg, rgba(0,0,0,0) 0%, #fff 50%); }
.tab-box.active .tab-name { color: var(--primary); font-weight: 600; }
.tab-box.active .tab-name::before { background: rgba(93,135,255,.6); }
.tab-box.active > svg:first-child { color: var(--primary); }

.main-view { background: #fff; height: calc(100vh - 10.1rem); display: flex; flex-direction: column; }
.page-view { position: relative; height: 100%; }
.page-view.detail .page-body { background: var(--g7); }
.page-body { padding: 1.6rem; height: calc(100vh - 13.6rem); overflow: auto; }
.empty-view { height: 100%; display: grid; place-items: center; color: var(--g4); text-align: center; line-height: 1.8; }
#pathWrapper { padding: 1rem .4rem 1rem 1.4rem; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
#breadcrumb { display: flex; align-items: center; flex-wrap: wrap; row-gap: .4rem; }
#breadcrumb > span { color: var(--g3); font-size: 1.2rem; display: flex; align-items: center; }
#breadcrumb > span.title { font-weight: 600; color: var(--g1); }
#breadcrumb .ic { margin-right: .3rem; }
.page-close-btn { min-height: 0 !important; }
.page-close-btn p { color: var(--g2); font-size: 1.2rem; }
.page-close-btn p::after { content: ''; margin-left: .6rem; width: .8rem; height: .8rem; background: url("data:image/svg+xml,%3Csvg%20width%3D%2210%22%20height%3D%2210%22%20viewBox%3D%220%200%2010%2010%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%20%3Cpath%20d%3D%22M8.93994%201.29395L0.939941%209.29395M0.939941%201.29395L8.93994%209.29395%22%20stroke%3D%22%23555555%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%20%3C%2Fsvg%3E") center / contain no-repeat; }
.page-close-btn:hover p { color: var(--red); }

/* ================= 버튼 ================= */
button {
    min-height: 3.2rem; min-width: fit-content; background: none; color: #fff; border: none; border-radius: .4rem;
    font-size: 1.3rem; font-weight: 500; transition: all .1s; padding: 0 .8rem; gap: .4rem;
    display: flex; justify-content: center; align-items: center; cursor: pointer;
}
button p { display: flex; justify-content: center; align-items: center; }
button svg { font-size: 1.6rem; }
button.icon { width: 3.2rem; min-width: 3.2rem; padding: 0; position: relative; }
button.icon p { display: none; }
button.icon:hover p {
    display: block; position: absolute; background: #fff; border: 1px solid var(--g6); color: var(--g3); white-space: nowrap;
    padding: .6rem; bottom: -3rem; border-radius: .5rem; z-index: 100; font-size: 1.2rem;
}
.btn-blue { background: var(--primary); }
.btn-blue:hover { background: #4474ff; }
.btn-blue.border { background: #fff; border: 1px solid var(--primary); color: var(--primary); }
.btn-blue.border:hover { background: rgba(93,135,255,.1); }
.btn-red { background: var(--error); }
.btn-red.border { background: #fff; border: 1px solid var(--error); color: #ff2a5f; }
.btn-red.border:hover { background: rgba(255,65,113,.1); }
.btn-gray { background: var(--g4); }
.btn-gray:hover { background: #a2a4ae; }
.btn-gray.border { background: #fff; border: 1px solid var(--g6); color: var(--g3); }
.btn-gray.border:hover { background: rgba(226,226,233,.2); }
.btn-black { background: var(--g2); }
.btn-black:hover { background: #252526; }
.btn-black.border { background: #fff; border: 1px solid var(--g3); color: var(--g3); }
.btn-black.border:hover { background: rgba(88,89,91,.1); }
.btn-green.border { background: #fff; border: 1px solid var(--green); color: #1fdc96; }
.btn-green.border:hover { background: rgba(44,224,159,.1); }
.btn-yellow.border { background: #fff; border: 1px solid var(--yellow); color: #ff8a35; }
.btn-yellow.border:hover { background: rgba(255,145,66,.1); }
button.short { min-width: 7.2rem; }
button:disabled { opacity: .3; pointer-events: none; }
button.small, button.border.small { min-height: auto; height: 2.1rem; padding: .4rem; border: none; font-size: 1.2rem; min-width: 0; width: auto; background: none; }
button.small svg { font-size: 1.3rem; }
button.toggle { background: var(--g5); border-radius: 10rem; position: relative; min-width: 3.6rem; height: 1.8rem; min-height: 0; padding: 0; }
button.toggle::before { content: ''; width: 1.4rem; height: 1.4rem; border-radius: 10rem; background: #fff; position: absolute; left: .2rem; top: 50%; transform: translateY(-50%); transition: all .1s; }
button.toggle.active { background: var(--green); }
button.toggle.active::before { transform: translate(1.8rem, -50%); }
.btn-wrap { gap: .8rem; display: flex; justify-content: flex-end; align-items: center; }
.btn-wrap.bottom { margin-bottom: 2rem; justify-content: center; }
.btn-wrap.gap-2 { gap: .2rem; }

/* ================= 입력 ================= */
input:not([type='radio']):not([type='checkbox']) { width: 100%; height: 3.2rem; border: 1px solid var(--g6); border-radius: .4rem; padding: 0 .8rem; background: #fff; }
input:focus { border-color: var(--primary) !important; }
input:disabled { background: #fbfbfc !important; border: 1px solid rgba(226,226,233,.6) !important; color: var(--g3); }
input[type='date'] { min-width: 12.8rem; width: 12.8rem !important; }
.selectBox {
    width: 100%; min-width: 12rem; height: 3.2rem; padding: 0 2.6rem 0 .8rem; border-radius: .4rem; border: 1px solid var(--g6);
    background: #fff url("data:image/svg+xml,%3Csvg%20width%3D%2210%22%20height%3D%225%22%20viewBox%3D%220%200%2010%205%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%20%3Cpath%20d%3D%22M9.50879%201.10664L5.12246%204.30664L0.73614%201.10664%22%20stroke%3D%22%238E8E8E%22%20stroke-width%3D%220.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%20%3C%2Fsvg%3E") right .8rem center / 1.2rem .7rem no-repeat; font-size: 1.3rem; cursor: pointer;
    appearance: none; -webkit-appearance: none;
}
.selectBox:focus { border-color: var(--primary); }
textarea { width: 100%; min-height: 9rem; padding: 1rem; border: 1px solid var(--g6); border-radius: .4rem; resize: none; word-break: break-all; }
textarea:focus { border-color: var(--primary); }
textarea:read-only { color: var(--g3); background: #fbfbfc; }
.radio-button { flex-flow: wrap; height: 3rem; gap: 1.2rem; display: flex; align-items: center; }
.radio-button li { min-width: 3rem; display: flex; align-items: center; }
.radio-button label { font-size: 1.2rem; cursor: pointer; gap: .4rem; display: flex; align-items: center; }
.radio-button input { width: 1.2rem; height: 1.2rem; cursor: pointer; accent-color: var(--primary); }
.check-box { display: flex; }
.check-box input { display: none; }
.check-box label { width: 1.4rem; height: 1.4rem; cursor: pointer; display: flex; justify-content: center; align-items: center; }
.check-box svg { font-size: 1.4rem; border: 1px solid var(--g6); border-radius: .2rem; background: #fff; color: #fff; }
.check-box input:checked + label svg { background: rgba(93,135,255,.3); border-color: rgba(93,135,255,.5); color: var(--primary); }

.label-box { margin-bottom: .2rem; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
.label-box:last-child { margin-bottom: 0; }
.label-box.divider-box { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.label-form { width: 100%; position: relative; min-width: 0; }
.label-form.divider { width: calc(50% - 1rem); }
.label-form > p { position: relative; margin-bottom: .5rem; display: flex; align-items: center; }
.label-form > p span { margin-left: .2rem; }
.label-form > p .title { font-size: 1.2rem; word-break: break-all; font-weight: 500; color: var(--g3); }
.label-form > div { gap: .4rem; display: flex; align-items: center; }
.label-form .hyphen { margin: .4rem; }
.w25 { width: 25% !important; }
.w75 { width: 75% !important; }

/* ================= 검색 ================= */
.search-wrap { margin-bottom: 2rem; background: #f8f8f9; border-radius: .5rem; border: 1px solid var(--g6); }
.search-form { padding: 2rem; }
.input-box { flex-wrap: wrap; gap: 2rem; display: flex; align-items: center; }
.input-box .label-form { width: auto; }
.input-box.sub .label-form { display: none; }
.search-wrap.active .input-box.sub { margin-top: 2rem; }
.search-wrap.active .input-box.sub .label-form { display: block; }
.search-header { padding: 1rem 2rem; position: relative; flex-wrap: wrap; gap: .8rem; display: flex; justify-content: space-between; align-items: center; }
.search-header::before { content: ''; width: calc(100% - 4rem); height: .1rem; background: var(--g6); position: absolute; top: 0; }
.search-title { font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; }
.search-title::after { content: ''; margin-left: 1rem; width: 1rem; height: .5rem; background: url("data:image/svg+xml,%3Csvg%20width%3D%2210%22%20height%3D%225%22%20viewBox%3D%220%200%2010%205%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%20%3Cpath%20d%3D%22M1%200.5L5%204L9%200.5%22%20stroke%3D%22%23202123%22%20stroke-width%3D%220.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%20%3C%2Fsvg%3E") center / contain no-repeat; }
.search-wrap.active .search-title::after { background-image: url("data:image/svg+xml,%3Csvg%20width%3D%2210%22%20height%3D%225%22%20viewBox%3D%220%200%2010%205%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%20%3Cpath%20d%3D%22M1%204.5L5%201L9%204.5%22%20stroke%3D%22%23202123%22%20stroke-width%3D%220.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%20%3C%2Fsvg%3E"); }

/* ================= 테이블 ================= */
#tableArea { position: relative; min-height: 25rem; }
.table-area-header { margin-bottom: 1rem; font-size: 1.2rem; flex-wrap: wrap; gap: .8rem; min-height: 3rem; display: flex; justify-content: space-between; align-items: center; }
.table-area-header .total { white-space: nowrap; }
.table-tab-list { display: flex; align-items: center; flex-wrap: wrap; gap: .8rem; }
.table-tab-list li { display: flex; justify-content: center; align-items: center; }
.table-tab-list button { gap: .6rem; min-height: fit-content; padding: .6rem 1.2rem; border-radius: 1.4rem; color: var(--g1); font-weight: 500; font-size: 1.4rem; border: 1px solid transparent; background: var(--g8); }
.table-tab-list button .tab-count { font-weight: 600; }
.table-tab-list button.active { background: var(--bg-blue); color: var(--primary); border-color: var(--primary); }
.table-tab-list li:not(:last-child)::after { content: ''; display: inline-block; height: 2rem; width: .1rem; background: var(--g6); margin-left: .8rem; }
#tanstackTable { overflow-x: auto; }
#tanstackTable table { border-collapse: collapse; width: 100%; min-width: 120rem; text-align: left; table-layout: fixed; }
#tanstackTable tr { display: flex; align-items: center; }
#tanstackTable th, #tanstackTable td { flex: 1; padding: 0 1rem; display: flex; align-items: center; min-width: 0; }
#tanstackTable td > div { padding: 1rem 0; min-width: 0; }
#tanstackTable tbody tr { border-bottom: 1px solid var(--g6); }
#tanstackTable tbody tr:hover { background: #fbfbfc; transition: all .2s; }
#tanstackTable tbody tr:not(.table-nodata) td div,
#tanstackTable tbody tr:not(.table-nodata) td p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tanstackTable thead tr { align-items: stretch; }
#tanstackTable th { background: var(--g7); min-height: 3.8rem; padding: .2rem 1rem; font-weight: 600; }
#tanstackTable .checkbox-area { justify-content: center; }
#tanstackTable .table-nodata { height: 25rem; justify-content: center; }
#tanstackTable .table-nodata td { justify-content: center; color: var(--g4); }
#tanstackTable td:has(button) > div { min-width: fit-content; }
.operate-btn { gap: .5rem; justify-content: flex-start; }
.operate-btn button { min-height: 0; min-width: 2rem; height: 2rem; width: 2rem; padding: .3rem; }
.operate-btn button svg { font-size: 1.4rem; }
#tanstackTable td button:not(.toggle):not(.operate) { min-height: auto; height: 2.4rem; padding: .3rem .6rem; }
.selectable { font-weight: bold; text-decoration: underline; cursor: pointer; transition: color .1s; position: relative; padding-left: 1.5rem; }

.vertical > span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vertical > span:first-child { padding-bottom: .275rem; }
.vertical .small { font-size: 1.2rem; }
.vertical .large { font-size: 1.5rem; }
.badge-reception { background: var(--g5); display: inline-block; color: #fff; padding: .2rem .5rem; border-radius: .3rem; font-size: 1.1rem; margin-right: .2rem; }
#tablePagination { min-height: 2.6rem; margin: 1.6rem 0 1rem; gap: .8rem; display: flex; justify-content: center; align-items: center; }
#tablePagination ul { display: flex; align-items: center; }
#tablePagination li { cursor: pointer; margin: .3rem; padding: .2rem .5rem; color: var(--g4); transition: color .1s; }
#tablePagination li.active { color: var(--navy); font-size: 1.4rem; font-weight: bold; }
#tablePagination li:hover { color: var(--g3); }

/* 라이브 채널 목록 컬럼 비율 (원본 화면과 동일) */
#liveChannel th:nth-child(1), #liveChannel td:nth-child(1) { flex: .03; }

#liveChannel th:nth-child(4), #liveChannel td:nth-child(4),
#liveChannel th:nth-child(5), #liveChannel td:nth-child(5) { flex: .07; }
#liveChannel th:nth-child(6), #liveChannel td:nth-child(6),

#liveChannel th:nth-child(9), #liveChannel td:nth-child(9),
#liveChannel th:nth-child(10), #liveChannel td:nth-child(10) { flex: .06; }
#liveChannel th:nth-child(11), #liveChannel td:nth-child(11) { flex: .18; }

.status-use::after, .status-disuse::after { display: none; }

/* ================= 상세 ================= */
.detail-container { display: flex; width: 100%; min-height: 60rem; }
.detail-wrapper { width: 100%; flex: 1; display: flex; }
.detail-wrapper.column { flex-direction: column; }
.detail-area { background: #fff; border-radius: .4rem; border: 1px solid var(--g6); flex-direction: column; position: relative; }
.detail-area:first-child { margin-right: 1.2rem; width: 30%; min-width: 33rem; }
.detail-area:last-child { width: 70%; display: flex; margin-right: 0; }
.detail-box { width: 100%; padding: 1.6rem 1.6rem 2rem; position: relative; }
.detail-box::after { content: ''; width: 100%; height: .1rem; background: var(--g6); position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
.detail-wrapper.column .detail-box::after { width: calc(100% - 4rem); }
.detail-box:last-child::after { display: none; }
.detail-box-header { margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; display: flex; justify-content: space-between; align-items: center; }
.detail-box-header .title { font-weight: 600; font-size: 1.7rem; }
.group-wrapper.info { flex-wrap: wrap; gap: 1.6rem; display: flex; justify-content: space-between; }
.group-wrapper.info .label-form:has(.toggle) { display: flex; justify-content: flex-start; align-items: center; }
.group-wrapper.info .label-form:has(.toggle) > p { margin: 0 .625rem 0 0; }
.menu-box-protocol { width: 100%; height: 3rem; border: 1px solid rgba(226,226,233,.6); border-radius: .4rem; padding: .4rem .6rem; background: #fbfbfc; display: flex; align-items: center; }
.content-tab { height: auto; max-width: 6.8rem; background: #f8f8f9; border: 1px solid var(--g6); border-right: 0; border-radius: .4rem 0 0 .4rem; }
.content-tab + .detail-area { border-radius: 0 .4rem .4rem 0; max-width: calc(100% - 41.8rem); }
.content-tab ul { padding: .3rem .6rem; width: 100%; }
.content-tab li { min-width: 5.5rem; min-height: 5.5rem; margin: .5rem 0; color: var(--g3); font-size: 1.3rem; border-radius: .4rem; cursor: pointer; transition: all .1s; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.content-tab li svg { margin-bottom: .5rem; font-size: 1.7rem; }
.content-tab li span { white-space: pre-line; text-align: center; }
.content-tab li span.small { font-size: 1.2rem; }
.content-tab li:hover { color: rgba(93,135,255,.8); }
.content-tab li.active { background: #fff; color: var(--primary); font-weight: 600; }
.content-tab li.non-active { cursor: default; color: var(--g4); }
.setting-info, .drm-info { width: 100%; display: flex; justify-content: space-between; }
.drm-info, .cdn-info { border-top: 1px solid var(--g6); }
.drm-info { position: relative; flex: 1; }
.drm-info-notice { color: var(--red); font-size: 1.2rem; margin-bottom: 2rem; display: flex; align-items: center; }
.drm-info-notice svg { margin-right: .2rem; }
.nodata { min-height: 15.5rem; display: flex; justify-content: center; align-items: center; color: var(--g4); font-weight: 600; font-size: 1.4rem; }
.record-table #tanstackTable table, .log-table #tanstackTable table, .platform-table #tanstackTable table { min-width: 0; }
.record-table th, .record-table td { flex: .3 !important; }
.record-table th:first-child, .record-table td:first-child { flex: .1 !important; }
.record-table th:nth-child(3), .record-table td:nth-child(3) { flex: 1.3 !important; }
.record-table th:nth-child(5), .record-table td:nth-child(5) { flex: .4 !important; }
.log-table th, .log-table td { flex: .3 !important; }
.log-table th:nth-child(3), .log-table td:nth-child(3) { flex: 1.5 !important; }
.log-table th:nth-child(4), .log-table td:nth-child(4) { flex: .5 !important; }
.log-table th:nth-child(5), .log-table td:nth-child(5) { flex: .7 !important; }
.log-table td > div { padding: .5rem 0 !important; }
.log-table + .detail-box { padding-bottom: 4rem; }
.log-table + .detail-box .label-box { display: flex; width: 100%; }
.platform-table th, .platform-table td { flex: .4 !important; }
.platform-table th:nth-child(2), .platform-table td:nth-child(2) { flex: 1 !important; }
.platform-table th:nth-child(3), .platform-table td:nth-child(3) { flex: .7 !important; }

/* ================= 알림·토스트 ================= */
#confirm { display: none; }
#confirm.active {
    position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 100000; padding: 0 11%;
    display: flex; align-items: center; animation: fade .2s;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.confirm-box {
    background: #fff; max-width: 40rem; width: calc(100% - 4rem); min-height: 19.6rem; border-radius: 5px; box-shadow: 0 0 5px rgba(104,110,129,.2);
    padding: 1.8rem 2.6rem 1.5rem; margin: auto; white-space: pre-line; font-size: 1.6rem; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
}
.confirm-box .title { color: var(--primary); font-size: 2rem; font-weight: 600; }
.confirm-box .text-container { margin: 1rem 0 2.4rem; min-height: 5rem; text-align: center; padding: 1.2rem 0 0; display: flex; align-items: center; }
.confirm-box .button-container { width: 100%; padding: 0 1.2rem; display: flex; justify-content: space-between; }
.confirm-box .button-container.single { justify-content: center; }
.confirm-box .button-container button { height: 3.6rem; max-width: 15rem; width: 100%; margin-left: 1rem; }
.confirm-box .button-container button:first-child { margin-left: 0; }
#toast {
    display: none; position: fixed; bottom: 2rem; right: 1.6rem; margin-left: 1.6rem; z-index: 10000; border-radius: 1rem; padding: 2rem;
    background: rgba(230,236,255,.8); backdrop-filter: blur(.6rem); border: 1px solid var(--primary); max-width: 64rem; word-break: break-all; align-items: center;
}
#toast.active { display: flex; animation: slide .25s; }
@keyframes slide { from { transform: translateX(2rem); opacity: 0; } to { transform: none; opacity: 1; } }
#toast p { font-weight: 600; display: flex; align-items: center; }
#toast svg { color: var(--primary); font-size: 3rem; margin-right: 1rem; }

/* ================= 반응형 (원본과 같은 구간) ================= */
@media (max-width: 1200px) {
    .detail-container { flex-direction: column; }
    .detail-area, .detail-area:first-child, .detail-area:last-child { width: 100%; min-width: auto; margin-right: 0; }
    .detail-area:first-child { margin-bottom: 2rem; }
    .content-tab { width: 100%; max-width: none; border-right: 1px solid var(--g6); border-bottom: 0; border-radius: .4rem .4rem 0 0; }
    .content-tab ul { display: flex; flex-flow: row wrap; padding: .6rem; }
    .content-tab li { margin: 0 1rem; }
    .content-tab + .detail-area { max-width: none; border-radius: 0 0 .4rem .4rem; }
}
@media (max-width: 768px) {
    #headerInfo { padding: 0 2rem; }
    #headerInfo .user-guide p, .info-box p, .preview-chip { display: none; }
}
@media (max-width: 425px) {
    html { font-size: 2.4vw; }
    #sideMenu { display: none; }
    #mainWrapper.mob-open #sideMenu { display: flex; position: fixed; top: 0; left: 0; }
    #mainWrapper.mob-open #sideMenu .fold-btn { display: none; }
    #headerInfo, #mainWrapper.lnb-fold #headerInfo { width: 100%; }
    .main, #mainWrapper.lnb-fold .main { width: 100%; }
    #headerInfo .mobile-menu-btn { display: flex; }
}
</style>

const icon = (name, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 256 256">${ICONS[name]}</svg>`

/* ================= 더미 데이터 ================= */
// 상태 코드 → 이름·배지 (원본 화면의 상태 배지 매핑과 같다)
const STATUS = {
    LCC: { name: '생성중', badge: 'ready' },
    LCW: { name: '대기', badge: 'idle' },
    LCR: { name: '송출중', badge: 'publish' },
    LCS: { name: '정지', badge: 'stop' },
    LCF: { name: '생성 실패', badge: 'failed' },
    LCB: { name: '예약 송출', badge: 'reserved' },
}
const TYPES = { LIVE: 'Live', VODTOLIVE: 'VODToLive', RESTREAM: 'Re-Stream' }
const CATEGORIES = ['뉴스', '스포츠', '교육', '예능', '쇼핑']
const YN = { Y: '사용', N: '미사용' }
const NAMES = [
    ['morning_news', '아침 뉴스 라이브'], ['baseball_main', '프로야구 메인 중계'], ['math_live', '수학 실시간 강의'],
    ['prime_shopping', '프라임 쇼핑 라이브'], ['music_stage', '주말 음악 무대'], ['esports_final', 'e스포츠 결승전'],
    ['weather_now', '실시간 날씨'], ['kids_story', '어린이 동화 채널'], ['cooking_class', '오늘의 쿠킹 클래스'],
    ['tech_talk', '테크 토크 세미나'], ['concert_replay', '콘서트 다시보기 편성'], ['movie_night', '심야 영화 편성'],
    ['game_simulcast', '게임 동시 송출'], ['global_news_relay', '글로벌 뉴스 동시 송출'], ['quiz_show', '실시간 퀴즈쇼'],
]
const STATUS_CYCLE = ['LCR', 'LCR', 'LCS', 'LCW', 'LCR', 'LCF', 'LCS', 'LCC', 'LCR', 'LCS', 'LCR', 'LCW']
const pad = n => String(n).padStart(2, '0')

let channels = NAMES.map(([name, view], i) => {
    const type = [10, 11].includes(i) ? 'VODTOLIVE' : [12, 13].includes(i) ? 'RESTREAM' : 'LIVE'
    return {
        idx: i + 1,
        id: `lc-${(0x3a1f + i * 7919).toString(16)}`,
        name, view, type,
        status: type === 'VODTOLIVE' ? ['LCB', 'LCR', 'LCS'][i % 3] : STATUS_CYCLE[i % STATUS_CYCLE.length],
        protocol: type === 'RESTREAM' ? ['RTMP'] : i % 4 === 0 ? ['HLS', 'LL-HLS'] : ['HLS', 'DASH'],
        category: i % 6 === 5 ? '' : CATEGORIES[i % 5],
        bucket: `demo-live-${'abc'[i % 3]}`,
        dvr: i % 3 !== 2 ? 'Y' : 'N',
        rec: i % 2 === 0 ? 'Y' : 'N',
        drm: i % 4 === 1 ? 'Y' : 'N',
        clip: i % 3 === 0 ? 'N' : 'Y',
        global: i % 5 === 0 ? 'Y' : 'N',
        emergency: i % 7 === 0 ? 'Y' : 'N',
        prism: 'N',
        template: i % 4 === 2 ? 'Y' : 'N',
        segDuration: '4',
        segCount: '5',
        updater: ['admin01', 'operator02', 'manager03'][i % 3],
        update: `2026-11-${pad(18 - Math.floor(i / 3))} ${pad(9 + (i % 9))}:${pad((i * 17) % 60)}:${pad((i * 29) % 60)}`,
        created: `2026-10-${pad(28 - (i % 20))} 10:${pad((i * 13) % 60)}:00`,
        desc: `${view} 채널입니다. (더미 설명)`,
    }
})

/* ================= 상태 ================= */
const MAX_TAB = 20
const PAGE_SIZE = 10
const EMPTY_COND = { type: 'id', keyword: '', start: '', end: '', status: '', category: '', dvr: '', rec: '', drm: '' }
const LIST_TAB = { key: 'list', name: '채널 관리', path: ['LIVE', '채널 관리'] }
const state = {
    tabs: [{ ...LIST_TAB }],
    active: 'list',
    cond: { ...EMPTY_COND },
    applied: { ...EMPTY_COND },
    searchOpen: false,
    typeTab: '',
    page: 1,
    checked: new Set(),
    detail: {},
    expanded: new Set(['live']),
    fold: false,
}
const findChannel = id => channels.find(ch => ch.id === id)
const activeDetailId = () => (state.active.startsWith('detail:') ? state.active.slice(7) : null)

/* ================= 공통 마크업 ================= */
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const options = (items, selected) => items.map(([value, label]) => `<option value="${esc(value)}"${value === selected ? ' selected' : ''}>${esc(label)}</option>`).join('')
const statusBadge = code => `<div class="status status-${STATUS[code].badge}">${STATUS[code].name}</div>`
const ynBadge = v => `<div class="status status-${v === 'Y' ? 'use' : 'disuse'}">${YN[v]}</div>`
const labelForm = (title, control, cls = '') => `<div class="label-form ${cls}">${title === null ? '' : `<p><span class="title">${title}</span></p>`}<div>${control}</div></div>`
const labelBox = (inner, cls = 'divider-box') => `<div class="label-box ${cls}">${inner}</div>`
const readonly = value => `<input value="${esc(value)}" disabled>`
const copyBtn = value => `<button class="btn-gray border icon" data-act="copy" data-text="${esc(value)}">${icon('PiCopySimpleDuotone')}<p>복사</p></button>`
const copyable = value => readonly(value) + copyBtn(value)
const checkbox = (id, checked, act) => `<div class="check-box"><input type="checkbox" id="cb_${id}" data-act="${act}" data-id="${id}"${checked ? ' checked' : ''}><label for="cb_${id}">${icon('PiCheckBold')}</label></div>`

function table(headers, rows, emptyMessage) {
    return `<div id="tanstackTable" class="scroll"><table>
        <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${rows.length
            ? rows.map(cells => `<tr>${cells.map(cell => `<td><div>${cell}</div></td>`).join('')}</tr>`).join('')
            : `<tr class="table-nodata"><td>${emptyMessage}</td></tr>`}</tbody>
    </table></div>`
}
const pagination = (page, totalPage) => totalPage < 1 ? '' : `<div id="tablePagination"><ul>${Array.from({ length: totalPage }, (_, i) =>
    `<li data-act="page" data-page="${i + 1}" class="${page === i + 1 ? 'active' : ''}">${i + 1}</li>`).join('')}</ul></div>`

/* ================= 알림·토스트 ================= */
let toastTimer
function toast(message) {
    document.getElementById('toastMessage').textContent = message
    const el = document.getElementById('toast')
    el.classList.add('active')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => el.classList.remove('active'), 2500)
}

let modalConfirm = null
function showConfirm(message, onConfirm) {
    document.getElementById('confirmMessage').textContent = message
    // 확인만 있는 알림(onConfirm 없음)은 취소 버튼을 숨긴다.
    document.querySelector('[data-act="modal-cancel"]').style.display = onConfirm ? '' : 'none'
    document.getElementById('confirmButtons').classList.toggle('single', !onConfirm)
    modalConfirm = onConfirm
    document.getElementById('confirm').classList.add('active')
}
const showAlert = message => showConfirm(message, null)
function closeModal(ok) {
    document.getElementById('confirm').classList.remove('active')
    const fn = modalConfirm
    modalConfirm = null
    if (ok && fn) fn()
}
function copyText(text) {
    const done = () => toast(`${text} 문구가 복사되었습니다.`)
    navigator.clipboard?.writeText(text).then(done, done) ?? done()
}

    const index = state.tabs.findIndex(tab => tab.key === key)
    if (index < 0) return
    state.tabs.splice(index, 1)
    if (state.active === key) state.active = state.tabs[Math.min(index, state.tabs.length - 1)]?.key ?? ''
    if (key.startsWith('detail:')) delete state.detail[key.slice(7)]
    render()
}

function filteredByCondition() {
    const c = state.applied
    const keyword = c.keyword.trim().toLowerCase()
    return channels.filter(ch => {
        if (keyword) {
            const target = { id: ch.id, name: `${ch.name} ${ch.view}`, bucket: ch.bucket, updater: ch.updater }[c.type]
            if (!target.toLowerCase().includes(keyword)) return false
        }
        const day = ch.update.slice(0, 10)
        if (c.start && day < c.start) return false
        if (c.end && day > c.end) return false
        if (c.status && ch.status !== c.status) return false
        if (c.category === '0' ? ch.category !== '' : c.category && ch.category !== c.category) return false
        return ['dvr', 'rec', 'drm'].every(key => !c[key] || ch[key] === c[key])
    })
}

        labelForm('채널 ID', copyable(ch.id)),
        labelForm('카테고리명', `<select class="selectBox" data-draft="category">${options([['', '미할당'], ...CATEGORIES.map(n => [n, n])], d.category)}</select>`),
        labelBox(labelForm('채널 상태', readonly(STATUS[ch.status].name), 'divider')
            + labelForm('채널 타입', readonly(TYPES[ch.type])
                + (isLive && ch.status === 'LCR' ? `<button class="btn-blue border" data-act="preview-only">${icon('PiMonitorDuotone')}<p>모니터링</p></button>` : ''), 'divider')),
    ]
    if (!isRestream) {
        fields.push(labelBox(
            (isLive ? labelForm('클립 설정', readonly(YN[ch.clip])
                + (ch.status === 'LCR' && ch.clip === 'Y' ? `<button class="btn-yellow border" data-act="preview-only">${icon('PiFilmStripDuotone')}<p>클립</p></button>` : ''), 'divider') : '')
            + labelForm('프로토콜', `<div class="menu-box-protocol">${ch.protocol.map(p => `<span class="badge-reception">${p}</span>`).join('')}</div>`, 'divider')))
        fields.push(lowLatency
            ? labelBox(labelForm('Target delay', readonly('3'), 'divider'))
            : labelBox(
                labelForm('HLS Segment Duration', `<select class="selectBox" data-draft="segDuration">${options(['2', '4', '6', '8', '10'].map(v => [v, v]), d.segDuration)}</select>`, 'divider')
                + labelForm('HLS Segment Count', `<select class="selectBox" data-draft="segCount">${options(['2', '3', '4', '5', '6', '8', '10'].map(v => [v, v]), d.segCount)}</select>`, 'divider')))
    }
    if (isLive) fields.push(labelBox(labelForm('글로벌 여부', readonly(YN[ch.global]), 'divider') + labelForm('긴급 채널 여부', readonly(YN[ch.emergency]), 'divider') + labelForm('프리즘 채널 여부', readonly(YN[ch.prism]), 'divider')))
    if (isVodToLive) fields.push(labelBox(labelForm('프리즘 채널 여부', readonly(YN[ch.prism]), 'divider')))
    fields.push(labelBox(labelForm('수정 일시', readonly(ch.update))))
    if (isLive) fields.push(labelBox(labelForm('템플릿 사용', `<button class="short toggle${ch.template === 'Y' ? ' active' : ''}" data-act="template" data-id="${ch.id}" aria-label="템플릿 사용"></button>`)))

    return `<div class="detail-area">
        <div class="detail-wrapper column">
            <div class="detail-box">
                <div class="detail-box-header">
                    <p class="title">기본 정보</p>
                    <div class="btn-wrap gap-2">
                        ${ch.status === 'LCS' ? `<button class="btn-green border small" data-act="start" data-id="${ch.id}">${icon('PiPlayDuotone')}<p>시작</p></button>` : ''}
                        ${stoppable ? `<button class="btn-black border small" data-act="stop" data-id="${ch.id}">${icon('PiStopDuotone')}<p>정지</p></button>` : ''}
                        ${removable ? `<button class="btn-red border small" data-act="delete-one" data-id="${ch.id}">${icon('PiTrash')}<p>삭제</p></button>` : ''}
                    </div>
                </div>
                <div class="group-wrapper info">${fields.join('')}</div>
            </div>
            <div class="detail-box"><div class="group-wrapper info">
                ${labelForm('설명', `<textarea data-draft="desc" placeholder="설명을 입력하세요">${esc(d.desc)}</textarea>`)}
            </div></div>
        </div>
        <div class="btn-wrap bottom">
            <button class="btn-blue short" data-act="update" data-id="${ch.id}">${icon('PiNotePencilLight')}<p>수정</p></button>
            <button class="border btn-gray short" data-act="reset" data-id="${ch.id}">${icon('PiArrowCounterClockwise')}<p>초기화</p></button>
        </div>
    </div>`
}

function detailView(id) {
    const ch = findChannel(id)
    const detail = state.detail[id]
    if (!ch || !detail) return '<div class="empty-view">채널 정보를 찾을 수 없습니다.</div>'
    const tabs = detailTabs(ch)
    if (!tabs.some(([tabId]) => tabId === detail.tab) || isTabDisabled(ch, detail.tab)) detail.tab = 'config'

    return `<div class="live-channel-detail"><div class="detail-container">
        ${basicInfo(ch, detail.draft)}
        <div class="content-tab"><ul>
            ${tabs.map(([tabId, title, iconName]) => `<li data-act="ctab" data-tab="${tabId}" class="${detail.tab === tabId ? 'active' : ''}${isTabDisabled(ch, tabId) ? ' non-active' : ''}">
                ${icon(iconName)}<span class="${tabId === 'platform' ? 'small' : ''}">${title}</span></li>`).join('')}
        </ul></div>
        <div class="detail-area">${tabContent(ch, detail)}</div>
    </div></div>`
}

/* ================= 렌더 ================= */
function render() {
    renderLnb()
    renderTabs()
    const view = document.getElementById('mainView')
    const tab = state.tabs.find(t => t.key === state.active)
    if (!tab) {
        view.innerHTML = '<div class="empty-view"><p>열린 화면이 없습니다.<br>좌측 메뉴에서 <b>LIVE › 채널</b>을 선택하세요.</p></div>'
        return
    }
    const isDetail = tab.key.startsWith('detail:')
    view.innerHTML = `<div class="page-view ${isDetail ? 'detail' : 'list'}">
        <div id="pathWrapper">
            <div id="breadcrumb">${tab.path.map((name, i) => i === tab.path.length - 1
                ? `<span class="title">${esc(name)}</span>`
                : `<span>${esc(name)}${icon('PiCaretRight')}</span>`).join('')}</div>
            <button class="page-close-btn" data-act="tab-close" data-key="${esc(tab.key)}"><p>닫기</p></button>
        </div>
        <div class="page-body scroll">${isDetail ? detailView(tab.key.slice(7)) : listView()}</div>
    </div>`
}

/* ================= 동작 ================= */
function setStatus(id, status) {
    findChannel(id).status = status
    render()
    showAlert('완료되었습니다.')
}

function removeChannels(ids) {
    channels = channels.filter(ch => !ids.includes(ch.id))
    ids.forEach(id => {
        state.checked.delete(id)
        const key = `detail:${id}`
        state.tabs = state.tabs.filter(tab => tab.key !== key)
        delete state.detail[id]
        if (state.active === key) state.active = 'list'
    })
    render()
    showAlert('삭제되었습니다.')
}

function applySearch() {
    state.applied = { ...state.cond }
    state.page = 1
    render()
}

const actions = {
    fold: () => { state.fold = !state.fold; render() },
    'mob-menu': () => document.getElementById('mainWrapper').classList.toggle('mob-open'),
    group: el => {
        if (state.fold) return
        const id = el.dataset.group
        state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id)
        renderLnb()
    },
    'menu-live-channel': () => openTab({ ...LIST_TAB }),
    'menu-other': () => toast('미리보기에서는 LIVE › 채널 메뉴만 볼 수 있습니다.'),
    tab: el => { state.active = el.dataset.key; render() },
    'tab-close': el => closeTab(el.dataset.key),
    'close-others': () => {
        state.tabs = state.tabs.filter(tab => tab.key === state.active)
        Object.keys(state.detail).forEach(id => { if (`detail:${id}` !== state.active) delete state.detail[id] })
        render()
    },
    'close-all': () => { state.tabs = []; state.detail = {}; state.active = ''; render() },
    'preview-only': notInPreview,
    open: el => openDetail(el.dataset.id),
    search: applySearch,
    'search-reset': () => { state.cond = { ...EMPTY_COND }; render() },
    'search-fold': () => { state.searchOpen = !state.searchOpen; render() },
    'type-tab': el => { state.typeTab = el.dataset.type; state.page = 1; render() },
    page: el => { state.page = Number(el.dataset.page); render() },
    check: el => { el.checked ? state.checked.add(el.dataset.id) : state.checked.delete(el.dataset.id); render() },
    'check-all': el => {
        document.querySelectorAll('input[data-act="check"]').forEach(box => el.checked ? state.checked.add(box.dataset.id) : state.checked.delete(box.dataset.id))
        render()
    },
    'delete-checked': () => {
        const targets = channels.filter(ch => state.checked.has(ch.id))
        const allowed = targets.every(ch => (ch.type === 'VODTOLIVE' ? ['LCW', 'LCF'] : ['LCW', 'LCS', 'LCF']).includes(ch.status))
        if (!allowed) return showAlert('준비, 생성 실패, 정지(VODToLive 제외)인\n채널 상태만 삭제 가능합니다.')
        showConfirm(`선택한 채널${targets.length > 1 ? ` ${targets.length}개를` : '을'} 삭제하시겠습니까?`, () => removeChannels(targets.map(ch => ch.id)))
    },
    'delete-one': el => showConfirm('채널을 삭제하시겠습니까?', () => removeChannels([el.dataset.id])),
    start: el => showConfirm('채널을 시작합니다.', () => setStatus(el.dataset.id, 'LCR')),
    stop: el => showConfirm('채널을 정지합니다.', () => setStatus(el.dataset.id, 'LCS')),
    copy: el => copyText(el.dataset.text),
    template: el => {
        const ch = findChannel(el.dataset.id)
        showConfirm(ch.template === 'Y' ? '템플릿 미사용으로 설정하시겠습니까?' : '템플릿 사용으로 설정하시겠습니까?', () => {
            ch.template = ch.template === 'Y' ? 'N' : 'Y'
            render()
        })
    },
    update: el => showConfirm('수정하시겠습니까?', () => {
        const ch = findChannel(el.dataset.id)
        const { category, segDuration, segCount, desc } = state.detail[ch.id].draft
        const now = new Date()
        Object.assign(ch, {
            category, segDuration, segCount, desc, updater: 'demo_user',
            update: `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`,
        })
        render()
        showAlert('수정되었습니다.')
    }),
    reset: el => { state.detail[el.dataset.id].draft = { ...findChannel(el.dataset.id) }; render() },
    ctab: el => {
        if (el.classList.contains('non-active')) return
        const detail = state.detail[activeDetailId()]
        detail.tab = el.dataset.tab
        detail.log = null
        render()
    },
    log: el => { state.detail[activeDetailId()].log = Number(el.dataset.log); render() },
    'modal-ok': () => closeModal(true),
    'modal-cancel': () => closeModal(false),
}

document.addEventListener('click', event => {
    const el = event.target.closest('[data-act]')
    if (!el || el.disabled) return
    // 체크박스는 label 클릭이 input 클릭을 한 번 더 만들므로 input에서만 처리한다.
    if (el.matches('input[type="checkbox"]') !== (event.target.tagName === 'INPUT')) return
    actions[el.dataset.act]?.(el)
})

// 입력값은 다시 그리지 않고 상태에만 담는다(입력 중 포커스 유지).
const onInput = event => {
    const el = event.target
    if (el.dataset.cond) state.cond[el.dataset.cond] = el.value
    if (el.dataset.draft) state.detail[activeDetailId()].draft[el.dataset.draft] = el.value
}
document.addEventListener('input', onInput)
document.addEventListener('change', event => {
    onInput(event)
    if (event.target.dataset.detail === 'quality') {
        state.detail[activeDetailId()].quality = event.target.value
        render()
    }
})
document.addEventListener('keydown', event => {
    if (event.key === 'Enter' && event.target.dataset?.cond === 'keyword') applySearch()
    if (event.key === 'Escape') closeModal(false)
})

// 좁은 화면(태블릿 폭)에서는 원본처럼 LNB를 접어서 시작한다.
state.fold = window.innerWidth <= 768 && window.innerWidth > 425
render()
</script>
</body>
</html>
